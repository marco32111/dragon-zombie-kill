<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dylan's Element Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: a night-shift chemistry lab turned arcade. One column of game panels; the periodic table scrolls sideways inside its own frame. */
:root{
  --ink:#151935; --panel:#1f2548; --panel-2:#293060; --line:#3b4380;
  --text:#eef0ff; --muted:#a8aed6; --accent:#ffcf5a; --accent-ink:#2a1f00;
  --good:#4fdc9a; --bad:#ff6b7a;
  --c-alkali:#ff8a65; --c-alkaline:#ffb74d; --c-transition:#7fb2ff; --c-post:#8fd9c4;
  --c-metalloid:#c7e07a; --c-nonmetal:#5fe3d3; --c-halogen:#f2a2ff; --c-noble:#b79cff;
  --c-lanthanide:#ff9ec4; --c-actinide:#f5c38b;
  --f-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ink);color:var(--text)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;
  background-image:radial-gradient(circle at 15% 0%,#2a2f66 0,transparent 45%),radial-gradient(circle at 90% 20%,#1e3b55 0,transparent 40%);
  background-attachment:fixed;min-height:100vh}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.5px;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.small{font-size:13px}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* header */
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:52px;height:52px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:26px;position:relative;box-shadow:0 4px 0 #c99a1f}
.brand .logo small{position:absolute;top:3px;left:6px;font:800 10px var(--f-body)}
.brand h1{font-size:clamp(24px,5vw,34px);line-height:1}
.brand p{margin:2px 0 0;color:var(--muted);font-size:14px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip b{color:var(--accent)}
.iconbtn{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px}
nav.tabs{display:flex;gap:6px;background:var(--panel);padding:6px;border-radius:999px;border:1px solid var(--line);width:max-content;max-width:100%;overflow-x:auto}
nav.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-weight:800;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}

/* home */
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.hero h2{font-size:clamp(22px,4.5vw,32px)}
.hero p{margin:6px 0 0;max-width:60ch;color:var(--muted)}
.levelbar{height:12px;background:var(--panel-2);border-radius:999px;overflow:hidden;margin-top:10px}
.levelbar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#ff9f43);border-radius:999px}
.sechead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sechead h2{font-size:26px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.mode{text-align:left;background:var(--panel-2);border:2px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;transition:transform .12s,border-color .12s}
.mode:hover{transform:translateY(-2px);border-color:var(--accent)}
.mode.arcade{background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 14%,var(--panel-2)),var(--panel-2) 70%)}
.mode .pic{font-size:34px;line-height:1}
.mode h3{font-size:21px}
.mode p{margin:0;color:var(--muted);font-size:14px}
.mode .best{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.5px;text-transform:uppercase}
.settings{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.seg{display:flex;background:var(--panel-2);border-radius:999px;padding:4px;border:1px solid var(--line);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-weight:800;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--ink)}
.label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.toggle{display:flex;gap:8px;align-items:center;font-weight:800;font-size:14px}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}

/* shared game bits */
.gamebar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.progress{flex:1 1 200px;display:flex;gap:4px}
.progress i{flex:1;height:10px;border-radius:999px;background:var(--panel-2)}
.progress i.ok{background:var(--good)} .progress i.no{background:var(--bad)} .progress i.now{background:var(--accent)}
.streak{font-family:var(--f-display);font-size:20px;color:#ffb347}
.card{display:grid;gap:18px;justify-items:center;text-align:center}
.prompt-q{font-family:var(--f-display);font-size:clamp(22px,4vw,28px)}
.bigpic{font-size:clamp(72px,16vw,110px);line-height:1.1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}
.clue{max-width:52ch;font-size:18px;font-weight:600;background:var(--panel-2);border-radius:12px;padding:12px 16px}
.tile{--c:var(--c-transition);width:150px;aspect-ratio:1;max-width:100%;border-radius:16px;border:3px solid var(--c);
  background:color-mix(in srgb,var(--c) 22%,var(--panel));display:grid;grid-template-rows:auto 1fr auto;padding:10px;text-align:left}
.tile .n{font-weight:800;font-size:16px}
.tile .s{font-family:var(--f-display);font-size:64px;line-height:1;text-align:center;align-self:center}
.tile .nm{text-align:center;font-weight:800;font-size:14px;color:var(--muted)}
.formula{font-family:var(--f-display);font-size:clamp(48px,11vw,80px);line-height:1;letter-spacing:1px}
.formula sub,.f sub{font-size:.5em}
.bigname{font-family:var(--f-display);font-size:clamp(34px,7vw,52px);line-height:1.1}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:620px}
.opt{background:var(--panel-2);border:2px solid var(--line);border-radius:12px;padding:14px 12px;font-weight:800;font-size:18px;display:flex;gap:10px;align-items:center;justify-content:center;min-height:62px;transition:transform .1s}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateY(-2px)}
.opt .k{font-size:11px;background:var(--line);border-radius:6px;padding:1px 6px;color:var(--muted)}
.opt.sym{font-family:var(--f-display);font-size:30px;font-weight:400}
.opt.correct{background:color-mix(in srgb,var(--good) 30%,var(--panel-2));border-color:var(--good)}
.opt.wrong{background:color-mix(in srgb,var(--bad) 30%,var(--panel-2));border-color:var(--bad);animation:shake .35s}
.opt.gone{opacity:.2}
.opt:disabled{cursor:default}
.typebox{display:flex;gap:8px;width:100%;max-width:460px}
.typebox input,.search{flex:1;min-width:0;background:var(--ink);border:2px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--text);font:800 20px var(--f-body)}
.search{font-size:15px;padding:8px 12px;flex:0 1 240px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 20px;font-weight:800;font-size:17px;box-shadow:0 4px 0 #c99a1f}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #c99a1f}
.btn.ghost{background:transparent;color:var(--text);border:2px solid var(--line);box-shadow:none}
.btn.sm{padding:6px 14px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.helpers{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.helpers button{background:transparent;border:1px dashed var(--line);border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px;color:var(--muted)}
.helpers button:disabled{opacity:.35;cursor:default}
.hinttext{color:var(--accent);font-weight:800}
.feedback{width:100%;max-width:620px;border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;text-align:left;animation:pop .25s}
.feedback.good{background:color-mix(in srgb,var(--good) 18%,var(--panel));border:2px solid var(--good)}
.feedback.bad{background:color-mix(in srgb,var(--bad) 15%,var(--panel));border:2px solid var(--bad)}
.feedback .fpic{font-size:52px;line-height:1}
.feedback h3{font-size:22px}
.feedback p{margin:2px 0 0}
.points{font-family:var(--f-display);color:var(--good)}
.gamer{background:color-mix(in srgb,var(--c-halogen) 14%,var(--panel-2));border:1px solid var(--c-halogen);border-radius:10px;padding:8px 12px;margin-top:8px;font-size:14px;max-width:60ch}
.gamer b{color:var(--c-halogen)}

/* periodic table */
.tablewrap{overflow-x:auto;padding-bottom:6px}
.ptable{display:grid;grid-template-columns:repeat(18,minmax(44px,1fr));grid-template-rows:repeat(7,auto) 12px repeat(2,auto);gap:3px;min-width:820px}
.el{--c:var(--c-transition);position:relative;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 20%,var(--panel));border-radius:7px;padding:3px 2px 2px;display:flex;flex-direction:column;align-items:center;line-height:1.05;min-height:52px;color:var(--text);transition:opacity .15s,transform .1s}
.el .n{font-size:9px;font-weight:800;align-self:flex-start;padding-left:2px;opacity:.85}
.el .s{font-family:var(--f-display);font-size:19px}
.el .nm{font-size:7.5px;font-weight:800;opacity:.8;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.el:hover{background:color-mix(in srgb,var(--c) 45%,var(--panel));transform:scale(1.08);z-index:2}
.el.sel{outline:3px solid var(--accent);outline-offset:1px;z-index:3}
.el.dim{opacity:.2}
.el.hit{background:var(--good);border-color:var(--good);color:var(--ink)}
.el.miss{background:var(--bad);border-color:var(--bad);color:var(--ink)}
.el.glow{animation:glow 1s infinite alternate}
.el .stars{position:absolute;top:1px;right:3px;font-size:8px;color:var(--accent);letter-spacing:-1px}
.el.ph{border-style:dashed;background:transparent;justify-content:center;font-size:9px;font-weight:800;color:var(--muted);--c:var(--line)}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fchip{--c:var(--line);border:2px solid var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);border-radius:999px;padding:3px 10px;font-weight:800;font-size:12px;color:var(--text)}
.fchip[aria-pressed="true"]{background:var(--c);color:var(--ink)}
.detail{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:20px;align-items:center}
.detail .bigpic{font-size:80px}
.detail h2{font-size:32px}
.detail p{margin:4px 0 0;max-width:60ch}
.kv{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.kv span{background:var(--panel-2);border-radius:8px;padding:4px 10px;font-weight:800;font-size:13px}
.bohr{width:170px;height:170px;display:block}
.orbit{transform-box:view-box;transform-origin:50% 50%;animation:spin linear infinite}

/* compounds */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.cmp{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.cmp .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cmp .f{font-family:var(--f-display);font-size:28px;line-height:1;overflow-wrap:anywhere}
.cmp .e{font-size:34px;line-height:1}
.cmp h3{font-size:18px}
.cmp p{margin:0;font-size:14px;color:var(--muted)}
.atoms{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.atoms span{font-weight:800;font-size:12px;border-radius:6px;padding:2px 7px;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 22%,var(--panel))}

/* results */
.results{text-align:center;display:grid;gap:14px;justify-items:center}
.starsbig{font-size:54px;letter-spacing:6px}
.starsbig .off{opacity:.2}
.scorebig{font-family:var(--f-display);font-size:56px;color:var(--accent);line-height:1}
.missed{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;width:100%;text-align:left}
.missed div{background:var(--panel-2);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.missed .p{font-size:34px}
.missed b{display:block}
.missed small{color:var(--muted)}

/* blaster */
.stage{position:relative;border-radius:12px;overflow:hidden;border:2px solid var(--line);background:#0b0e24;touch-action:none;user-select:none;-webkit-user-select:none}
.stage canvas{display:block;width:100%}
.overlay{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:10px;background:rgba(10,12,30,.86);text-align:center;padding:16px;overflow-y:auto}
.overlay h2{font-size:32px}
.target{font-family:var(--f-display);font-size:clamp(18px,4vw,24px);flex:1 1 220px;text-align:center}
.target b{color:var(--accent)}
.touchpad{display:none;gap:8px}
.touchpad button{flex:1;background:var(--panel-2);border:2px solid var(--line);border-radius:12px;padding:14px;font-weight:800;font-size:18px;touch-action:manipulation}
@media (pointer:coarse){.touchpad{display:flex}}

/* boss */
.arena{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.fighter{display:grid;justify-items:center;gap:6px;text-align:center;position:relative;min-width:0}
.fighter .avatar{font-size:clamp(60px,13vw,104px);line-height:1}
.fighter.hit .avatar{animation:shake .4s}
.fighter h3{font-size:20px}
.hp{width:100%;max-width:240px;height:14px;background:var(--panel-2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.hp span{display:block;height:100%;background:var(--good);transition:width .4s}
.hp.boss span{background:var(--bad)}
.vs{font-family:var(--f-display);font-size:30px;color:var(--accent)}
.dmg{position:absolute;top:0;left:50%;font-family:var(--f-display);font-size:28px;animation:float 1.1s forwards;pointer-events:none;white-space:nowrap}
.taunt{font-style:italic;color:var(--muted);font-size:14px;max-width:32ch;margin:0}
.timer{height:8px;background:var(--panel-2);border-radius:999px;overflow:hidden;width:100%;max-width:620px}
.timer span{display:block;height:100%;background:var(--accent);width:100%;animation:drain linear forwards}
.timer.stop span{animation-play-state:paused}
.bosses{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.bosscard{text-align:center;background:var(--panel-2);border:2px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:6px;justify-items:center}
.bosscard:hover:not(:disabled){border-color:var(--bad)}
.bosscard .avatar{font-size:64px;line-height:1}
.bosscard:disabled{opacity:.45;cursor:not-allowed}
.bosscard .tag{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--accent)}

/* memory */
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:560px;margin:0 auto;width:100%}
.mcard{aspect-ratio:1;perspective:600px;border:0;background:transparent;padding:0}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mcard.up .in,.mcard.done .in{transform:rotateY(180deg)}
.mcard .back,.mcard .face{position:absolute;inset:0;border-radius:12px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mcard .back{background:repeating-linear-gradient(45deg,var(--panel-2) 0 10px,var(--line) 10px 20px);border:2px solid var(--line);font-size:28px}
.mcard:hover .back{border-color:var(--accent)}
.mcard .face{--c:var(--c-transition);transform:rotateY(180deg);border:2px solid var(--c);background:color-mix(in srgb,var(--c) 22%,var(--panel));padding:4px;text-align:center;align-content:center;gap:2px}
.mcard .face .s{font-family:var(--f-display);font-size:clamp(26px,7vw,42px);line-height:1}
.mcard .face .n{font-size:11px;font-weight:800;opacity:.8}
.mcard .face .p{font-size:clamp(22px,6vw,36px);line-height:1}
.mcard .face .nm{font-weight:800;font-size:clamp(9px,2.5vw,13px);line-height:1.1}
.mcard.done .face{background:color-mix(in srgb,var(--good) 30%,var(--panel));border-color:var(--good)}
.infoline{min-height:48px;text-align:center;font-weight:600;max-width:60ch;margin:0 auto}

/* crafter */
.bench{width:100%;max-width:620px;min-height:110px;border:3px dashed var(--line);border-radius:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:14px;background:var(--panel-2)}
.bench.ok{border-color:var(--good);border-style:solid}
.atom{--c:var(--c-nonmetal);width:46px;height:46px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.6) 0 12%,var(--c) 45%,color-mix(in srgb,var(--c) 55%,#000) 100%);color:#151935;font-family:var(--f-display);font-size:17px;animation:pop .2s;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.palette{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:640px}
.pal{--c:var(--c-transition);width:68px;height:68px;border-radius:12px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 22%,var(--panel));display:grid;place-items:center;align-content:center;padding:2px}
.pal .s{font-family:var(--f-display);font-size:24px;line-height:1}
.pal .nm{font-size:10px;font-weight:800;color:var(--muted)}
.pal:hover{transform:translateY(-2px)}
.counts{font-weight:800;color:var(--muted);font-size:14px;min-height:21px}

/* showdown */
.duel{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:stretch;width:100%;max-width:640px}
.dcard{--c:var(--c-transition);background:color-mix(in srgb,var(--c) 16%,var(--panel-2));border:3px solid var(--c);border-radius:16px;padding:18px 10px;display:grid;gap:4px;justify-items:center;transition:transform .12s}
.dcard:hover:not(:disabled){transform:translateY(-3px)}
.dcard .p{font-size:52px;line-height:1}
.dcard .s{font-family:var(--f-display);font-size:40px;line-height:1}
.dcard .nm{font-weight:800}
.dcard .val{font-family:var(--f-display);font-size:22px;color:var(--accent);min-height:30px}
.dcard.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 25%,var(--panel-2))}
.dcard.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 22%,var(--panel-2))}
.dcard:disabled{cursor:default}

/* trophies */
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.trophy{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px}
.trophy.got{border-color:var(--accent)}
.trophy.locked{opacity:.45;filter:grayscale(1)}
.trophy .p{font-size:36px;line-height:1}
.trophy b{display:block}
.trophy small{color:var(--muted)}

/* daily quests, crates, collection, shop */
.quests{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.quest{display:flex;gap:10px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.quest.done{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--panel-2))}
.quest .qi{font-size:24px}

  let h=7; for(const ch of today) h=(h*31+ch.charCodeAt(0))>>>0;
  const pick=[];
  while(pick.length<3){ h=(Math.imul(h,1103515245)+12345)>>>0; const id=QUESTS[(h>>>8)%QUESTS.length].id; if(!pick.includes(id)) pick.push(id); }
  P.daily={date:today,ids:pick,prog:{},done:{},bonus:false}; save();
}

let AC=null;
function tone(seq){
  if(P.muted) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    let t=AC.currentTime;
    seq.forEach(([f,d,type,vol])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||"triangle";o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.8;});
  }catch(e){}
}

const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const fx=$("#fx"), fctx=fx.getContext("2d"); let parts=[], fraf=0;
function confetti(count){
  if(reduce) return;
  fx.width=innerWidth; fx.height=innerHeight;
  const cols=["#ffcf5a","#4fdc9a","#7fb2ff","#f2a2ff","#ff8a65","#5fe3d3"];
  for(let i=0;i<count;i++) parts.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:cols[i%cols.length],a:Math.random()*6,life:120});
  if(!fraf) floop();
}
function floop(){
  fctx.clearRect(0,0,fx.width,fx.height);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.4;p.vx*=.99;p.a+=.2;p.life--;fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.a);fctx.fillStyle=p.c;fctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);fctx.restore();});
  parts=parts.filter(p=>p.life>0&&p.y<fx.height+20);
  fraf = parts.length?requestAnimationFrame(floop):0;
  if(!fraf) fctx.clearRect(0,0,fx.width,fx.height);
}

function bohrSVG(e){
  const sh=shells(e.n), N=sh.length; let g="";
  sh.forEach((cnt,k)=>{
    const r=N===1?40:24+k*(58/(N-1));
    g+=`<circle cx="90" cy="90" r="${r.toFixed(1)}" style="fill:none;stroke:var(--line)" stroke-width="1"/>`;
    const dr=cnt>18?1.9:cnt>8?2.4:3; let dots="";
    for(let j=0;j<cnt;j++){const a=j/cnt*Math.PI*2;dots+=`<circle cx="${(90+r*Math.cos(a)).toFixed(1)}" cy="${(90+r*Math.sin(a)).toFixed(1)}" r="${dr}" style="fill:var(--accent)"/>`;}
    g+=`<g class="orbit" style="animation-duration:${6+k*3}s;animation-direction:${k%2?"reverse":"normal"}">${dots}</g>`;
  });
  return `<div><svg class="bohr" viewBox="0 0 180 180" role="img" aria-label="Electron shells of ${esc(e.name)}: ${sh.join(", ")}">${g}<circle cx="90" cy="90" r="17" style="fill:var(--c-${e.cat})"/><text x="90" y="95" text-anchor="middle" font-family="Lilita One, sans-serif" font-size="15" style="fill:#151935">${e.sym}</text></svg><div class="small muted" style="text-align:center">Electron shells: ${sh.join(" · ")}</div></div>`;
}

function selectEl(n){

function drawTbl(){
  const q=norm(TF.q);
  const dim=e=>(TF.cat&&e.cat!==TF.cat)||(TF.state&&stateOf(e.n)!==TF.state)||(q&&!(norm(e.name).includes(q)||norm(e.sym)===q||String(e.n)===q));
  $("#tbl").innerHTML=tableHTML({sel:P.sel,stars:true,dim});
}

// ================= QUIZ =================
function weightedPick(items,key,used){
  const c=items.filter(x=>!used.has(key(x))); const list=c.length?c:items;
  const w=list.map(x=>{const m=mk(key(x));return m>=3?1:5-m;});
  let r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<list.length;i++){r-=w[i];if(r<=0)return list[i];}
  return list[list.length-1];
}
function makeQ(mode,used,poolN){
  poolN=poolN||P.pool;
  if(mode==="mix") mode=rnd(["picture","symbol","name2sym","find","compound"]);
  if(mode==="compound"){
    const t=weightedPick(CP,c=>"c"+c.i,used); used.add("c"+t.i);
    const dir=Math.random()<.5?"f2n":"n2f";
    const opts=shuffle([t,...shuffle(CP.filter(c=>c!==t)).slice(0,3)]);
    return {kind:"cp",mode,dir,t,key:"c"+t.i,opts};
  }
  const pool=EL.slice(0,poolN);
  const t=weightedPick(pool,e=>e.n,used); used.add(t.n);
  const near=pool.filter(e=>e!==t&&Math.abs(e.n-t.n)<=12);
  const src=near.length>=3?near:pool.filter(e=>e!==t);
  const opts=shuffle([t,...shuffle(src).slice(0,3)]);
  return {kind:"el",mode,t,key:t.n,opts};
}
function start(mode){
  leaveArcade();
  const used=new Set();
  G={mode,qs:Array.from({length:ROUND},()=>makeQ(mode,used)),i:0,score:0,streak:0,bestStreak:0,results:[],missed:[],answered:false,hint:0,done:false};
  render();
}
function promptHTML(q){
  const t=q.t;
  if(q.kind==="cp"){
    return q.dir==="f2n"
      ? `<div class="prompt-q">What is this compound called?</div><div class="bigpic" aria-hidden="true">${t.pic}</div><div class="formula">${fmt(t.f)}</div>`
      : `<div class="prompt-q">What's the formula for this?</div><div class="bigpic" aria-hidden="true">${t.pic}</div><div class="bigname">${esc(t.name)}</div><div class="clue">${esc(t.fact)}</div>`;
  }
  switch(q.mode){
    case "picture": return `<div class="prompt-q">Which element is this?</div><div class="bigpic" aria-hidden="true">${t.pic}</div><div class="clue">${esc(t.fact)}</div>`;
    case "symbol": return `<div class="prompt-q">What's this element called?</div><div class="tile" style="--c:var(--c-${t.cat})"><span class="n">${t.n}</span><span class="s">${t.sym}</span><span class="nm">?</span></div>`;
    case "name2sym": return `<div class="prompt-q">What's the symbol for…</div><div class="bigname">${esc(t.name)}</div><div class="bigpic" style="font-size:56px" aria-hidden="true">${t.pic}</div>`;
    case "find": return `<div class="prompt-q">Find <span style="color:var(--accent)">${esc(t.name)}</span> on the table!</div><div class="clue" style="font-size:15px">${t.pic} ${esc(t.fact)}</div>`;
  }
}
function optLabel(q,o,i){
  const k=`<span class="k">${i+1}</span>`;
  if(q.kind==="cp") return q.dir==="f2n" ? `${k}<span>${esc(o.name)}</span>` : `${k}<span class="f" style="font-family:var(--f-display);font-size:24px;font-weight:400">${fmt(o.f)}</span>`;
  return q.mode==="name2sym" ? `${k}<span>${o.sym}</span>` : `${k}<span>${esc(o.name)}</span>`;
}
function optsHTML(q,answered,picked,removed){
  return `<div class="options">${q.opts.map((o,i)=>{
    let cls="opt"+(q.mode==="name2sym"&&q.kind==="el"?" sym":"");
    const val=q.kind==="cp"?o.i:o.n, tv=q.kind==="cp"?q.t.i:q.t.n;
    if(answered){ if(val===tv)cls+=" correct"; else if(val===picked)cls+=" wrong"; }
    else if(removed&&removed.includes(val)) cls+=" gone";
    return `<button class="${cls}" data-v="${val}" ${answered||(removed&&removed.includes(val))?"disabled":""}>${optLabel(q,o,i)}</button>`;}).join("")}</div>`;
}
const typingFor = q=>P.typing && q.mode!=="find";
function answerText(q){
  if(q.kind==="cp") return q.dir==="f2n"?q.t.name:q.t.f;
  return q.mode==="name2sym"?q.t.sym:q.t.name;
}
function hintText(q){

}
function renderGame(){

    else if(G.hint>=2) mark[q.t.n]="glow";

  } else if(typing){

  } else body+=optsHTML(q,G.answered,G.picked,G.removed);

    const fifty=!typing&&q.mode!=="find";
    body+=`<div class="helpers">
      ${fifty?`<button id="h50" ${G.hint?"disabled":""}>✂️ 50/50 (half points)</button>`:`<button id="hclue" ${G.hint?"disabled":""}>💡 Hint (half points)</button>`}

    <div class="card">${body}</div></section>`;

}
function feedbackHTML(q){
  const t=q.t, ok=G.lastOk;
  const head = G.revealed ? "Here's the answer!" : ok ? rnd(["Nailed it!","Awesome!","You're on fire!","Science genius!","Correct!"]) : "Not quite!";
  const title = q.kind==="cp" ? `${fmt(t.f)} = ${esc(t.name)}` : `${esc(t.name)} (${t.sym}) · #${t.n}`;
  const extra = q.kind==="cp" ? `<p class="muted" style="font-size:14px">Made of: ${Object.entries(parseF(t.f)).map(([s,k])=>`${k} ${esc(BYSYM[s].name)}`).join(", ")}</p>` : `<p class="muted" style="font-size:14px">${CATS[t.cat].label} · period ${t.period}</p>${gamerHTML(t)}`;
  return `<div class="feedback ${ok?"good":"bad"}" role="status"><div class="fpic" aria-hidden="true">${t.pic}</div>

}
function bindGame(q,typing){
  $("#quit").onclick=goHome;
  if(G.answered){ const n=$("#next"); n.onclick=next; n.focus({preventScroll:true}); return; }
  if(q.mode==="find"){
    $("#app").querySelector(".ptable").addEventListener("click",e=>{const b=e.target.closest("[data-n]");if(!b||G.answered)return;const v=+b.dataset.n;if(v>P.pool)return;answer(v===q.t.n,v);});
  } else if(typing){
    const inp=$("#ans"); inp.focus();
    $("#tf").onsubmit=e=>{e.preventDefault();const v=inp.value.trim();if(!v)return;answer(checkTyped(q,v),null);};
  } else {
    $$(".opt").forEach(b=>b.onclick=()=>{const v=+b.dataset.v;answer(v===(q.kind==="cp"?q.t.i:q.t.n),v);});

function checkTyped(q,v){
  const t=q.t;
  if(q.kind==="cp"){
    if(q.dir==="n2f") return v.replace(/\s/g,"").toUpperCase()===t.f.toUpperCase();
    return [t.name,...t.alt].some(a=>norm(a)===norm(v));
  }

  return [t.name,...t.alt].some(a=>norm(a)===norm(v));
}
function answer(ok,picked,revealed){
  const q=G.qs[G.i];
  G.answered=true; G.lastOk=ok; G.picked=picked;
  if(ok){
    G.streak++; G.bestStreak=Math.max(G.bestStreak,G.streak);
    let pts=100+Math.min(G.streak-1,10)*20; if(typingFor(q))pts=Math.round(pts*1.5); if(G.hint)pts=Math.round(pts/2);
    G.lucky=Math.random()<.12; if(G.lucky) pts*=2;
    G.lastPts=pts; G.score+=pts; gain(pts); quest("right",1);
    if(typingFor(q)){P.stats.typed++; if(P.stats.typed>=25) award("typist");}
    bump(q.key,1);
    sfx.good(); if(G.streak%5===0) confetti(90);
    if(G.streak>=10) award("streak10");
  } else {
    G.streak=0; G.lastPts=0;
    if(!revealed) bump(q.key,-1);
    G.missed.push(q);

  }
  G.results.push(ok); save(); renderStats(); renderGame();
}
function next(){
  G.i++; G.answered=false; G.hint=0; G.removed=null; G.hintMsg=null; G.revealed=false; G.picked=null;
  if(G.i>=ROUND){ G.done=true; finish(); return; }
  renderGame(); window.scrollTo({top:0,behavior:reduce?"auto":"smooth"});
}
function studyHTML(list){
  return list.length?`<h3 style="font-size:20px;margin-top:8px">Study these</h3><div class="missed">${list.map(q=>q.kind==="cp"
      ?`<div><span class="p" aria-hidden="true">${q.t.pic}</span><span><b>${fmt(q.t.f)} · ${esc(q.t.name)}</b><small>${esc(q.t.fact)}</small></span></div>`
      :`<div><span class="p" aria-hidden="true">${q.t.pic}</span><span><b>${esc(q.t.name)} (${q.t.sym}) · #${q.t.n}</b><small>${esc(q.t.fact)}</small></span></div>`).join("")}</div>`:"";
}
function finish(){
  const right=G.results.filter(Boolean).length;
  const stars=right>=9?3:right>=7?2:right>=4?1:0;
  const isBest=G.score>(P.best[G.mode]||0); if(isBest){P.best[G.mode]=G.score;} save(); renderStats();
  const msg=["Every scientist starts somewhere. Study the cards below and try again!","Good start! Look over the ones you missed.","Great work! You're getting the hang of this.","Incredible! You're a true element expert!"][stars];
  const uniq=[...new Map(G.missed.map(q=>[q.key,q])).values()];
  $("#app").innerHTML=`<section class="panel results">
    <div class="starsbig" aria-label="${stars} of 3 stars">${[0,1,2].map(i=>`<span class="${i<stars?"":"off"}">⭐</span>`).join("")}</div>
    <div class="scorebig">${G.score.toLocaleString()}</div>
    <h2 style="font-size:26px">${right} out of ${ROUND} right${isBest&&G.score?" · New best!":""}</h2>
    <p class="muted" style="margin:0;max-width:52ch">${msg} Best streak: ${G.bestStreak} 🔥</p>
    <div class="row" style="justify-content:center"><button class="btn" id="again">Play again</button><button class="btn ghost" id="home">Choose another game</button></div>
    ${studyHTML(uniq)}
  </section>`;
  $("#again").onclick=()=>start(G.mode); $("#home").onclick=goHome;
  if(stars>=2){ sfx.win(); confetti(stars===3?220:120); }
  award("first"); if(right===ROUND) award("perfect");

  </section>`;
  $("#quit").onclick=goHome;
  $$("[data-b]").forEach(b=>b.onclick=()=>startBoss(+b.dataset.b));
}
function startBoss(i){
  leaveArcade();
  const B=BOSSES[i];
  A={type:"boss",i,B,bhp:B.hp,php:100,streak:0,used:new Set(),timers:[],stop(){A.timers.forEach(clearTimeout);}};
  bossTurn();
}
function bossTurn(){
  const Bt=A; const B=A.B;
  const q=makeQ(rnd(["picture","symbol","name2sym","picture","compound"]),A.used,B.pool);
  A.q=q; A.answered=false; A.t0=performance.now();
  const TIME=12;
  $("#app").innerHTML=`<section class="panel" style="display:grid;gap:16px">
    <div class="gamebar"><button class="btn ghost sm" id="quit">✕ Run away</button><span class="streak">${A.streak>=2?"🔥 "+A.streak:""}</span></div>
    <div class="arena">
      <div class="fighter" id="fp"><div class="avatar" aria-hidden="true">${avatar()}</div><h3>Dylan</h3><div class="hp"><span style="width:${A.php}%"></span></div><span class="small muted">${A.php} / 100 HP</span></div>
      <div class="vs">VS</div>
      <div class="fighter" id="fb"><div class="avatar" aria-hidden="true">${B.pic}</div><h3>${esc(B.name)}</h3><div class="hp boss"><span style="width:${Math.max(0,A.bhp/B.hp*100)}%"></span></div><span class="small muted">${Math.max(0,A.bhp)} / ${B.hp} HP</span><p class="taunt">“${esc(B.taunt)}”</p></div>
    </div>
    <div class="card">
      <div class="timer" id="btimer"><span style="animation-duration:${TIME}s"></span></div>
      ${promptHTML(q)}
      ${optsHTML(q,false)}
      <div class="infoline" id="bmsg"></div>
    </div></section>`;
  $("#quit").onclick=goHome;
  $$(".opt").forEach(b=>b.onclick=()=>{const v=+b.dataset.v;bossAnswer(v===(q.kind==="cp"?q.t.i:q.t.n),v);});
  A.timers.push(setTimeout(()=>{ if(A===Bt&&!A.answered) bossAnswer(false,null,true); },TIME*1000));
}
function floatText(el,text,color){ const d=document.createElement("div"); d.className="dmg"; d.style.color=color; d.textContent=text; el.appendChild(d); setTimeout(()=>d.remove(),1100); }
function bossAnswer(ok,picked,timeout){
  if(A.answered) return; A.answered=true;
  const q=A.q, B=A.B, tv=q.kind==="cp"?q.t.i:q.t.n;
  $("#btimer").classList.add("stop");
  $$(".opt").forEach(b=>{b.disabled=true;const v=+b.dataset.v;if(v===tv)b.classList.add("correct");else if(v===picked)b.classList.add("wrong");});
  const ansName=q.kind==="cp"?`${fmt(q.t.f)} = ${esc(q.t.name)}`:`${esc(q.t.name)} (${q.t.sym})`;
  if(ok){
    A.streak++; const fast=(performance.now()-A.t0)<4000;
    let dmg=80+Math.min(A.streak-1,8)*20; if(fast) dmg=Math.round(dmg*1.5);
    A.bhp-=dmg; gain(Math.round(dmg/2)); bump(q.key,1);
    quest("right",1); quest("bossdmg",dmg); if(fast) quest("crit",1);
    const fb=$("#fb"); fb.classList.add("hit"); floatText(fb,`${fast?"CRITICAL! ":""}-${dmg}`,fast?"var(--accent)":"var(--good)");
    fb.querySelector(".hp span").style.width=Math.max(0,A.bhp/B.hp*100)+"%"; fb.querySelector(".small").textContent=`${Math.max(0,A.bhp)} / ${B.hp} HP`;
    $("#bmsg").innerHTML=`✅ ${ansName}! ${esc(q.t.fact)}`; sfx.hit();
  } else {
    A.streak=0; A.php=Math.max(0,A.php-B.atk); bump(q.key,-1);
    const fp=$("#fp"); fp.classList.add("hit"); floatText(fp,`-${B.atk}`,"var(--bad)");
    fp.querySelector(".hp span").style.width=A.php+"%"; fp.querySelector(".small").textContent=`${A.php} / 100 HP`;
    $("#bmsg").innerHTML=`${timeout?"⏰ Too slow!":"❌ Ouch!"} The answer was <b>${ansName}</b>. ${esc(q.t.fact)}`; sfx.bad();
  }
  save(); renderStats();
  const me=A;
  A.timers.push(setTimeout(()=>{ if(A!==me) return; if(A.bhp<=0) bossEnd(true); else if(A.php<=0) bossEnd(false); else bossTurn(); }, ok?1600:3000));
}
function bossEnd(won){
  const i=A.i, B=A.B;
  if(won){
    P.stats.bossBeat=Math.max(P.stats.bossBeat,i+1); const xp=400*(i+1); gain(xp); save(); renderStats();
    award("boss"+(i+1)); sfx.win(); confetti(220);
    $("#app").innerHTML=`<section class="panel results"><div class="bigpic" aria-hidden="true">🏆</div><h2 style="font-size:30px">You defeated ${esc(B.name)}!</h2>
      <p class="muted" style="margin:0">+${xp} XP · ${A.php} HP left</p>
      <div class="row" style="justify-content:center">${i<2?`<button class="btn" id="bnext">Fight ${esc(BOSSES[i+1].name)} ▸</button>`:`<p style="margin:0;font-weight:800">You beat every boss! You're a true Element Champion.</p>`}<button class="btn ghost" id="bmenu">Boss menu</button></div></section>`;
    if(i<2) $("#bnext").onclick=()=>startBoss(i+1);
  } else {
    sfx.bad();
    $("#app").innerHTML=`<section class="panel results"><div class="bigpic" aria-hidden="true">${B.pic}</div><h2 style="font-size:30px">${esc(B.name)} wins this time…</h2>
      <p class="muted" style="margin:0;max-width:50ch">Boss HP left: ${A.bhp}. Study a bit on the Periodic table tab, then come back for a rematch!</p>
      <div class="row" style="justify-content:center"><button class="btn" id="bre">Rematch!</button><button class="btn ghost" id="bmenu">Boss menu</button></div></section>`;
    $("#bre").onclick=()=>startBoss(i);
  }
  $("#bmenu").onclick=bossMenu;
}

// ================= ARCADE: MEMORY MATCH =================
function startMemory(){
  leaveArcade(); G=null;
  const els=shuffle(EL.slice(0,P.pool)).slice(0,8);
  const cards=shuffle([...els.map(e=>({e,t:"sym"})),...els.map(e=>({e,t:"pic"}))]);
  A={type:"memory",cards,open:[],done:0,moves:0,t0:Date.now(),lock:false,stop(){clearInterval(A.iv);}};
  $("#app").innerHTML=`<section class="panel" style="display:grid;gap:16px">
    <div class="gamebar"><button class="btn ghost sm" id="quit">✕ Quit</button><h2 style="font-size:24px;flex:1">Memory Match</h2>
      <span class="chip">Moves <b id="mmoves">0</b></span><span class="chip">Pairs <b id="mpairs">0</b>/8</span><span class="chip">⏱ <b id="mtime">0s</b></span></div>
    <p class="muted" style="margin:0;text-align:center">Find each symbol card's partner: the card with its picture and name.</p>
    <div class="mgrid">${cards.map((c,i)=>`<button class="mcard" data-i="${i}" aria-label="Hidden card"><div class="in"><div class="back" aria-hidden="true">⚛️</div>
      <div class="face" style="--c:var(--c-${c.e.cat})">${c.t==="sym"?`<span class="n">${c.e.n}</span><span class="s">${c.e.sym}</span>`:`<span class="p">${c.e.pic}</span><span class="nm">${esc(c.e.name)}</span>`}</div></div></button>`).join("")}</div>
    <div class="infoline" id="minfo"></div>
  </section>`;
  $("#quit").onclick=goHome;
  A.iv=setInterval(()=>{const t=$("#mtime"); if(t) t.textContent=Math.round((Date.now()-A.t0)/1000)+"s";},500);
  $$(".mcard").forEach(b=>b.onclick=()=>memFlip(+b.dataset.i,b));
}
function memFlip(i,b){
  if(A.lock||b.classList.contains("up")||b.classList.contains("done")) return;
  const c=A.cards[i]; b.classList.add("up"); b.setAttribute("aria-label",c.t==="sym"?`Symbol ${c.e.sym}`:c.e.name); sfx.click();
  A.open.push(i);
  if(A.open.length<2) return;
  A.moves++; $("#mmoves").textContent=A.moves;
  const [a,z]=A.open, ca=A.cards[a], cz=A.cards[z], ba=$(`.mcard[data-i="${a}"]`), bz=$(`.mcard[data-i="${z}"]`);
  A.open=[];
  if(ca.e===cz.e&&ca.t!==cz.t){
    ba.classList.add("done"); bz.classList.add("done"); A.done++; $("#mpairs").textContent=A.done; sfx.good(); bump(ca.e.n,1);
    $("#minfo").innerHTML=`✅ <b>${ca.e.sym} = ${esc(ca.e.name)}</b>. ${esc(ca.e.fact)}`;
    if(A.done===8) memDone();
  } else {
    A.lock=true;
    $("#minfo").textContent="Not a match. Try to remember where they are!";
    setTimeout(()=>{ba.classList.remove("up");bz.classList.remove("up");ba.setAttribute("aria-label","Hidden card");bz.setAttribute("aria-label","Hidden card");A.lock=false;},950);
  }
}
function memDone(){
  clearInterval(A.iv);
  const secs=Math.round((Date.now()-A.t0)/1000), moves=A.moves;
  const stars=moves<=12?3:moves<=16?2:1, xp=Math.max(60,320-moves*10);
  const best=!P.stats.memBest||moves<P.stats.memBest; if(best) P.stats.memBest=moves;
  gain(xp); save(); renderStats(); if(moves<=12) award("memory");
  quest("match",1);
  sfx.win(); confetti(stars===3?200:100);
  setTimeout(()=>{ if(!A||A.type!=="memory") return;
    $("#minfo").innerHTML=`<div class="results"><div class="starsbig">${[0,1,2].map(i=>`<span class="${i<stars?"":"off"}">⭐</span>`).join("")}</div>
    <h2 style="font-size:26px">All matched in ${moves} moves and ${secs} seconds!${best?" New best!":""}</h2><p class="muted" style="margin:0">+${xp} XP</p>
    <div class="row" style="justify-content:center"><button class="btn" id="magain">Play again</button><button class="btn ghost" id="mhome">Back to games</button></div></div>`;
    $("#magain").onclick=startMemory; $("#mhome").onclick=goHome; },700);
}

// ================= ARCADE: COMPOUND CRAFTER =================
function startCraft(){
  leaveArcade(); G=null;
  const used=new Set();
  A={type:"craft",list:Array.from({length:5},()=>{const c=weightedPick(CRAFTABLE,c=>"c"+c.i,used);used.add("c"+c.i);return c;}),i:0,score:0,results:[]};
  craftNew();
}
function craftNew(){
  const c=A.list[A.i], syms=Object.keys(parseF(c.f));
  A.bench=[]; A.tries=0; A.hint=false; A.solved=false; A.msg="";
  A.pal=shuffle([...syms,...shuffle(COMMON.filter(s=>!syms.includes(s))).slice(0,Math.max(3,7-syms.length))]);
  craftRender();
}
function craftRender(){
  const c=A.list[A.i];
  const bar=A.list.map((_,i)=>`<i class="${i<A.results.length?(A.results[i]?"ok":"no"):(i===A.i?"now":"")}"></i>`).join("");
  const counts={}; A.bench.forEach(s=>counts[s]=(counts[s]||0)+1);
  $("#app").innerHTML=`<section class="panel" style="display:grid;gap:16px">
    <div class="gamebar"><button class="btn ghost sm" id="quit">✕ Quit</button><div class="progress" aria-label="Compound ${A.i+1} of 5">${bar}</div><span class="chip">Score <b>${A.score}</b></span></div>
    <div class="card">
      <div class="prompt-q">⚒️ Craft this compound!</div>
      <div class="row" style="justify-content:center;gap:16px"><span class="bigpic" style="font-size:72px" aria-hidden="true">${c.pic}</span><span class="bigname">${esc(c.name)}</span></div>
      <div class="clue" style="font-size:16px">${esc(c.fact)}</div>
      ${A.hint||A.solved?`<div class="hinttext" style="font-size:20px">Formula: <span class="f" style="font-family:var(--f-display)">${fmt(c.f)}</span></div>`:""}
      <div class="bench ${A.solved?"ok":""}" id="bench" aria-label="Crafting table">${A.bench.length?A.bench.map((s,i)=>`<button class="atom" style="--c:var(--c-${BYSYM[s].cat})" data-k="${i}" aria-label="Remove ${BYSYM[s].name} atom" ${A.solved?"disabled":""}>${s}</button>`).join(""):`<span class="muted">Tap atoms below to put them on the crafting table. Tap an atom here to take it off.</span>`}</div>
      <div class="counts">${Object.entries(counts).map(([s,k])=>`${s} × ${k}`).join(" · ")}</div>
      ${A.solved?"":`<div class="palette" id="pal">${A.pal.map(s=>{const e=BYSYM[s];return `<button class="pal" style="--c:var(--c-${e.cat})" data-s="${s}" aria-label="Add ${e.name} atom"><span class="s">${s}</span><span class="nm">${esc(e.name)}</span></button>`;}).join("")}</div>
      <div class="row" style="justify-content:center"><button class="btn ghost" id="cclear">Clear</button><button class="btn ghost" id="chint" ${A.hint?"disabled":""}>💡 Show formula (half points)</button><button class="btn" id="cgo">⚒️ Craft!</button></div>`}
      <div class="infoline" id="cmsg">${A.msg}</div>
      ${A.solved?`<button class="btn" id="cnext">${A.i<4?"Next compound ▸":"See my score ▸"}</button>`:""}
    </div></section>`;
  $("#quit").onclick=goHome;
  if(A.solved){ $("#cnext").onclick=craftNext; $("#cnext").focus({preventScroll:true}); return; }
  $("#pal").onclick=e=>{const b=e.target.closest("[data-s]"); if(!b) return; if(A.bench.length>=24){A.msg="The table is full! Take some atoms off.";craftRender();return;} A.bench.push(b.dataset.s); A.msg=""; sfx.click(); craftRender();};
  $("#bench").onclick=e=>{const b=e.target.closest("[data-k]"); if(!b) return; A.bench.splice(+b.dataset.k,1); sfx.click(); craftRender();};
  $("#cclear").onclick=()=>{A.bench=[];A.msg="";craftRender();};
  $("#chint").onclick=()=>{A.hint=true;sfx.click();craftRender();};
  $("#cgo").onclick=craftCheck;
}
function craftCheck(){
  const c=A.list[A.i], need=parseF(c.f), have={};
  A.bench.forEach(s=>have[s]=(have[s]||0)+1);
  if(!A.bench.length){ A.msg="Put some atoms on the crafting table first!"; craftRender(); return; }
  const all=[...new Set([...Object.keys(have).filter(s=>!need[s]),...Object.keys(need),...Object.keys(have)])];
  let diff=null;
  for(const s of all){ const n=need[s]||0, h=have[s]||0, nm=BYSYM[s].name;
    if(!n){diff=`There's no ${nm} in ${c.name}. Take the ${s} atoms off.`;break;}
    if(h<n){diff=`Close! ${c.name} needs more ${nm} (${s}).`;break;}
    if(h>n){diff=`Too many ${nm} (${s}) atoms.`;break;} }
  if(!diff){
    const pts=Math.max(40,(A.hint?75:150)-A.tries*20);
    A.score+=pts; gain(pts); A.solved=true; A.results.push(true);
    bump("c"+c.i,1); P.stats.crafted[c.i]=1; save(); renderStats();
    award("craft1"); if(Object.keys(P.stats.crafted).length>=10) award("craft10");
    quest("craft",1);
    A.msg=`🎉 You crafted <b>${esc(c.name)}</b> (${fmt(c.f)})! +${pts}`; sfx.win(); confetti(70);
  } else {
    A.tries++; A.msg=`❌ ${esc(diff)}${A.tries>=3&&!A.hint?" Stuck? Try the 💡 button.":""}`; sfx.bad();
  }
  craftRender();
}
function craftNext(){
  A.i++;
  if(A.i<5){ craftNew(); return; }
  const n=A.results.filter(Boolean).length;
  $("#app").innerHTML=`<section class="panel results"><div class="bigpic" aria-hidden="true">🏭</div><div class="scorebig">${A.score}</div>
    <h2 style="font-size:26px">You crafted ${n} compounds!</h2>
    <div class="missed">${A.list.map(c=>`<div><span class="p" aria-hidden="true">${c.pic}</span><span><b>${fmt(c.f)} · ${esc(c.name)}</b><small>${Object.entries(parseF(c.f)).map(([s,k])=>`${k} ${esc(BYSYM[s].name)}`).join(" + ")}</small></span></div>`).join("")}</div>
    <div class="row" style="justify-content:center"><button class="btn" id="cagain">Craft more</button><button class="btn ghost" id="chome">Back to games</button></div></section>`;
  $("#cagain").onclick=startCraft; $("#chome").onclick=goHome;
}

// ================= ARCADE: ELEMENT SHOWDOWN =================
function startHL(){ leaveArcade(); G=null; A={type:"hl",streak:0}; hlRound(); }
function hlRound(){
  const pool=EL.slice(0,P.pool);
  const gas=pool.filter(e=>stateOf(e.n)==="Gas"), notGas=pool.filter(e=>stateOf(e.n)==="Solid"||stateOf(e.n)==="Liquid");
  const kind=rnd(["mass","mass","protons","gas"]);
  let a,b;
  if(kind==="gas"){ [a,b]=shuffle([rnd(gas),rnd(notGas)]); }
  else { do{ [a,b]=shuffle(pool).slice(0,2); }while(a.mass===b.mass); }
  A.pair=[a,b]; A.kind=kind; A.answered=false;
  const Q={mass:"Which one is HEAVIER?",protons:"Which one has MORE protons?",gas:"Which one is a GAS at room temperature?"}[kind];
  const sub={mass:"Heavier means a bigger atomic mass.",protons:"Protons = the atomic number.",gas:"The other one is a solid or liquid."}[kind];
  $("#app").innerHTML=`<section class="panel" style="display:grid;gap:16px">
    <div class="gamebar"><button class="btn ghost sm" id="quit">✕ Quit</button><h2 style="font-size:24px;flex:1">Element Showdown</h2>
      <span class="streak">${A.streak?"🔥 "+A.streak:""}</span><span class="chip">Best <b>${P.stats.hlBest}</b></span></div>
    <div class="card">
      <div class="prompt-q">${Q}</div><p class="muted" style="margin:-10px 0 0">${sub}</p>
      <div class="duel">${[a,"vs",b].map((e,i)=>e==="vs"?`<div class="vs" style="align-self:center">VS</div>`:`<button class="dcard" data-i="${i?1:0}" style="--c:var(--c-${e.cat})"><span class="p" aria-hidden="true">${e.pic}</span><span class="s">${e.sym}</span><span class="nm">${esc(e.name)}</span><span class="val"></span></button>`).join("")}</div>
      <div class="infoline" id="hmsg"></div>
      <div id="hact"></div>
    </div></section>`;
  $("#quit").onclick=goHome;
  $$(".dcard").forEach(btn=>btn.onclick=()=>hlPick(+btn.dataset.i));
}
function hlPick(i){
  if(A.answered) return; A.answered=true;
  const [a,b]=A.pair, k=A.kind;
  const win = k==="mass"?(a.mass>b.mass?0:1):k==="protons"?(a.n>b.n?0:1):(stateOf(a.n)==="Gas"?0:1);
  const val=e=>k==="mass"?`${e.mass} u`:k==="protons"?`${e.n} protons`:stateOf(e.n);
  $$(".dcard").forEach(btn=>{const j=+btn.dataset.i, e=A.pair[j]; btn.disabled=true; btn.querySelector(".val").textContent=val(e); btn.classList.add(j===win?"right":(j===i?"wrong":"x"));});
  const ok=i===win, w=A.pair[win], l=A.pair[1-win];
  let note="";
  if(k!=="gas"&&((a.n<b.n)!==(a.mass<b.mass))){ const heavy=a.mass>b.mass?a:b, lighter=heavy===a?b:a; note=` Tricky one! ${heavy.name} is heavier than ${lighter.name} even though it has fewer protons, because it has extra neutrons.`; }
  if(ok){
    A.streak++; gain(20+A.streak*5); save(); renderStats(); sfx.good();
    if(A.streak%5===0) confetti(80);
    if(A.streak>=10) award("hl10");
    quest("hl",A.streak);
    $("#hmsg").innerHTML=`✅ Yes! <b>${esc(w.name)}</b> wins.${esc(note)}`;
    $("#hact").innerHTML=`<button class="btn" id="hnext">Next showdown ▸</button>`; $("#hnext").onclick=hlRound; $("#hnext").focus({preventScroll:true});
  } else {
    sfx.bad();
    const best=A.streak>P.stats.hlBest; if(best) P.stats.hlBest=A.streak; save(); renderStats();
    $("#hmsg").innerHTML=`❌ It was <b>${esc(w.name)}</b> (${esc(val(w))} vs ${esc(val(l))}).${esc(note)}<br><b>Final streak: ${A.streak}${best&&A.streak?" · New best!":""}</b>`;
    $("#hact").innerHTML=`<div class="row" style="justify-content:center"><button class="btn" id="hagain">Play again</button><button class="btn ghost" id="hhome">Back to games</button></div>`;
    $("#hagain").onclick=startHL; $("#hhome").onclick=goHome;
  }
}

// ================= KEYBOARD =================
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT") return;
  if(tab==="table"&&(e.key==="ArrowLeft"||e.key==="ArrowRight")){ const n=P.sel+(e.key==="ArrowRight"?1:-1); if(n>=1&&n<=118){e.preventDefault();selectEl(n);} return; }
  if(tab!=="play") return;
  const k=+e.key; if(!(k>=1&&k<=4)) return;
  if(G&&!G.done){ const q=G.qs[G.i]; if(G.answered||typingFor(q)||q.mode==="find") return; }
  else if(!(A&&A.type==="boss"&&!A.answered)) return;
  const b=$$(".opt")[k-1]; if(b&&!b.disabled) b.click();
});

// ================= ROUTER =================
function render(){
  renderStats();
  if(tab==="table") return renderTable();
  if(tab==="compounds") return renderCompounds();
  if(tab==="trophies") return renderTrophies();
  if(tab==="collection") return renderCollection();
  if(tab==="shop") return renderShop();
  if(G&&!G.done) return renderGame();
  renderHome();
}
render();
})();
</script>
