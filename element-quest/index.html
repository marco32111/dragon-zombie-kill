<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dylan's Element Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: a night-shift chemistry lab. One column of game panels; the periodic table scrolls sideways inside its own frame. */
:root{
  --ink:#151935; --panel:#1f2548; --panel-2:#293060; --line:#3b4380;
  --text:#eef0ff; --muted:#a8aed6; --accent:#ffcf5a; --accent-ink:#2a1f00;
  --good:#4fdc9a; --bad:#ff6b7a;
  --c-alkali:#ff8a65; --c-alkaline:#ffb74d; --c-transition:#7fb2ff; --c-post:#8fd9c4;
  --c-metalloid:#c7e07a; --c-nonmetal:#5fe3d3; --c-halogen:#f2a2ff; --c-noble:#b79cff;
  --c-lanthanide:#ff9ec4; --c-actinide:#f5c38b;
  --f-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ink);color:var(--text)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;
  background-image:radial-gradient(circle at 15% 0%,#2a2f66 0,transparent 45%),radial-gradient(circle at 90% 20%,#1e3b55 0,transparent 40%);
  background-attachment:fixed;min-height:100vh}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.5px;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* header */
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:52px;height:52px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:26px;position:relative;box-shadow:0 4px 0 #c99a1f}
.brand .logo small{position:absolute;top:3px;left:6px;font:800 10px var(--f-body)}
.brand h1{font-size:clamp(24px,5vw,34px);line-height:1}
.brand p{margin:2px 0 0;color:var(--muted);font-size:14px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.chip b{color:var(--accent)}
.iconbtn{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px}

nav.tabs{display:flex;gap:6px;background:var(--panel);padding:6px;border-radius:999px;border:1px solid var(--line);width:max-content;max-width:100%;overflow-x:auto}
nav.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-weight:800;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* home */
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.hero h2{font-size:clamp(22px,4.5vw,32px)}
.hero p{margin:6px 0 0;max-width:60ch;color:var(--muted)}
.levelbar{height:12px;background:var(--panel-2);border-radius:999px;overflow:hidden;margin-top:10px}
.levelbar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#ff9f43);border-radius:999px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.mode{text-align:left;background:var(--panel-2);border:2px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;transition:transform .12s,border-color .12s}
.mode:hover{transform:translateY(-2px);border-color:var(--accent)}
.mode .pic{font-size:34px;line-height:1}
.mode h3{font-size:21px}
.mode p{margin:0;color:var(--muted);font-size:14px}
.mode .best{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.5px;text-transform:uppercase}
.settings{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.seg{display:flex;background:var(--panel-2);border-radius:999px;padding:4px;border:1px solid var(--line);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-weight:800;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--ink)}
.label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.toggle{display:flex;gap:8px;align-items:center;font-weight:800;font-size:14px}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}

/* game */
.gamebar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.progress{flex:1 1 200px;display:flex;gap:4px}
.progress i{flex:1;height:10px;border-radius:999px;background:var(--panel-2)}
.progress i.ok{background:var(--good)} .progress i.no{background:var(--bad)} .progress i.now{background:var(--accent)}
.streak{font-family:var(--f-display);font-size:20px;color:#ffb347}
.card{display:grid;gap:18px;justify-items:center;text-align:center}
.prompt-q{font-family:var(--f-display);font-size:clamp(22px,4vw,28px)}
.bigpic{font-size:clamp(72px,16vw,110px);line-height:1.1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}
.clue{max-width:52ch;font-size:18px;font-weight:600;background:var(--panel-2);border-radius:12px;padding:12px 16px}
.tile{--c:var(--c-transition);width:150px;aspect-ratio:1;max-width:100%;border-radius:16px;border:3px solid var(--c);
  background:color-mix(in srgb,var(--c) 22%,var(--panel));display:grid;grid-template-rows:auto 1fr auto;padding:10px;text-align:left}
.tile .n{font-weight:800;font-size:16px}
.tile .s{font-family:var(--f-display);font-size:64px;line-height:1;text-align:center;align-self:center}
.tile .nm{text-align:center;font-weight:800;font-size:14px;color:var(--muted)}
.formula{font-family:var(--f-display);font-size:clamp(48px,11vw,80px);line-height:1;letter-spacing:1px}
.formula sub{font-size:.5em}
.bigname{font-family:var(--f-display);font-size:clamp(34px,7vw,52px);line-height:1.1}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:620px}
.opt{background:var(--panel-2);border:2px solid var(--line);border-radius:12px;padding:14px 12px;font-weight:800;font-size:18px;display:flex;gap:10px;align-items:center;justify-content:center;min-height:62px;transition:transform .1s}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateY(-2px)}
.opt .k{font-size:11px;background:var(--line);border-radius:6px;padding:1px 6px;color:var(--muted)}
.opt small{display:block;font-weight:600;font-size:12px;color:var(--muted)}
.opt.sym{font-family:var(--f-display);font-size:30px;font-weight:400}
.opt.correct{background:color-mix(in srgb,var(--good) 30%,var(--panel-2));border-color:var(--good)}
.opt.wrong{background:color-mix(in srgb,var(--bad) 30%,var(--panel-2));border-color:var(--bad);animation:shake .35s}
.opt.gone{opacity:.2}
.opt:disabled{cursor:default}
.typebox{display:flex;gap:8px;width:100%;max-width:460px}
.typebox input{flex:1;min-width:0;background:var(--ink);border:2px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--text);font:800 20px var(--f-body)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 20px;font-weight:800;font-size:17px;box-shadow:0 4px 0 #c99a1f}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #c99a1f}
.btn.ghost{background:transparent;color:var(--text);border:2px solid var(--line);box-shadow:none}
.helpers{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.helpers button{background:transparent;border:1px dashed var(--line);border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px;color:var(--muted)}
.helpers button:disabled{opacity:.35;cursor:default}
.hinttext{color:var(--accent);font-weight:800}
.feedback{width:100%;max-width:620px;border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;text-align:left;animation:pop .25s}
.feedback.good{background:color-mix(in srgb,var(--good) 18%,var(--panel));border:2px solid var(--good)}
.feedback.bad{background:color-mix(in srgb,var(--bad) 15%,var(--panel));border:2px solid var(--bad)}
.feedback .fpic{font-size:52px;line-height:1}
.feedback h3{font-size:22px}
.feedback p{margin:2px 0 0}
.points{font-family:var(--f-display);color:var(--good)}

/* periodic table */
.tablewrap{overflow-x:auto;padding-bottom:6px}
.ptable{display:grid;grid-template-columns:repeat(18,minmax(44px,1fr));grid-template-rows:repeat(7,auto) 12px repeat(2,auto);gap:3px;min-width:820px}
.el{--c:var(--c-transition);position:relative;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 20%,var(--panel));border-radius:7px;padding:3px 2px 2px;display:flex;flex-direction:column;align-items:center;line-height:1.05;min-height:52px;color:var(--text)}
.el .n{font-size:9px;font-weight:800;align-self:flex-start;padding-left:2px;opacity:.85}
.el .s{font-family:var(--f-display);font-size:19px}
.el .nm{font-size:7.5px;font-weight:800;opacity:.8;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.el:hover{background:color-mix(in srgb,var(--c) 45%,var(--panel));transform:scale(1.08);z-index:2}
.el.sel{outline:3px solid var(--accent);outline-offset:1px;z-index:3}
.el.dim{opacity:.28}
.el.hit{background:var(--good);border-color:var(--good);color:var(--ink)}
.el.miss{background:var(--bad);border-color:var(--bad);color:var(--ink)}
.el.glow{animation:glow 1s infinite alternate}
.el .stars{position:absolute;top:1px;right:3px;font-size:8px;color:var(--accent);letter-spacing:-1px}
.el.ph{border-style:dashed;background:transparent;justify-content:center;font-size:9px;font-weight:800;color:var(--muted);--c:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;font-weight:800}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;background:var(--c)}
.detail{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.detail .bigpic{font-size:80px}
.detail h2{font-size:32px}
.detail p{margin:4px 0 0;max-width:60ch}
.kv{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.kv span{background:var(--panel-2);border-radius:8px;padding:4px 10px;font-weight:800;font-size:13px}

/* compounds */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.cmp{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.cmp .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cmp .f{font-family:var(--f-display);font-size:30px;line-height:1}
.cmp .f sub{font-size:.55em}
.cmp .e{font-size:34px;line-height:1}
.cmp h3{font-size:18px}
.cmp p{margin:0;font-size:14px;color:var(--muted)}
.atoms{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.atoms span{font-weight:800;font-size:12px;border-radius:6px;padding:2px 7px;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 22%,var(--panel))}

/* results */
.results{text-align:center;display:grid;gap:14px;justify-items:center}
.starsbig{font-size:54px;letter-spacing:6px}
.starsbig .off{opacity:.2}
.scorebig{font-family:var(--f-display);font-size:56px;color:var(--accent);line-height:1}
.missed{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;width:100%;text-align:left}
.missed div{background:var(--panel-2);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.missed .p{font-size:34px}
.missed b{display:block}
.missed small{color:var(--muted)}

#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{from{transform:scale(.95);opacity:.4}to{transform:none;opacity:1}}
@keyframes glow{from{box-shadow:0 0 0 0 var(--accent)}to{box-shadow:0 0 14px 4px var(--accent)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:560px){
  .hero{grid-template-columns:1fr}
  .options{grid-template-columns:1fr}
  .detail{grid-template-columns:1fr;text-align:center;justify-items:center}
  .detail .kv{justify-content:center}
  .opt .k{display:none}
}
</style>
</head>
<body>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true"><small>66</small>Dy</div>
      <div>
        <h1>Dylan's Element Quest</h1>
        <p>Learn all 118 elements, one picture at a time</p>
      </div>

    <div class="stats" id="stats"></div>

  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="play">Play</button>
    <button role="tab" data-tab="table">Periodic table</button>
    <button role="tab" data-tab="compounds">Compounds</button>
  </nav>
  <main id="app"></main>
</div>

function tone(seq){
  if(P.muted) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();

    seq.forEach(([f,d,type])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||"triangle";o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.8;});
  }catch(e){}
}

const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const fx=$("#fx"), ctx=fx.getContext("2d"); let parts=[], raf=0;
function confetti(count){
  if(reduce) return;
  fx.width=innerWidth; fx.height=innerHeight;
  const cols=["#ffcf5a","#4fdc9a","#7fb2ff","#f2a2ff","#ff8a65","#5fe3d3"];
  for(let i=0;i<count;i++) parts.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:cols[i%cols.length],a:Math.random()*6,life:120});
  if(!raf) loop();
}
function loop(){
  ctx.clearRect(0,0,fx.width,fx.height);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.4;p.vx*=.99;p.a+=.2;p.life--;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);ctx.restore();});
  parts=parts.filter(p=>p.life>0&&p.y<fx.height+20);
  raf = parts.length?requestAnimationFrame(loop):0;
  if(!raf) ctx.clearRect(0,0,fx.width,fx.height);
}

// ---------- GAME ----------
function weightedPick(items,key,used){
  const c=items.filter(x=>!used.has(key(x))); const list=c.length?c:items;
  const w=list.map(x=>{const m=mk(key(x));return m>=3?1:5-m;});
  let r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<list.length;i++){r-=w[i];if(r<=0)return list[i];}
  return list[list.length-1];
}
function makeQ(mode,used){
  if(mode==="mix") mode=["picture","symbol","name2sym","find","compound"][Math.random()*5|0];
  if(mode==="compound"){
    const t=weightedPick(CP,c=>"c"+c.i,used); used.add("c"+t.i);
    const dir=Math.random()<.5?"f2n":"n2f";
    const opts=shuffle([t,...shuffle(CP.filter(c=>c!==t)).slice(0,3)]);
    return {kind:"cp",mode,dir,t,key:"c"+t.i,opts};
  }
  const pool=EL.slice(0,P.pool);
  const t=weightedPick(pool,e=>e.n,used); used.add(t.n);
  // distractors: prefer near neighbours so it's not too easy
  const near=pool.filter(e=>e!==t&&Math.abs(e.n-t.n)<=12);
  const src=near.length>=3?near:pool.filter(e=>e!==t);
  const opts=shuffle([t,...shuffle(src).slice(0,3)]);
  return {kind:"el",mode,t,key:t.n,opts};
}
function start(mode){
  const used=new Set();
  G={mode,qs:Array.from({length:ROUND},()=>makeQ(mode,used)),i:0,score:0,streak:0,bestStreak:0,results:[],missed:[],answered:false,hint:0,done:false};
  render();
}
function promptHTML(q){
  const t=q.t;
  if(q.kind==="cp"){
    return q.dir==="f2n"
      ? `<div class="prompt-q">What is this compound called?</div><div class="bigpic" aria-hidden="true">${t.pic}</div><div class="formula">${fmt(t.f)}</div>`
      : `<div class="prompt-q">What's the formula for this?</div><div class="bigpic" aria-hidden="true">${t.pic}</div><div class="bigname">${esc(t.name)}</div><div class="clue">${esc(t.fact)}</div>`;
  }
  switch(q.mode){
    case "picture": return `<div class="prompt-q">Which element is this?</div><div class="bigpic" aria-hidden="true">${t.pic}</div><div class="clue">${esc(t.fact)}</div>`;
    case "symbol": return `<div class="prompt-q">What's this element called?</div><div class="tile" style="--c:var(--c-${t.cat})"><span class="n">${t.n}</span><span class="s">${t.sym}</span><span class="nm">?</span></div>`;
    case "name2sym": return `<div class="prompt-q">What's the symbol for…</div><div class="bigname">${esc(t.name)}</div><div class="bigpic" style="font-size:56px" aria-hidden="true">${t.pic}</div>`;
    case "find": return `<div class="prompt-q">Find <span style="color:var(--accent)">${esc(t.name)}</span> on the table!</div><div class="clue" style="font-size:15px">${t.pic} ${esc(t.fact)}</div>`;
  }
}
function optLabel(q,o,i){
  const k=`<span class="k">${i+1}</span>`;
  if(q.kind==="cp") return q.dir==="f2n" ? `${k}<span>${esc(o.name)}</span>` : `${k}<span class="f" style="font-family:var(--f-display);font-size:24px;font-weight:400">${fmt(o.f)}</span>`;
  return q.mode==="name2sym" ? `${k}<span>${o.sym}</span>` : `${k}<span>${esc(o.name)}</span>`;
}
const typingFor = q=>P.typing && q.mode!=="find";
function hintText(q){
  if(q.mode==="find") return `Hint: it's in period ${q.t.period}${q.t.period>=6&&q.t.row>7?" (in the bottom rows)":""}, and it's a ${CATS[q.t.cat].label.toLowerCase()}.`;
  const ans = answerText(q);
  return `Hint: it starts with “${ans[0]}” and has ${ans.replace(/\s/g,"").length} characters.`;
}
function answerText(q){
  if(q.kind==="cp") return q.dir==="f2n"?q.t.name:q.t.f;
  return q.mode==="name2sym"?q.t.sym:q.t.name;
}
function renderGame(){
  const q=G.qs[G.i];
  const typing=typingFor(q);
  const bar=G.qs.map((_,i)=>`<i class="${i<G.results.length?(G.results[i]?"ok":"no"):(i===G.i?"now":"")}"></i>`).join("");
  let body=promptHTML(q);
  if(q.mode==="find"){
    const mark={}; if(G.answered){mark[q.t.n]=G.lastOk?"hit":"glow"; if(!G.lastOk&&G.picked) mark[G.picked]="miss";}
    else if(G.hint>=2) mark[q.t.n]="glow";
    body+=`<div style="width:100%;text-align:left">${tableHTML({hideNames:true,dim:e=>e.n>P.pool,mark})}</div>`;
  } else if(typing){
    body+=`<form class="typebox" id="tf" autocomplete="off"><input id="ans" aria-label="Your answer" placeholder="${q.kind==="cp"&&q.dir==="n2f"?"Type the formula, like H2O":q.mode==="name2sym"?"Type the symbol":"Type the name"}" ${G.answered?"disabled":""}><button class="btn" ${G.answered?"disabled":""}>Check</button></form>`;
  } else {
    body+=`<div class="options">${q.opts.map((o,i)=>{
      let cls="opt"+(q.mode==="name2sym"&&q.kind==="el"?" sym":"");
      const val=q.kind==="cp"?o.i:o.n, tv=q.kind==="cp"?q.t.i:q.t.n;
      if(G.answered){ if(val===tv)cls+=" correct"; else if(val===G.picked)cls+=" wrong"; }
      else if(G.removed&&G.removed.includes(val)) cls+=" gone";
      return `<button class="${cls}" data-v="${val}" ${G.answered||(G.removed&&G.removed.includes(val))?"disabled":""}>${optLabel(q,o,i)}</button>`;}).join("")}</div>`;
  }
  if(!G.answered){
    const fifty = !typing && q.mode!=="find";
    body+=`<div class="helpers">
      ${fifty?`<button id="h50" ${G.hint?"disabled":""}>✂️ 50/50 (half points)</button>`:`<button id="hclue" ${G.hint?"disabled":""}>💡 Hint (half points)</button>`}
      <button id="hshow">👀 Just show me the answer</button></div>`;
    if(G.hintMsg) body+=`<div class="hinttext">${esc(G.hintMsg)}</div>`;
  } else {
    body+=feedbackHTML(q);
  }
  $("#app").innerHTML=`<section class="panel" style="display:grid;gap:18px">
    <div class="gamebar"><button class="btn ghost" id="quit" style="padding:6px 14px;font-size:14px">✕ Quit</button>
      <div class="progress" aria-label="Question ${G.i+1} of ${ROUND}">${bar}</div>
      <span class="chip">Score <b>${G.score.toLocaleString()}</b></span>
      <span class="streak" aria-label="Streak ${G.streak}">${G.streak>=2?"🔥 "+G.streak:""}</span></div>
    <div class="card">${body}</div></section>`;
  bindGame(q,typing);
}
function feedbackHTML(q){
  const t=q.t, ok=G.lastOk;
  const head = G.revealed ? "Here's the answer!" : ok ? ["Nailed it!","Awesome!","You're on fire!","Science genius!","Correct!"][Math.random()*5|0] : "Not quite!";
  const title = q.kind==="cp" ? `${fmt(t.f)} = ${esc(t.name)}` : `${esc(t.name)} (${t.sym}) · #${t.n}`;
  const extra = q.kind==="cp" ? `<p class="muted" style="font-size:14px">Made of: ${atomsIn(t.f).map(e=>esc(e.name)).join(", ")}</p>` : `<p class="muted" style="font-size:14px">${CATS[t.cat].label} · period ${t.period}</p>`;
  return `<div class="feedback ${ok?"good":"bad"}" role="status"><div class="fpic" aria-hidden="true">${t.pic}</div>
    <div><h3>${head} ${ok?`<span class="points">+${G.lastPts}</span>`:""}</h3><p><b>${title}</b></p><p>${esc(t.fact)}</p>${extra}</div></div>
    <button class="btn" id="next">${G.i+1<ROUND?"Next question ▸":"See my score ▸"}</button>`;
}
function bindGame(q,typing){
  $("#quit").onclick=()=>{G=null;render();};
  if(G.answered){ const n=$("#next"); n.onclick=next; n.focus(); return; }
  if(q.mode==="find"){
    $("#app").querySelector(".ptable").addEventListener("click",e=>{const b=e.target.closest("[data-n]");if(!b||G.answered)return;const v=+b.dataset.n;if(v>P.pool)return;answer(v===q.t.n,v);});
  } else if(typing){
    const inp=$("#ans"); inp.focus();
    $("#tf").onsubmit=e=>{e.preventDefault();const v=inp.value.trim();if(!v)return;answer(checkTyped(q,v),null);};
  } else {
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const v=+b.dataset.v;answer(v===(q.kind==="cp"?q.t.i:q.t.n),v);});
  }
  const h50=$("#h50"); if(h50) h50.onclick=()=>{const tv=q.kind==="cp"?q.t.i:q.t.n;G.removed=shuffle(q.opts.map(o=>q.kind==="cp"?o.i:o.n).filter(v=>v!==tv)).slice(0,2);G.hint=1;sfx.click();renderGame();};
  const hc=$("#hclue"); if(hc) hc.onclick=()=>{G.hint=1;G.hintMsg=hintText(q);sfx.click();renderGame();};
  $("#hshow").onclick=()=>{G.revealed=true;answer(false,null,true);};
}
function checkTyped(q,v){
  const t=q.t;
  if(q.kind==="cp"){
    if(q.dir==="n2f") return v.replace(/\s/g,"").toUpperCase()===t.f.toUpperCase();
    return [t.name,...t.alt].some(a=>norm(a)===norm(v));
  }
  if(q.mode==="name2sym") return norm(v)===norm(t.sym);
  return [t.name,...t.alt].some(a=>norm(a)===norm(v));
}
document.addEventListener("keydown",e=>{
  if(tab!=="play"||!G||G.done||e.target.tagName==="INPUT") return;
  const q=G.qs[G.i]; if(G.answered||typingFor(q)||q.mode==="find") return;
  const k=+e.key; if(k>=1&&k<=4){const b=document.querySelectorAll(".opt")[k-1];if(b&&!b.disabled)b.click();}
});
function answer(ok,picked,revealed){
  const q=G.qs[G.i];
  G.answered=true; G.lastOk=ok; G.picked=picked;
  const k=q.key;
  if(ok){
    G.streak++; G.bestStreak=Math.max(G.bestStreak,G.streak);
    let pts=100+Math.min(G.streak-1,10)*20; if(typingFor(q))pts=Math.round(pts*1.5); if(G.hint)pts=Math.round(pts/2);
    G.lastPts=pts; G.score+=pts; P.xp+=pts;
    P.m[k]=Math.min(3,mk(k)+1);
    sfx.good(); if(G.streak%5===0) confetti(90);
  } else {
    G.streak=0; G.lastPts=0;
    if(!revealed) P.m[k]=Math.max(0,mk(k)-1);
    G.missed.push(q);
    revealed?sfx.click():sfx.bad();
  }
  G.results.push(ok); save(); renderStats(); renderGame();
}
function next(){
  G.i++; G.answered=false; G.hint=0; G.removed=null; G.hintMsg=null; G.revealed=false; G.picked=null;
  if(G.i>=ROUND){ G.done=true; finish(); return; }
  renderGame(); window.scrollTo({top:0,behavior:reduce?"auto":"smooth"});
}
function finish(){
  const right=G.results.filter(Boolean).length;
  const stars=right>=9?3:right>=7?2:right>=4?1:0;
  const isBest=G.score>(P.best[G.mode]||0); if(isBest){P.best[G.mode]=G.score;} save(); renderStats();
  const msg=["Every scientist starts somewhere. Study the cards below and try again!","Good start! Look over the ones you missed.","Great work! You're getting the hang of this.","Incredible! You're a true element expert!"][stars];
  const uniq=[...new Map(G.missed.map(q=>[q.key,q])).values()];
  $("#app").innerHTML=`<section class="panel results">
    <div class="starsbig" aria-label="${stars} of 3 stars">${[0,1,2].map(i=>`<span class="${i<stars?"":"off"}">⭐</span>`).join("")}</div>
    <div class="scorebig">${G.score.toLocaleString()}</div>
    <h2 style="font-size:26px">${right} out of ${ROUND} right${isBest&&G.score?" · New best!":""}</h2>
    <p class="muted" style="margin:0;max-width:52ch">${msg} Best streak: ${G.bestStreak} 🔥</p>
    <div class="row" style="justify-content:center"><button class="btn" id="again">Play again</button><button class="btn ghost" id="home">Choose another game</button></div>
    ${uniq.length?`<h3 style="font-size:20px;margin-top:8px">Study these</h3><div class="missed">${uniq.map(q=>q.kind==="cp"
      ?`<div><span class="p" aria-hidden="true">${q.t.pic}</span><span><b>${fmt(q.t.f)} · ${esc(q.t.name)}</b><small>${esc(q.t.fact)}</small></span></div>`
      :`<div><span class="p" aria-hidden="true">${q.t.pic}</span><span><b>${esc(q.t.name)} (${q.t.sym}) · #${q.t.n}</b><small>${esc(q.t.fact)}</small></span></div>`).join("")}</div>`:""}
  </section>`;
  $("#again").onclick=()=>start(G.mode); $("#home").onclick=()=>{G=null;render();};
  if(stars>=2){ sfx.win(); confetti(stars===3?220:120); }
}

// ---------- ROUTER ----------
function render(){
  renderStats();
  if(tab==="table") return renderTable();
  if(tab==="compounds") return renderCompounds();
  if(G&&!G.done) return renderGame();
  if(G&&G.done) return finish();
  renderHome();
}
render();
})();
</script>
</body>
</html>
