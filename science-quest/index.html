<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dylan's Science Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;600;800;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a night-shift mission-control console. Status bar on top, tab rail, then one column of console panels.
   Single dark look on purpose (an arcade screen), so colors are set once on :root. */
:root{
  --ink:#0b1622;          /* page ground: deep observatory blue */
  --panel:#122334;        /* console panel */
  --panel-2:#193049;      /* raised controls */
  --line:#2a4a69;         /* hairlines */
  --text:#eaf4ff; --muted:#9db4cc;
  --amber:#ffc23d; --amber-ink:#2b1d00; --amber-shadow:#b9851a;  /* primary accent: warning-lamp amber */
  --cyan:#4fd8ff;         /* secondary: oscilloscope cyan */
  --good:#5be49b; --bad:#ff6b6b; --warn:#ffa24d;
  --f-display:"Bungee","Impact","Arial Black",sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ink);color:var(--text)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px;
  background-image:radial-gradient(circle at 10% 0%,#17324d 0,transparent 42%),radial-gradient(circle at 95% 15%,#1d2a4f 0,transparent 38%),
    linear-gradient(rgba(79,216,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(79,216,255,.035) 1px,transparent 1px);
  background-size:auto,auto,28px 28px,28px 28px;background-attachment:fixed;min-height:100vh}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.3px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13px}
.label{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.stack{display:grid;gap:14px;min-width:0}

/* header */
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:54px;height:54px;border-radius:14px;background:var(--amber);display:grid;place-items:center;box-shadow:0 4px 0 var(--amber-shadow)}
.brand h1{font-size:clamp(20px,4.6vw,30px);line-height:1.05}
.brand p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip b{color:var(--amber)}
nav.tabs{display:flex;gap:4px;background:var(--panel);padding:5px;border-radius:999px;border:1px solid var(--line);max-width:100%;overflow-x:auto;width:max-content}
nav.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-weight:900;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--amber);color:var(--amber-ink)}

/* buttons */
.btn{background:var(--amber);color:var(--amber-ink);border:0;border-radius:12px;padding:12px 20px;font-weight:900;font-size:17px;box-shadow:0 4px 0 var(--amber-shadow)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--amber-shadow)}
.btn.ghost{background:transparent;color:var(--text);border:2px solid var(--line);box-shadow:none}
.btn.cyan{background:var(--cyan);color:#00222e;box-shadow:0 4px 0 #1f8fae}
.btn.sm{padding:6px 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center}
.hero h2{font-size:clamp(20px,4vw,28px)}
.hero p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.bar{height:12px;background:var(--panel-2);border-radius:999px;overflow:hidden}
.bar>span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--amber),var(--warn))}
.bar.cy>span{background:var(--cyan)} .bar.gd>span{background:var(--good)}
.goal{display:grid;place-items:center;width:132px;aspect-ratio:1;max-width:100%}
.goal svg{width:100%;height:auto}
.sechead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.sechead h2{font-size:22px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mode{text-align:left;background:var(--panel-2);border:2px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;transition:transform .12s,border-color .12s;min-width:0}
.mode:hover:not(:disabled){transform:translateY(-2px);border-color:var(--amber)}
.mode .pic{font-size:34px;line-height:1}
.mode h3{font-size:18px}
.mode p{margin:0;color:var(--muted);font-size:14px}
.mode .tag{font-size:12px;font-weight:900;color:var(--amber);letter-spacing:.6px;text-transform:uppercase}
.mode.hot{border-color:var(--bad);background:linear-gradient(160deg,rgba(255,107,107,.16),var(--panel-2) 70%)}
.mode.exam{border-color:var(--cyan);background:linear-gradient(160deg,rgba(79,216,255,.14),var(--panel-2) 70%)}
.mode:disabled{opacity:.55;cursor:default}
.chpick{display:flex;flex-wrap:wrap;gap:6px}
.chchip{--c:var(--line);border:2px solid var(--c);background:transparent;border-radius:999px;padding:4px 10px;font-weight:800;font-size:13px;color:var(--text)}
.chchip[aria-pressed="true"]{background:var(--c);color:#06121c}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--panel-2);border-radius:12px;padding:12px 14px;display:grid;gap:2px}
.kpi b{font-family:var(--f-display);font-size:26px;font-weight:400;font-variant-numeric:tabular-nums}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.chcard{--c:var(--cyan);background:var(--panel-2);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:14px;display:grid;gap:8px;min-width:0}
.chcard .top{display:flex;gap:10px;align-items:center}
.chcard .ic{font-size:28px;line-height:1}
.chcard h3{font-family:var(--f-body);font-weight:900;font-size:16px;line-height:1.2}
.chcard .ref{font-size:12px;color:var(--muted)}
.meter{display:grid;grid-template-columns:78px minmax(0,1fr) 42px;gap:8px;align-items:center;font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.meter .bar{height:8px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;white-space:nowrap}
.pill.new{background:var(--line);color:var(--muted)} .pill.prog{background:rgba(79,216,255,.2);color:var(--cyan)}
.pill.weak{background:rgba(255,107,107,.2);color:var(--bad)} .pill.done{background:rgba(91,228,155,.2);color:var(--good)}
table.hist{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.hist th,table.hist td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
table.hist th{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.tablewrap{overflow-x:auto}

/* question card */
.gamebar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.dots{flex:1 1 200px;display:flex;gap:4px}
.dots i{flex:1;height:10px;border-radius:999px;background:var(--panel-2)}
.dots i.ok{background:var(--good)} .dots i.no{background:var(--bad)} .dots i.now{background:var(--amber)}
.streak{font-family:var(--f-display);font-size:18px;color:var(--warn)}
.chtag{--c:var(--cyan);display:inline-flex;gap:6px;align-items:center;border:1px solid var(--c);color:var(--c);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:900;letter-spacing:.4px}
.qtext{font-size:clamp(19px,3.4vw,24px);font-weight:900;line-height:1.35;max-width:62ch}
.qfig{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;place-items:center;overflow-x:auto}
.qfig svg{width:100%;max-width:420px;height:auto}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{background:var(--panel-2);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:800;font-size:16px;display:flex;gap:12px;align-items:center;text-align:left;min-height:60px;transition:transform .1s,border-color .1s;min-width:0}
.opt:hover:not(:disabled){border-color:var(--amber);transform:translateY(-2px)}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-display);font-size:14px;background:var(--line);color:var(--text)}
.opt.correct{border-color:var(--good);background:rgba(91,228,155,.18)}
.opt.wrong{border-color:var(--bad);background:rgba(255,107,107,.16);animation:shake .35s}
.opt.picked{border-color:var(--amber)}
.opt.gone{opacity:.18}
.opt:disabled{cursor:default}
.f{font-family:var(--f-mono);font-weight:700}
.feedback{border-radius:14px;padding:14px 16px;display:grid;gap:8px;animation:pop .25s}
.feedback.good{background:rgba(91,228,155,.12);border:2px solid var(--good)}
.feedback.bad{background:rgba(255,107,107,.1);border:2px solid var(--bad)}
.feedback.info{background:rgba(79,216,255,.08);border:2px solid var(--cyan)}
.feedback h3{font-size:19px}
.feedback p{margin:0;max-width:68ch}
.helpers{display:flex;gap:8px;flex-wrap:wrap}
.helpers button{background:transparent;border:1px dashed var(--line);border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px;color:var(--muted)}
.helpers button:disabled{opacity:.35;cursor:default}
.timer{font-family:var(--f-display);font-size:22px;color:var(--cyan);font-variant-numeric:tabular-nums}
.hearts{font-size:20px;letter-spacing:2px}

/* review */
.review{display:grid;gap:12px;border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--panel-2)}
.answers{display:grid;gap:6px}
.ans{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:8px 12px;font-weight:800;border:1px solid var(--line)}
.ans.ok{border-color:var(--good);background:rgba(91,228,155,.14)}
.ans.no{border-color:var(--bad);background:rgba(255,107,107,.1)}
.ans .who{flex:none;font-size:11px;letter-spacing:.8px;text-transform:uppercase;font-weight:900;padding:2px 8px;border-radius:999px;background:var(--ink);color:var(--muted);margin-left:auto}
.why{background:var(--ink);border-radius:12px;padding:12px 14px;border:1px solid var(--line);max-width:100%}
.why p{margin:0 0 6px} .why p:last-child{margin:0}
.where{font-size:13px;font-weight:800;color:var(--amber)}
.missrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.missrow:last-child{border-bottom:0}
details.nb{border:1px solid var(--line);border-radius:12px;background:var(--panel-2)}
details.nb summary{cursor:pointer;padding:12px 14px;font-weight:800;display:flex;gap:10px;align-items:center;list-style:none}
details.nb summary::-webkit-details-marker{display:none}
details.nb[open] summary{border-bottom:1px solid var(--line)}
details.nb .body{padding:14px;display:grid;gap:10px}

/* boss */
.arena{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;text-align:center}
.fighter{display:grid;gap:6px;justify-items:center}
.fighter .pic{font-size:clamp(56px,13vw,92px);line-height:1.1;transition:transform .2s}
.fighter .nm{font-weight:900}
.hp{width:100%;max-width:220px;height:14px;background:var(--panel-2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.hp span{display:block;height:100%;background:var(--bad);transition:width .3s}
.hp.me span{background:var(--good)}
.vs{font-family:var(--f-display);font-size:26px;color:var(--amber)}
.hitme{animation:shake .4s} .hitboss{animation:bossHit .5s}

/* formula vault */
.vault{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.fcard{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px;min-width:0}
.fcard .eq{font-family:var(--f-mono);font-weight:700;font-size:20px;color:var(--amber);overflow-wrap:anywhere}
.fcard .nm{font-weight:900}
.fcard .vars{font-size:13px;color:var(--muted)}
.fcard .ex{font-size:13px;background:var(--ink);border-radius:8px;padding:6px 10px}

/* blaster */
.stage{position:relative;border-radius:14px;overflow:hidden;border:2px solid var(--line);background:#050b14;touch-action:manipulation}
.stage canvas{display:block;width:100%}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,11,20,.82);text-align:center;padding:20px}
.overlay .stack{justify-items:center}
.lanebtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lanebtns button{border:0;border-radius:12px;padding:12px 6px;font-family:var(--f-display);font-size:18px;color:#06121c}
.bopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.bopt{display:flex;gap:10px;align-items:center;border-radius:10px;padding:8px 10px;background:var(--panel-2);font-weight:800;font-size:15px;border:2px solid transparent;min-width:0}
.bopt .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:13px;color:#06121c}

/* results */
.big{font-family:var(--f-display);font-size:clamp(40px,10vw,64px);line-height:1;color:var(--amber)}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--amber);color:var(--amber-ink);font-weight:900;border-radius:999px;padding:10px 20px;box-shadow:0 6px 20px rgba(0,0,0,.4);z-index:50;animation:pop .25s;max-width:calc(100% - 32px);text-align:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;width:100%;height:100%}
.confirm{border:2px solid var(--bad);border-radius:12px;padding:12px;display:grid;gap:10px}
textarea{width:100%;min-height:120px;background:var(--ink);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:13px var(--f-mono)}
input[type=text]{background:var(--ink);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:600 14px var(--f-body);min-width:0;width:100%}
.refgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px 14px}
.refgrid label{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center;font-size:14px;font-weight:800}
.refgrid label span{white-space:nowrap}

/* svg figure palette */
.fg-l{stroke:var(--text);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.fg-d{stroke:var(--muted);fill:none;stroke-width:2;stroke-dasharray:6 5}
.fg-t{fill:var(--text);font:800 14px var(--f-body)}
.fg-s{fill:var(--muted);font:700 12px var(--f-body)}
.fg-a{fill:var(--amber);font:900 15px var(--f-mono)}
.fg-c{fill:var(--cyan);font:900 15px var(--f-mono)}

@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:scale(1);opacity:1}}
@keyframes bossHit{0%{transform:scale(1)}30%{transform:scale(.85) rotate(-8deg);filter:brightness(2)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:640px){
  .options,.bopts{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr}
  .goal{width:110px}
  .panel{padding:16px}
  .arena{grid-template-columns:1fr 1fr}.vs{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="logo" aria-hidden="true"><svg viewBox="0 0 40 40" width="36" height="36"><path d="M15 5h10M17 5v10L8 32a3 3 0 0 0 3 4h18a3 3 0 0 0 3-4L23 15V5" fill="none" stroke="#2b1d00" stroke-width="3" stroke-linejoin="round"/><path d="M12 26h16l3 6H9z" fill="#2b1d00"/></svg></div>
      <div><h1>Dylan's Science Quest</h1><p>Science + formulas exam training · 16 chapters</p></div></div>
    <div class="stats" id="stats"></div>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
  <main id="app" class="wrap" style="max-width:none;width:100%"></main>
</div>
<canvas id="fx" aria-hidden="true"></canvas>
<script>
// ================= CHAPTERS =================
// Each chapter has a boss (Boss Battle mode). Book references are editable in Settings.
const CH = [
  {id:"sci",     n:1,  name:"Scientific Method & Measurement", icon:"🔬", c:"#4fd8ff", boss:["Doctor Sloppy Data","🧟"]},
  {id:"matter",  n:2,  name:"Matter & Its Properties",        icon:"🧊", c:"#7fc8ff", boss:["The Melting Golem","🗿"]},
  {id:"chem",    n:3,  name:"Atoms, Elements & Reactions",    icon:"⚗️", c:"#c49bff", boss:["Toxic Slime King","🦠"]},
  {id:"force",   n:4,  name:"Forces & Motion",                icon:"🚀", c:"#ff8a65", boss:["Inertia Rex","🦖"]},
  {id:"energy",  n:5,  name:"Energy, Work & Machines",        icon:"⚡", c:"#ffc23d", boss:["Volt Dragon","🐉"]},
  {id:"waves",   n:6,  name:"Waves, Sound & Light",           icon:"🌈", c:"#f78fd6", boss:["The Screaming Banshee","👻"]},
  {id:"elec",    n:7,  name:"Electricity & Magnetism",        icon:"🧲", c:"#ffe066", boss:["Robo-Zombie 9000","🤖"]},
  {id:"cells",   n:8,  name:"Cells & Living Things",          icon:"🦠", c:"#5be49b", boss:["Germ Lord","👾"]},
  {id:"genetics",n:9,  name:"Genetics & Heredity",            icon:"🧬", c:"#8ef0c8", boss:["The Mutant Gene Beast","🐙"]},
  {id:"body",    n:10, name:"Human Body Systems",             icon:"❤️", c:"#ff7a8a", boss:["Bone Zombie","💀"]},
  {id:"eco",     n:11, name:"Ecosystems & Ecology",           icon:"🌳", c:"#9be15d", boss:["Swamp Hydra","🐲"]},
  {id:"earth",   n:12, name:"Earth's Structure & Rocks",      icon:"🌋", c:"#e0a46b", boss:["Magma Wyrm","🌋"]},
  {id:"weather", n:13, name:"Weather, Water & Climate",       icon:"⛅", c:"#9fd3ff", boss:["Storm Wraith","🌪️"]},
  {id:"space",   n:14, name:"Space & the Solar System",       icon:"🪐", c:"#b7a6ff", boss:["Space Zombie Overlord","👽"]},
  {id:"mathf",   n:15, name:"Math Formulas",                  icon:"📐", c:"#ffb15a", boss:["The Geometry Dragon","🐉"]},
  {id:"sciform", n:16, name:"Science Formulas",               icon:"🧪", c:"#6fe0e0", boss:["Formula Phantom","🧛"]}
];
const CHM = Object.fromEntries(CH.map(c=>[c.id,c]));

// ================= QUESTION BANK =================
// Q(chapter, question, correctAnswer, [three tricky wrong answers], explanation, figure?)
// Wrong answers are common mistakes, so guessing does not work.
const BANK = [];
function Q(ch,q,a,d,why,fig){ BANK.push({id:ch+"-"+(BANK.filter(x=>x.ch===ch).length+1),ch,q,a,d,why,fig:fig||null}); }

// ---------- 1. Scientific Method & Measurement ----------
Q("sci","A student tests whether the AMOUNT of fertilizer changes how tall bean plants grow. What is the dependent variable?",
 "The height of the plants",["The amount of fertilizer","The type of soil, kept the same for every plant","The plants that get no fertilizer at all"],
 "The dependent variable is what you MEASURE. It 'depends' on what you change. The fertilizer amount is what you change (independent variable). The soil is kept the same (a controlled variable). The no-fertilizer plants are the control group.",["vars"]);
Q("sci","Which of these is the BEST scientific hypothesis?",
 "If plants get more hours of light, then they will grow taller, because light powers photosynthesis.",
 ["Do plants grow taller when they get more hours of light, and does the color of the light matter too?","Plants are living things, so they will always grow when they are given sunlight.","My plants that got more light grew 4 cm taller than the plants that got less light."],
 "A hypothesis is a testable prediction, often written 'If… then… because…'. A question is not a hypothesis. 'Plants grow' has nothing to test. '4 cm taller' is a RESULT you get after the experiment.");
Q("sci","Why do scientists repeat an experiment several times?",
 "To make sure the results are reliable and not just luck or a mistake",
 ["To change the independent variable a little each time","To prove the hypothesis is 100% true forever","To get a different answer each time"],
 "Repeated trials show whether results are consistent. Science never proves a hypothesis 'forever'. Evidence supports it. In each repeat you keep the same setup.");
Q("sci","How many milliliters are in 2.5 liters?","2,500 mL",["250 mL","25 mL","25,000 mL"],
 "1 L = 1,000 mL. So 2.5 × 1,000 = 2,500 mL. Moving from a bigger unit to a smaller unit means you multiply.",["ladder"]);
Q("sci","What is the SI (metric) BASE unit of mass?","Kilogram (kg)",["Gram (g)","Newton (N)","Liter (L)"],
 "The SI base unit for mass is the kilogram. It is the only base unit with a prefix built in. A newton measures FORCE (and weight). A liter measures VOLUME.");
Q("sci","A pencil is 0.18 m long. How long is it in centimeters?","18 cm",["1.8 cm","180 cm","0.018 cm"],
 "1 m = 100 cm. So 0.18 × 100 = 18 cm. Check it: a real pencil is about 18 cm long.",["ladder"]);
Q("sci","Which tool measures the VOLUME of a liquid most precisely?","Graduated cylinder",["Beaker","Triple-beam balance","Spring scale"],
 "A graduated cylinder has fine markings for volume. A beaker's markings are only rough estimates. A triple-beam balance measures mass. A spring scale measures force (weight).");
Q("sci","In an experiment, the group that does NOT get the treatment being tested is called the…","Control group",["Experimental group","Independent group","Dependent group"],
 "The control group is your baseline for comparison. The experimental group gets the change you are testing.",["vars"]);
Q("sci","Water boils at 100 °C at sea level. About what is that in kelvin?","373 K",["212 K","273 K","100 K"],
 "K = °C + 273. So 100 + 273 = 373 K. 212 is the boiling point in °F, and 273 K is where water FREEZES.");
Q("sci","When reading a graduated cylinder, you should read the volume at…","The bottom of the curved surface (meniscus), at eye level",
 ["The top edge of the curve where water touches the glass","The highest mark the water ever splashed to","From above, looking down into the cylinder"],
 "Water curves up at the edges. That curve is the meniscus. Put your eye level with the liquid and read the bottom of the curve.",["meniscus"]);
Q("sci","'The leaf is 6.2 cm long' is an example of…","Quantitative data",["Qualitative data","A hypothesis","An inference"],
 "Quantitative data uses numbers (quantity). Qualitative data describes qualities, like 'the leaf is bright green'.");
Q("sci","The metric prefix 'kilo-' means…","1,000 times the base unit",["1/1,000 of the base unit","100 times the base unit","1/100 of the base unit"],
 "kilo = 1,000 (1 km = 1,000 m). milli = 1/1,000. centi = 1/100. Remember 'King Henry Died By Drinking Chocolate Milk': kilo, hecto, deka, BASE, deci, centi, milli.",["ladder"]);

// ---------- 2. Matter ----------
Q("matter","Which best describes the particles in a LIQUID?","Close together, but able to slide past each other",
 ["Locked in fixed places, only vibrating","Far apart, zooming around to fill the whole container","Not moving at all"],
 "Solid: packed and vibrating in place. Liquid: close but able to flow past each other. Gas: far apart and spread out. Particles are ALWAYS moving, even in solids.",["states"]);
Q("matter","Which of these is a CHEMICAL change?","An iron nail rusting",["Ice melting into water","Sugar dissolving in water","Cutting paper into pieces"],
 "In a chemical change a NEW substance forms. Rust (iron oxide) is a new substance. Melting, dissolving and cutting are physical changes, because the substance is still the same stuff.");
Q("matter","Which observation is the best sign of a CHEMICAL change?","Two liquids are mixed and bubbles of a new gas form",
 ["Water is heated and bubbles of steam form","A glass shatters into pieces","Clay is squished into a new shape"],
 "A new gas from mixing substances means a new substance was made. Boiling water bubbles too, but steam is still H₂O, so that is a physical change.");
Q("matter","A block with density 0.8 g/cm³ is placed in water (density 1.0 g/cm³). What happens?","It floats",
 ["It sinks, because everything with mass sinks","It sinks only if it is a big block","It dissolves"],
 "Objects LESS dense than water float. Size does not matter. A tiny piece or a huge piece of the same material has the same density.",["float"]);
Q("matter","A gas turning DIRECTLY into a solid, skipping the liquid stage, is called…","Deposition",["Sublimation","Condensation","Freezing"],
 "Deposition: gas → solid (like frost forming). Sublimation is the opposite, solid → gas (like dry ice). Condensation is gas → liquid. Freezing is liquid → solid.",["phase"]);
Q("matter","Salt completely dissolved in water is an example of a…","Solution (a mixture that looks the same throughout)",["Compound (two elements chemically bonded)","Element (one kind of atom only)","Heterogeneous mixture (parts you can see)"],
 "Salt water is a mixture, because you can separate it again by evaporating the water. It is evenly mixed, so it is a homogeneous mixture, called a solution. It is not a compound, since no chemical bond forms between salt and water.");
Q("matter","Which of these is a PURE SUBSTANCE?","Distilled water (H₂O)",["Air","Salad dressing","Ocean water"],
 "A pure substance has only one kind of matter, either an element or a compound. Distilled water is just H₂O. Air, salad dressing and ocean water are mixtures of several substances.");
Q("matter","While pure ice is melting, its temperature…","Stays the same until all of it has melted",["Rises steadily the whole time","Drops","Rises twice as fast"],
 "During a phase change, the heat energy goes into breaking particles apart instead of raising the temperature. That is the flat part of a heating curve, at 0 °C for ice.",["heatcurve"]);
Q("matter","Which property helps identify a substance, no matter HOW MUCH of it you have?","Density",["Mass","Volume","Length"],
 "Density = mass ÷ volume. It stays the same for a substance whether you have a little or a lot. Mass, volume and length change with the amount.");
Q("matter","What happens to the particles of most substances when they are heated?","They move faster and spread farther apart",
 ["The particles themselves get bigger","They move slower and pack closer","They turn into different atoms"],
 "Heat makes particles move faster, so they push farther apart and the material expands. The particles do NOT grow. Only the space between them grows.",["states"]);
Q("matter","Which method best separates IRON FILINGS from SAND?","Use a magnet",["Pour it through a filter","Boil it until it evaporates","Stir it into water"],
 "Iron is magnetic and sand is not. A filter will not work because both are solids that stay on the filter paper.");
Q("matter","The amount of MATTER in an object is its…","Mass",["Volume","Weight","Density"],
 "Mass is the amount of matter (kg or g). Weight is the pull of gravity on that mass (newtons). Volume is how much SPACE something takes up.");

// ---------- 3. Atoms, Elements & Reactions ----------
Q("chem","Which particle in an atom has a NEGATIVE charge?","Electron",["Proton","Neutron","Nucleus"],
 "Protons are positive (+), neutrons are neutral (0), and electrons are negative (−). The nucleus holds the protons and neutrons, so overall it is positive.",["atom",3,4,3]);
Q("chem","An element's ATOMIC NUMBER tells you the number of…","Protons",["Neutrons","Protons + neutrons","Electron shells"],
 "Atomic number = number of protons, and that is what decides which element it is. Protons + neutrons = MASS number. The number of electron shells matches the period (row).");
Q("chem","Carbon-14 has 6 protons. How many NEUTRONS does it have?","8",["6","14","20"],
 "Mass number (14) = protons + neutrons. So neutrons = 14 − 6 = 8.",["atom",6,8,6]);
Q("chem","Elements in the same GROUP (column) of the periodic table act alike mainly because they have the same number of…","Valence (outer-shell) electrons",["Neutrons in the nucleus","Protons in the nucleus","Electron shells (energy levels)"],
 "Elements in the same column have the same number of outer electrons, and those electrons control how an element reacts. Elements in the same ROW (period) share the same number of shells.",["pgrid"]);
Q("chem","In the reaction 2H₂ + O₂ → 2H₂O, what are the REACTANTS?","H₂ and O₂",["H₂O only","H₂ and H₂O","O₂ and H₂O"],
 "Reactants are on the LEFT of the arrow (what you start with). Products are on the RIGHT (what is made). The arrow means 'yields'.",["rxn"]);
Q("chem","10 g of baking soda and 30 g of vinegar react inside a SEALED bag and make gas. What is the total mass afterward?","40 g",
 ["Less than 40 g, because gas weighs nothing","More than 40 g, because new gas was made","20 g"],
 "The Law of Conservation of Mass says matter is not created or destroyed. In a sealed bag the gas stays inside, so the total mass stays 10 + 30 = 40 g.");
Q("chem","A solution with a pH of 3 is…","An acid",["A base","Neutral","A stronger base than pH 10"],
 "pH below 7 = acid, 7 = neutral (pure water), and above 7 = base. A pH of 3 is a fairly strong acid, a bit like lemon juice or vinegar.",["ph",3]);
Q("chem","What does the formula H₂O tell you?","Each molecule has 2 hydrogen atoms bonded to 1 oxygen atom",
 ["Each molecule has 1 hydrogen atom and 2 oxygen atoms","Each molecule has 2 hydrogen and 2 oxygen atoms","Hydrogen and oxygen are just mixed, not bonded"],
 "The small number (subscript) belongs to the atom right BEFORE it. H₂ = 2 hydrogens, and O with no number = 1 oxygen. H₂O₂ (2 and 2) is hydrogen peroxide, a different chemical.");
Q("chem","Which of these is a COMPOUND?","Carbon dioxide (CO₂)",["Oxygen gas (O₂)","Gold (Au)","Neon (Ne)"],
 "A compound has TWO OR MORE DIFFERENT elements bonded together. O₂ is a molecule, but it is only oxygen, so it is still an element.");
Q("chem","Most of the elements on the periodic table are…","Metals",["Nonmetals","Metalloids","Noble gases"],
 "About 3 out of every 4 elements are metals. Metals sit on the left and middle of the table. Nonmetals are on the upper right, and metalloids lie along the 'staircase' between them.",["pgrid"]);
Q("chem","A reaction that RELEASES heat, so the container feels warm, is…","Exothermic",["Endothermic","A physical change","Neutral"],
 "EXO = exit: heat leaves the reaction (fire, hand warmers). ENDO = enter: heat goes in, so it feels cold (instant ice packs).");
Q("chem","Which element is a NOBLE GAS that almost never reacts?","Neon (Ne)",["Oxygen (O)","Chlorine (Cl)","Sodium (Na)"],
 "Noble gases (group 18: He, Ne, Ar…) have full outer electron shells, so they rarely react. Chlorine and sodium are VERY reactive.");
Q("chem","How many atoms in total are in ONE molecule of glucose, C₆H₁₂O₆?","24",["3","18","72"],
 "Add the subscripts: 6 carbon + 12 hydrogen + 6 oxygen = 24 atoms. '3' counts the kinds of elements, not the atoms.");

// ---------- 4. Forces & Motion ----------
Q("force","A hockey puck slides on very smooth ice and keeps going for a long way. This best shows…","Newton's 1st law (inertia)",
 ["Newton's 2nd law (F = ma)","Newton's 3rd law (action–reaction)","The law of conservation of mass"],
 "1st law: an object in motion stays in motion unless an unbalanced force acts on it. Ice has very little friction, so the puck keeps going.");
Q("force","When you push on a wall, the wall pushes back on you with…","An equal force in the opposite direction",
 ["A smaller force, because walls don't move","No force, because walls can't push","A bigger force"],
 "Newton's 3rd law: every action has an EQUAL and OPPOSITE reaction. That is why your hand feels the push.");
Q("force","A box is pushed RIGHT with 10 N and LEFT with 4 N. What is the net force?","6 N to the right",["14 N to the right","6 N to the left","0 N, the forces are balanced"],
 "Opposite directions → SUBTRACT: 10 − 4 = 6 N. The net force points toward the bigger force (right). You add only when forces point the SAME way.",["forces",10,4]);
Q("force","Which statement about mass and weight is TRUE?","On the Moon your mass stays the same, but your weight is less",
 ["On the Moon both your mass and your weight are less","On the Moon your weight stays the same, but your mass is less","Mass and weight are the same thing"],
 "Mass = the amount of matter, and it does not change anywhere. Weight = the pull of gravity on that mass. The Moon's gravity is about 1/6 of Earth's, so you weigh about 1/6 as much.");
Q("force","Velocity is different from speed because velocity also includes…","Direction",["Time","Mass","Distance"],
 "Speed: 30 m/s. Velocity: 30 m/s NORTH. Velocity = speed + direction.");
Q("force","A car speeds up from 0 to 20 m/s in 5 seconds. What is its acceleration?","4 m/s²",["100 m/s²","0.25 m/s²","20 m/s²"],
 "a = (final velocity − starting velocity) ÷ time = (20 − 0) ÷ 5 = 4 m/s². 100 comes from multiplying instead of dividing.");
Q("force","Which of these IS accelerating?","A car going around a curve at a steady 30 mph",
 ["A car driving straight at a steady 30 mph","A car parked in a driveway","A book resting on a desk"],
 "Acceleration is ANY change in velocity: speeding up, slowing down, OR changing direction. Going around a curve changes direction, so the car is accelerating even at a steady speed.");
Q("force","Friction always acts…","Opposite to the direction an object moves (or tries to move)",
 ["In the same direction the object moves","Straight down, like gravity","Only on rough surfaces"],
 "Friction resists motion, so it points opposite to the motion. Smooth surfaces still have some friction. They just have less.");
Q("force","With NO air resistance (like on the Moon), a hammer and a feather are dropped together. They…","Hit the ground at the same time",
 ["Hammer lands first because it is heavier","Feather lands first because it is lighter","Float, because there is no air"],
 "Gravity speeds up all objects at the same rate. On Earth the feather falls slowly only because AIR pushes against it. Astronauts tested this on the Moon in 1971.");
Q("force","On a distance–time graph, a FLAT horizontal line means the object is…","Stopped, not moving",["Moving at a constant speed","Speeding up","Slowing down"],
 "Flat line = the distance is not changing, so the object is stopped. A straight SLANTED line = constant speed. A curving line = changing speed.",["dtgraph"]);
Q("force","The SAME force pushes a 2 kg cart and a 4 kg cart. Which accelerates more?","The 2 kg cart, about twice as much",["The 4 kg cart","Both accelerate the same","Neither one moves"],
 "a = F ÷ m. Less mass → more acceleration. Half the mass means double the acceleration.");
Q("force","The gravity pull between two objects gets STRONGER when…","Their masses get bigger or they move closer together",
 ["They move farther apart from each other","They get colder and their particles slow down","They spin faster and move in a straight line"],
 "Gravity depends on mass and distance. More mass → more pull. More distance → less pull.");

// ---------- 5. Energy ----------
Q("energy","A roller coaster car has the MOST gravitational potential energy…","At the top of the highest hill",["At the bottom of the first drop","Halfway down the first drop","When it is moving the fastest"],
 "Potential energy depends on HEIGHT (PE = mgh). Highest point = most PE. At the bottom, that energy has turned into kinetic energy, so the car moves fastest there.",["coaster"]);
Q("energy","As a ball falls toward the ground, its potential energy mostly changes into…","Kinetic energy",["Chemical energy","Nuclear energy","More potential energy"],
 "Falling lowers the height (less PE) and raises the speed (more KE). Energy changes form. It is not lost.",["coaster"]);
Q("energy","The Law of Conservation of Energy says that energy…","Cannot be created or destroyed, only changed from one form to another",
 ["Gets used up by machines and then disappears","Can be created by machines like generators and batteries","Is destroyed and lost forever whenever heat is made"],
 "Total energy stays the same. When energy 'turns into heat', that heat is still energy. It has just spread out into the surroundings.");
Q("energy","A metal spoon in hot soup gets hot all the way up the handle. This is…","Conduction",["Convection","Radiation","Insulation"],
 "Conduction = heat moving through DIRECT CONTACT, particle to particle. Metals are good conductors.",["heat"]);
Q("energy","Warm air rising and cool air sinking in a room, making a loop, is…","Convection",["Conduction","Radiation","Reflection"],
 "Convection = heat carried by moving liquids or gases in a loop called a convection current. Warm fluid is less dense, so it rises.",["heat"]);
Q("energy","Heat from the Sun reaches Earth across empty space by…","Radiation",["Conduction","Convection","Insulation"],
 "Radiation = energy carried by electromagnetic waves, which need no matter. Space is a near vacuum, so conduction and convection can't carry heat across it.",["heat"]);
Q("energy","In science, WORK is done when…","A force moves an object a distance in the direction of the force",
 ["You push hard on a wall that doesn't move","You hold a heavy box perfectly still","You think hard about your homework"],
 "W = F × d. If the distance is 0, the work is 0, no matter how tired you get.");
Q("energy","A ramp (inclined plane) makes lifting a box easier because it…","Lets you use less force, but over a longer distance",
 ["Cuts the total amount of work down to zero","Creates extra energy that helps push the box","Makes the box's mass smaller as it goes up"],
 "Simple machines trade force for distance. The work (F × d) stays about the same, or a bit more because of friction. You just push with less force.",["ramp"]);
Q("energy","A seesaw is which simple machine?","Lever",["Pulley","Wedge","Screw"],
 "A lever is a bar that pivots on a point called the fulcrum. On a seesaw, the fulcrum is in the middle.",["lever"]);
Q("energy","The energy stored in food, gasoline and batteries is…","Chemical energy",["Kinetic energy","Thermal energy","Sound energy"],
 "Chemical energy is stored in the bonds between atoms and is released by reactions such as digestion or burning.");
Q("energy","A solar panel changes…","Light (radiant) energy into electrical energy",["Electrical energy into light energy","Heat energy into chemical energy","Chemical energy into electrical energy"],
 "Solar panels: light → electricity. A light bulb does the reverse. A battery turns chemical energy into electrical energy.");
Q("energy","Which is a RENEWABLE energy source?","Wind",["Coal","Natural gas","Oil"],
 "Renewable sources get refilled naturally: wind, solar, water (hydro), geothermal. Coal, oil and natural gas are fossil fuels that take millions of years to form.");
Q("energy","You hold an ice cube and your hand feels cold. What is really happening?","Heat flows from your warm hand into the colder ice",
 ["'Cold' flows from the ice into your hand","Heat flows from the ice into your hand","No energy moves at all"],
 "Heat ALWAYS flows from hotter to colder. There is no such thing as 'cold' flowing. Your hand feels cold because it is LOSING heat.");

// ---------- 6. Waves ----------
Q("waves","The distance from one CREST to the next CREST of a wave is the…","Wavelength",["Amplitude","Frequency","Trough"],
 "Wavelength (λ) = the length of one full wave, crest to crest. Amplitude = height from the middle line to a crest. Frequency = waves per second.",["wave"]);
Q("waves","A LOUDER sound has a bigger…","Amplitude",["Frequency","Wavelength","Speed"],
 "Loudness = amplitude, the size of the vibration. Pitch (high or low) = frequency.",["wave"]);
Q("waves","A HIGHER-PITCHED sound has a higher…","Frequency",["Amplitude","Volume","Wavelength"],
 "High pitch = more vibrations per second = higher frequency (measured in hertz, Hz). Higher frequency also means a SHORTER wavelength.",["wave"]);
Q("waves","Sound travels FASTEST through…","Solids, like steel",["Gases, like air","Liquids, like water","Empty space (a vacuum)"],
 "Sound is a vibration passed from particle to particle. Particles packed closer together pass it faster: solids are fastest, then liquids, then gases. In a vacuum sound can't travel at all.");
Q("waves","Why can't sound travel through outer space?","Space is a vacuum, with no particles to vibrate",["Space is so cold that sound waves freeze","The Sun's bright light blocks the sound","Space has too much gravity for sound to escape"],
 "Sound is a mechanical wave and needs matter to travel through. Light is electromagnetic, so it CAN cross empty space.");
Q("waves","A straw looks 'broken' where it enters a glass of water. This bending of light is called…","Refraction",["Reflection","Absorption","Diffraction"],
 "Refraction = light bending as it changes speed going from one material into another, like air to water. Reflection = light bouncing off a surface.",["refract"]);
Q("waves","A red apple looks red because it…","Reflects red light and absorbs the other colors",["Absorbs red light and reflects the other colors","Makes its own red light, like a light bulb","Reflects all the colors of light equally"],
 "We see the color that an object REFLECTS. An object that reflects all colors looks white. One that absorbs all colors looks black.");
Q("waves","Which of these electromagnetic waves carries the MOST energy?","Gamma rays",["X-rays","Ultraviolet","Radio waves"],
 "From lowest to highest energy: Radio, Microwave, Infrared, Visible, Ultraviolet, X-ray, Gamma. Higher energy = higher frequency = shorter wavelength.",["spectrum"]);
Q("waves","You see lightning BEFORE you hear the thunder because…","Light travels much faster than sound",
 ["The thunder actually happens later","Sound is faster, but it starts later","Your eyes work faster than your ears"],
 "They happen at the same moment. Light (about 300,000 km/s) reaches you almost instantly. Sound (about 343 m/s) takes about 3 seconds for every kilometer.");
Q("waves","A light ray hits a flat mirror at an angle of 35° from the normal line. What is the angle of reflection?","35°",["55°","70°","145°"],
 "Law of Reflection: angle of incidence = angle of reflection. Both are measured from the normal, the line straight out from the mirror at 90°.",["mirror"]);
Q("waves","A material that lets NO light pass through it is…","Opaque",["Transparent","Translucent","Refractive"],
 "Transparent: light passes clearly (window glass). Translucent: some light passes, but blurry (wax paper). Opaque: no light passes (wood).");
Q("waves","Sound waves are which type of wave?","Longitudinal (compression) waves",["Transverse waves","Electromagnetic waves","Light waves"],
 "In sound, particles vibrate back and forth in the SAME direction the wave travels, making squeezes (compressions) and stretches (rarefactions). Light is transverse and electromagnetic.",["longi"]);

// ---------- 7. Electricity & Magnetism ----------
Q("elec","Three bulbs are wired in a SERIES circuit. One bulb burns out. What happens?","All the bulbs go out",["Only the broken bulb goes out","The other bulbs get brighter","The battery stops working forever"],
 "A series circuit has only ONE path. A broken bulb opens the loop, so current stops everywhere.",["circuit","s"]);
Q("elec","Homes are wired in PARALLEL circuits because…","Each device has its own path, so one can turn off while the others stay on",
 ["There is only one path, so every device shares the same loop","It makes the electricity travel faster through the house","Parallel circuits need less wire, so they are cheaper to build"],
 "In parallel, each branch is its own loop. Turning off the TV doesn't shut off the fridge.",["circuit","p"]);
Q("elec","Which of these is the BEST electrical conductor?","Copper wire",["Rubber","Plastic","Glass"],
 "Metals like copper let electrons flow easily. Rubber, plastic and glass are insulators, which is why wires are coated in plastic or rubber.");
Q("elec","Two magnets are placed North pole to North pole. They will…","Repel (push apart)",["Attract (pull together)","Do nothing","Swap poles so they can stick"],
 "Like poles REPEL (N–N or S–S). Opposite poles ATTRACT (N–S).",["magnet"]);
Q("elec","How can you make an electromagnet STRONGER?","Wrap more coils of wire around the iron core",["Use fewer coils of wire","Use a plastic core instead of iron","Disconnect the battery"],
 "More coils, more current, and an iron core all make a stronger electromagnet. With no current there is no magnetism.");
Q("elec","A 12-volt battery is connected to a 4-ohm resistor. What is the current? (V = I × R)","3 amps",["48 amps","0.33 amps","16 amps"],
 "I = V ÷ R = 12 ÷ 4 = 3 A. 48 comes from multiplying. 16 comes from adding.",["ftri","V","I","R"]);
Q("elec","A complete, unbroken loop that electricity can flow around is a…","Closed circuit",["Open circuit","Short fuse","Insulator"],
 "Closed circuit = complete path, so current flows. Open circuit = there's a gap (like a switch turned off), so no current flows.");
Q("elec","You rub a balloon on your hair and the balloon sticks to the wall. This is caused by…","Static electricity (electrons moving from one object to another)",
 ["Magnetism (the balloon becomes a magnet)","Gravity (the wall pulls on the balloon)","Current electricity flowing in a circuit"],
 "Rubbing moves electrons from your hair to the balloon. The charged balloon attracts the wall. The charge builds up and stays put, so it is 'static'.");
Q("elec","A compass needle points north because…","Earth acts like a giant magnet with a magnetic field",["North is colder","The Sun pulls on the needle","Gravity is stronger at the North Pole"],
 "Earth's molten outer core creates a magnetic field. The compass needle, itself a tiny magnet, lines up with that field.");
Q("elec","A GENERATOR changes…","Mechanical (motion) energy into electrical energy",["Electrical energy into motion","Chemical energy into electrical energy","Light energy into electrical energy"],
 "A generator spins a magnet and coils of wire to make electricity. A MOTOR does the reverse: electricity → motion. A battery: chemical → electrical.");
Q("elec","The unit for electric CURRENT is the…","Ampere (amp, A)",["Volt (V)","Ohm (Ω)","Watt (W)"],
 "Current = amps. Voltage (the 'push') = volts. Resistance = ohms. Power = watts.");
Q("elec","Which of these metals is attracted to a magnet?","Iron",["Aluminum","Copper","Gold"],
 "Only a few metals are magnetic, mainly iron, nickel and cobalt (and steel, which contains iron). Aluminum cans and copper wire are NOT attracted.",["magnet"]);

// ---------- 8. Cells ----------
Q("cells","Which organelle releases energy from food and is called the cell's 'powerhouse'?","Mitochondria",["Chloroplast","Nucleus","Ribosome"],
 "Mitochondria do cellular respiration, turning sugar + oxygen into usable energy. Chloroplasts CAPTURE light energy to make sugar.",["cell"]);
Q("cells","Which structure is found in PLANT cells but NOT in animal cells?","Cell wall",["Cell membrane","Nucleus","Mitochondria"],
 "Plant cells have a stiff cell wall, chloroplasts and a large central vacuole. BOTH plant and animal cells have a membrane, a nucleus and mitochondria. Yes, plants have mitochondria too.",["cell"]);
Q("cells","Where does photosynthesis take place?","Chloroplasts",["Mitochondria","Nucleus","Vacuole"],
 "Chloroplasts contain green chlorophyll, which captures sunlight to make glucose.",["cell"]);
Q("cells","Which equation shows PHOTOSYNTHESIS?","Carbon dioxide + water + light → glucose + oxygen",
 ["Glucose + oxygen → carbon dioxide + water + energy","Oxygen + water + light → carbon dioxide + glucose","Nitrogen + water → protein + oxygen"],
 "Photosynthesis takes in CO₂ and water and uses light to make sugar, releasing oxygen. Cellular respiration (the 2nd answer) is the exact reverse.",["photo"]);
Q("cells","Which part of the cell is the control center and holds the DNA?","Nucleus",["Cell membrane","Cytoplasm","Vacuole"],
 "The nucleus stores DNA, the instructions for the cell.",["cell"]);
Q("cells","What is the main job of the cell MEMBRANE?","Controls what goes into and out of the cell",
 ["Gives the plant cell a stiff box shape","Makes food from sunlight","Stores the cell's DNA"],
 "The membrane is like a security gate, and it is 'selectively permeable'. The stiff box shape comes from the cell WALL in plants.",["cell"]);
Q("cells","Which order goes from SMALLEST to LARGEST?","Cell → tissue → organ → organ system → organism",
 ["Tissue → cell → organ → organism → organ system","Cell → organ → tissue → organ system → organism","Organism → organ system → organ → tissue → cell"],
 "Cells form tissues (like muscle tissue). Tissues form organs (the heart). Organs form systems (the circulatory system), and systems form an organism (you).",["levels"]);
Q("cells","Bacteria are PROKARYOTES. This means their cells…","Have no nucleus",["Have many nuclei","Are made of many cells joined together","Are always harmful to people"],
 "Prokaryote = no nucleus; the DNA floats in the cytoplasm. Eukaryotes (plants, animals, fungi) have a nucleus. Many bacteria are helpful, like the ones in your gut.");
Q("cells","Which is NOT true of ALL living things?","They can move from place to place",["They are made of cells","They use energy","They grow and develop"],
 "Trees are alive but can't walk around. All living things are made of cells, use energy, grow, respond to their environment and reproduce.");
Q("cells","The CELL THEORY says that…","All living things are made of cells, and new cells come from existing cells",
 ["Only animals are made of cells; plants are made of fibers","Cells can form on their own from nonliving things","Cells are the smallest things that exist, the same as atoms"],
 "Cell theory: (1) all living things are made of cells, (2) the cell is the basic unit of life, and (3) all cells come from other cells.");
Q("cells","A frog lives in water as a tadpole, then on land as an adult. A frog is a(n)…","Amphibian",["Reptile","Mammal","Fish"],
 "Amphibians have moist skin and live part of their life in water and part on land. Reptiles (snakes, lizards) have dry, scaly skin.");
Q("cells","Cells release energy from glucose using oxygen. This process is called…","Cellular respiration",["Photosynthesis","Digestion","Breathing"],
 "Breathing just moves air in and out of your lungs. Cellular respiration happens INSIDE cells, in the mitochondria, and that is where the energy is actually released.");
Q("cells","When a body cell divides by MITOSIS, it makes…","Two identical cells",["Four different sex cells","One bigger cell","Two cells with half the DNA"],
 "Mitosis = growth and repair, making 2 identical copies. MEIOSIS makes 4 sex cells (egg or sperm), each with half the DNA.");

// ---------- 9. Genetics ----------
Q("genetics","T (tall) is dominant over t (short). What does a plant with genes Tt look like?","Tall",["Short","Medium height","Half tall and half short"],
 "A dominant allele (capital letter) shows up whenever it is present. Tt has one T, so the plant is tall. You need tt to be short.",["punnett","Tt","tt"]);
Q("genetics","Two Tt plants are crossed (T = tall is dominant). What is the chance an offspring is SHORT (tt)?","25% (1 out of 4)",["50% (2 out of 4)","75% (3 out of 4)","0%"],
 "The Punnett square gives TT, Tt, Tt, tt. Only 1 of the 4 boxes is tt, so 25%. Three out of four (75%) will be tall.",["punnett","Tt","Tt"]);
Q("genetics","A Tt plant is crossed with a tt plant. What is the chance an offspring is SHORT?","50%",["25%","75%","100%"],
 "Punnett square: Tt, Tt, tt, tt. Two of the 4 boxes are tt, so 50%.",["punnett","Tt","tt"]);
Q("genetics","The molecule that carries genetic instructions and is shaped like a twisted ladder (double helix) is…","DNA",["A protein","Glucose","Chlorophyll"],
 "DNA (deoxyribonucleic acid) is a double helix. Its 'rungs' are base pairs: A pairs with T, and C pairs with G.");
Q("genetics","What is a PHENOTYPE?","The trait you can see or observe, like brown eyes",["The gene letters, like Bb","The shape of the DNA molecule","Only the hidden recessive traits"],
 "Genotype = the gene letters (Bb). Phenotype = how it shows up (brown eyes). Remember: PHenotype = PHysical.");
Q("genetics","An organism with two IDENTICAL alleles for a trait (TT or tt) is…","Homozygous",["Heterozygous","A hybrid","Always recessive"],
 "Homo = same (TT or tt). Hetero = different (Tt). A hybrid is heterozygous.");
Q("genetics","How many chromosomes are in most HUMAN body cells?","46 (23 pairs)",["23","48","92"],
 "Body cells have 46 chromosomes in 23 pairs: one set from Mom and one from Dad. Sex cells (egg and sperm) have only 23.");
Q("genetics","An inherited trait that helps an organism SURVIVE in its environment is called a(n)…","Adaptation",["Acquired trait","Extinction","Learned behavior"],
 "Adaptations, like a polar bear's thick fur, are passed down through genes. Acquired traits, like a scar or big muscles from lifting, are NOT passed to offspring.");
Q("genetics","Long ago, which giraffes were MOST likely to survive and have babies?","Giraffes born with longer necks that could reach more food",
 ["Giraffes that stretched their necks and passed the stretch to their babies","Giraffes that decided to grow longer necks","All giraffes had the same chance"],
 "Natural selection: individuals with helpful INHERITED traits survive and reproduce more, so those traits become more common. Stretching during your life does not change your genes.");
Q("genetics","Which trait is INHERITED (from genes), not learned or acquired?","Natural eye color",["Speaking English","Riding a bike","A scar from a fall"],
 "Eye color is coded in your DNA. Language and skills are learned. Scars are acquired during your life.");
Q("genetics","Offspring from sexual reproduction get…","Half of their genes from each parent",["All of their genes from the mother","All of their genes from the father","An exact copy of one parent's genes"],
 "Each parent gives one allele for each gene, so offspring are a MIX. That's why siblings look different. Asexual reproduction makes exact copies.");
Q("genetics","A change in the sequence of DNA is called a…","Mutation",["Adaptation","Allele","Phenotype"],
 "Mutations can be harmful, helpful or neutral. Helpful ones can become adaptations over many generations.");

// ---------- 10. Human Body ----------
Q("body","Which body system CARRIES oxygen and nutrients to every cell?","Circulatory system",["Respiratory system","Digestive system","Nervous system"],
 "The respiratory system brings oxygen INTO the lungs, but the circulatory system (heart, blood, vessels) DELIVERS it around the body.",["heart"]);
Q("body","Oxygen passes into the blood through tiny air sacs in the lungs called…","Alveoli",["Bronchi","Trachea","Villi"],
 "Alveoli are tiny balloon-like sacs surrounded by capillaries, where gases are swapped. Villi are in the small intestine and absorb food.");
Q("body","Where are MOST nutrients from food absorbed into the blood?","Small intestine",["Stomach","Large intestine","Esophagus"],
 "The small intestine is about 6 meters long and lined with villi that absorb nutrients. The stomach mostly breaks food down with acid.",["digest"]);
Q("body","Which blood cells fight infections and germs?","White blood cells",["Red blood cells","Platelets","Plasma"],
 "White cells = defense. Red cells = carry oxygen. Platelets = clot blood to stop bleeding. Plasma = the liquid part.");
Q("body","Blood vessels that carry blood AWAY from the heart are…","Arteries",["Veins","Capillaries","Alveoli"],
 "Arteries = Away from the heart. Veins bring blood back. Capillaries are the tiny vessels in between where exchange happens.",["heart"]);
Q("body","What is the main job of the LARGE intestine?","Absorb water and form solid waste",["Absorb most of the nutrients","Break down proteins with acid","Make bile"],
 "By the large intestine most nutrients are already absorbed, so it soaks up water. Bile is made by the liver.",["digest"]);
Q("body","The brain and spinal cord together make up the…","Central nervous system",["Peripheral nervous system","Endocrine system","Skeletal system"],
 "Central nervous system = brain + spinal cord. Peripheral nervous system = all the nerves that branch out to the body.");
Q("body","Hormones (chemical messengers like adrenaline) are made by the…","Endocrine system",["Nervous system","Digestive system","Muscular system"],
 "Glands such as the thyroid, the adrenal glands and the pancreas release hormones into the blood. The nervous system uses electrical signals instead.");
Q("body","TENDONS connect…","Muscle to bone",["Bone to bone","Muscle to muscle","Skin to bone"],
 "Tendons = muscle to bone. Ligaments = bone to bone.");
Q("body","Which organ filters waste out of the blood to make urine?","Kidneys",["Liver","Bladder","Lungs"],
 "The kidneys filter the blood. The bladder only STORES urine. The liver cleans chemicals and makes bile.");
Q("body","When you breathe IN, your diaphragm…","Contracts and moves down, pulling air into the lungs",["Relaxes and moves up, pulling air in","Squeezes the lungs to push air in","Stays still while the ribs do all the work"],
 "The diaphragm contracts and flattens downward, making more space in the chest, so air rushes in. When it relaxes and moves up, you breathe out.");
Q("body","What is the main job of RED blood cells?","Carry oxygen",["Fight germs","Clot blood","Digest food"],
 "Red cells contain hemoglobin, an iron-rich protein that grabs oxygen. That iron is part of why blood is red.");

// ---------- 11. Ecology ----------
Q("eco","In the food chain grass → grasshopper → frog → hawk, the FROG is a…","Secondary consumer",["Primary consumer","Producer","Decomposer"],
 "Producer (grass) → primary consumer (grasshopper eats the plant) → secondary consumer (frog eats the grasshopper) → tertiary consumer (hawk).",["food"]);
Q("eco","In a food chain, the ARROWS point…","From the food to the eater, the way energy flows",["From the eater to its food","From the biggest animal to the smallest","The way the animal walks"],
 "grass → rabbit means energy moves FROM the grass INTO the rabbit. Arrows show the direction energy flows.",["food"]);
Q("eco","About how much of the energy at one level of a food pyramid passes up to the next level?","About 10%",["About 50%","About 90%","100%"],
 "The 10% rule: about 90% is used for life processes or lost as heat. That is why there are far fewer hawks than grasshoppers.",["pyramid"]);
Q("eco","Organisms such as mushrooms and bacteria that break down dead things are…","Decomposers",["Producers","Herbivores","Carnivores"],
 "Decomposers recycle nutrients back into the soil so producers can use them again.");
Q("eco","A bee drinks nectar from a flower and carries its pollen to other flowers. This relationship is…","Mutualism (both benefit)",["Parasitism","Commensalism","Competition"],
 "Mutualism: +/+, both win. Commensalism: +/0, one wins and the other isn't affected. Parasitism: +/−, one is harmed.");
Q("eco","A tick living on a dog and drinking its blood is an example of…","Parasitism",["Mutualism","Commensalism","Competition"],
 "The tick benefits and the dog is harmed (+/−). A parasite usually doesn't kill its host right away, which is different from a predator.");
Q("eco","Sunlight, water, temperature and soil are the ___ parts of an ecosystem.","Abiotic (nonliving)",["Biotic (living)","Producer","Consumer"],
 "A = not, bio = life. Abiotic = nonliving. Biotic = living things such as plants, animals and fungi.");
Q("eco","A group of the SAME species living in one area is a…","Population",["Community","Ecosystem","Biome"],
 "Population = one species. Community = ALL the populations in an area. Ecosystem = the community plus nonliving things.",["levels2"]);
Q("eco","In grass → grasshopper → frog → hawk, all the frogs die from a disease. At first, the grasshoppers will most likely…","Increase, because fewer predators are eating them",
 ["Decrease, because frogs help grasshoppers","Stay exactly the same","All die out"],
 "Removing a predator lets its prey population grow, at least until the grasshoppers run low on grass. Every link affects the others.",["food"]);
Q("eco","Where do producers like plants get the energy to make their food?","Sunlight",["Nutrients in the soil","Eating other organisms","Water"],
 "Plants make food (glucose) using LIGHT energy. Soil gives water and minerals, but not the energy.");
Q("eco","Which biome has permanently frozen ground (permafrost) and almost no trees?","Tundra",["Taiga","Desert","Grassland"],
 "Tundra: frozen, treeless, very cold. Taiga: cold forests of evergreen trees just south of the tundra.");
Q("eco","In the carbon cycle, plants take carbon out of the air in the form of…","Carbon dioxide, during photosynthesis",["Oxygen, during respiration","Carbon monoxide","Nitrogen gas"],
 "Plants absorb CO₂ to build sugars. Animals and decomposers release CO₂ back through respiration, and burning fuels releases it too.",["photo"]);

// ---------- 12. Earth ----------
Q("earth","Earth's SOLID center, made mostly of iron and nickel, is the…","Inner core",["Outer core","Mantle","Crust"],
 "Crust (thin, rocky) → mantle (thick, hot, slowly flowing rock) → outer core (LIQUID iron and nickel) → inner core (SOLID, because the pressure is enormous).",["earthlayers"]);
Q("earth","Earth's OUTER core is…","Liquid metal",["Solid metal","A gas","Solid rock like the crust"],
 "The outer core is liquid iron and nickel. Its swirling motion creates Earth's magnetic field.",["earthlayers"]);
Q("earth","Rock that forms when melted rock (magma or lava) cools and hardens is…","Igneous",["Sedimentary","Metamorphic","Fossil rock"],
 "Igneous = 'from fire'. Examples are granite (cooled slowly underground) and basalt or obsidian (cooled quickly from lava).",["rockcycle"]);
Q("earth","Rock formed from layers of sand, mud and shells that get pressed and cemented together is…","Sedimentary",["Igneous","Metamorphic","Magma"],
 "Sedimentary rocks like sandstone and limestone form in layers. They are the rocks most likely to contain fossils.",["rockcycle"]);
Q("earth","Rock that is CHANGED by great heat and pressure (without melting) is…","Metamorphic",["Sedimentary","Igneous","Lava"],
 "Meta = change, morph = form. Limestone becomes marble, and shale becomes slate.",["rockcycle"]);
Q("earth","Breaking rock into smaller pieces is ___. Carrying those pieces away is ___.","Weathering; erosion",["Erosion; weathering","Deposition; erosion","Weathering; deposition"],
 "Weathering BREAKS rock down. Erosion MOVES the pieces (by water, wind or ice). Deposition DROPS them in a new place.");
Q("earth","At which type of plate boundary do two plates PULL APART?","Divergent",["Convergent","Transform","Subduction"],
 "Divergent = diverge (separate), as at the Mid-Atlantic Ridge. Convergent = plates collide. Transform = plates slide past each other.",["plates"]);
Q("earth","California's San Andreas Fault, where two plates SLIDE PAST each other, is a…","Transform boundary",["Divergent boundary","Convergent boundary","Hot spot"],
 "At transform boundaries plates grind sideways past each other, and that causes many earthquakes.",["plates"]);
Q("earth","Which instrument records the shaking of an earthquake?","Seismograph",["Barometer","Anemometer","Thermometer"],
 "Seismo = earthquake. A barometer measures air pressure. An anemometer measures wind speed.");
Q("earth","On the Mohs hardness scale, the HARDEST mineral is…","Diamond (10)",["Quartz (7)","Topaz (8)","Talc (1)"],
 "Mohs scale goes from 1 to 10: talc is 1 (softest) and diamond is 10 (hardest). A harder mineral scratches a softer one.");
Q("earth","In undisturbed layers of sedimentary rock, the BOTTOM layers are usually…","Older than the layers above them",["Younger than the layers above","The same age as all the layers","Impossible to compare"],
 "Law of Superposition: newer layers settle on top of older ones. Fossils in deeper layers are usually older.",["layers"]);
Q("earth","What moves Earth's tectonic plates?","Convection currents in the hot mantle",["Wind blowing on the continents","Ocean tides","The Moon's gravity"],
 "Hot mantle rock rises, cools and sinks in slow loops, and those loops drag the plates along a few centimeters each year.",["earthlayers"]);
Q("earth","The Himalaya mountains formed when…","Two continental plates collided (convergent boundary)",["Two plates pulled apart (divergent boundary)","Two plates slid past each other (transform)","Rivers piled up layers of sediment over time"],
 "India's plate crashed into Asia's plate, crumpling the crust upward. The mountains are still rising a few millimeters every year.",["plates"]);

// ---------- 13. Weather ----------
Q("weather","In the water cycle, water vapor cools and turns into tiny droplets that form clouds. This is…","Condensation",["Evaporation","Precipitation","Transpiration"],
 "Evaporation: liquid → gas. Condensation: gas → liquid (clouds, and drops on a cold glass). Precipitation: water falls as rain, snow, sleet or hail.",["watercycle"]);
Q("weather","Plants releasing water vapor out through their leaves is called…","Transpiration",["Evaporation","Condensation","Precipitation"],
 "Transpiration is like plants 'sweating'. It adds a lot of water vapor to the air.",["watercycle"]);
Q("weather","The lowest layer of the atmosphere, where almost all weather happens, is the…","Troposphere",["Stratosphere","Mesosphere","Thermosphere"],
 "Going up: troposphere (weather), stratosphere (ozone layer), mesosphere (meteors burn up), thermosphere (auroras). 'Tropo' means turning or changing.",["atmos"]);
Q("weather","The ozone layer, which blocks harmful ultraviolet (UV) rays, is in the…","Stratosphere",["Troposphere","Mesosphere","Exosphere"],
 "Ozone (O₃) in the stratosphere absorbs most of the Sun's UV radiation.",["atmos"]);
Q("weather","CLIMATE is…","The average weather of a place over many years",["The weather conditions today","One big storm","The temperature this afternoon"],
 "Weather = short term (today). Climate = the long-term pattern, about 30+ years. 'Climate is what you expect, weather is what you get.'");
Q("weather","Which instrument measures AIR PRESSURE?","Barometer",["Thermometer","Anemometer","Rain gauge"],
 "Barometer = pressure. Thermometer = temperature. Anemometer = wind speed. Rain gauge = rainfall.");
Q("weather","The barometer reading is FALLING quickly. This usually means…","Cloudy, stormy weather is likely coming",["Clear, sunny weather is coming","Snow is guaranteed tomorrow","Nothing; pressure doesn't affect weather"],
 "Low pressure means rising air, which cools and forms clouds and storms. High pressure usually brings clear, calm skies.");
Q("weather","A cold air mass pushes under a warm air mass, forcing the warm air up quickly. This forms a…","Cold front, often with thunderstorms",["Warm front, with light steady rain","Stationary front, with no weather","High-pressure zone with clear skies"],
 "Cold air is denser, so it wedges under warm air and shoves it up fast, which builds tall storm clouds. On weather maps a cold front is a blue line with triangles.",["front"]);
Q("weather","Wind blows from areas of ___ pressure to areas of ___ pressure.","High; low",["Low; high","Cold; cold","It blows randomly"],
 "Air moves from high pressure to low pressure, like air rushing out of a popped balloon. The bigger the pressure difference, the stronger the wind.");
Q("weather","On a sunny day at the beach, a cool breeze blows from the sea onto the land because…","Land heats up faster than water, so warm air over land rises and cooler sea air moves in",
 ["Water heats up faster than land, so warm air over the sea pushes onto the beach","Waves crashing on the shore push the air onto the land","The Moon's gravity pulls the air from the sea toward the land"],
 "Land warms faster in the daytime. Warm air over the land rises, which lowers the pressure there, and cooler air from over the sea flows in. That is a sea breeze, a convection current.",["seabreeze"]);
Q("weather","Most of Earth's FRESH water is stored in…","Glaciers and ice caps",["Rivers and lakes","Clouds","The oceans"],
 "About 97% of all water is salty ocean water. Of the fresh water, roughly 2/3 is frozen in glaciers and ice caps. Rivers and lakes hold only a tiny part.");
Q("weather","What provides the energy that drives the water cycle?","The Sun",["Earth's core","The wind","The Moon"],
 "Sunlight heats water so it evaporates. Gravity then pulls precipitation back down.",["watercycle"]);

// ---------- 14. Space ----------
Q("space","What causes Earth's SEASONS?","The tilt of Earth's axis (about 23.5°)",["Earth being closer to the Sun in summer","The Sun burning hotter and cooler","The Moon blocking sunlight"],
 "When your half of Earth tilts TOWARD the Sun, sunlight hits more directly and days are longer, so it's summer. Fun fact: Earth is actually CLOSEST to the Sun in early January, which is winter in the north.",["seasons"]);
Q("space","One full ROTATION of Earth on its axis takes about…","24 hours (1 day)",["365 days","29.5 days","7 days"],
 "Rotation = spinning on the axis, which gives us day and night. Revolution = traveling around the Sun, which takes 1 year.");
Q("space","One full REVOLUTION of Earth around the Sun takes about…","365¼ days (1 year)",["24 hours","29.5 days","12 days"],
 "The extra ¼ day adds up, so we get a leap day every 4 years.");
Q("space","What causes the PHASES of the Moon?","How much of the Moon's sunlit half we can see as it orbits Earth",
 ["Earth's shadow covering part of the Moon","Clouds blocking part of the Moon","The Moon changing its shape"],
 "The Sun always lights half of the Moon. As the Moon orbits, we see different amounts of that lit half. Earth's shadow on the Moon is a lunar ECLIPSE, which is something different.",["moon"]);
Q("space","A SOLAR eclipse happens when…","The Moon passes between the Sun and Earth",["Earth passes between the Sun and the Moon","The Sun passes between Earth and the Moon","The Moon goes behind Earth's shadow"],
 "Solar eclipse: Sun – Moon – Earth, and the Moon blocks the Sun. Lunar eclipse: Sun – Earth – Moon, and Earth's shadow falls on the Moon.",["eclipse"]);
Q("space","Which is the LARGEST planet in our solar system?","Jupiter",["Saturn","Neptune","Uranus"],
 "Jupiter is so big that more than 1,000 Earths could fit inside it. Saturn is second biggest.",["planets"]);
Q("space","Which planet is the HOTTEST?","Venus",["Mercury","Mars","Jupiter"],
 "Mercury is closest to the Sun, but Venus is hotter (about 465 °C) because its thick carbon-dioxide atmosphere traps heat, a runaway greenhouse effect.",["planets"]);
Q("space","Our Sun is…","A medium-sized star",["A planet","The biggest star in the universe","A giant comet"],
 "The Sun is an average yellow star. It only looks huge because it is the closest star to us. Many stars are far bigger.");
Q("space","Ocean TIDES are mainly caused by…","The Moon's gravity",["Wind","Earth's magnetic field","Ocean currents"],
 "The Moon's gravity pulls on Earth's oceans, making bulges of water. Most coasts get 2 high tides and 2 low tides a day. The Sun adds a smaller pull.");
Q("space","A LIGHT-YEAR is a unit of…","Distance (how far light travels in one year)",["Time (how long light takes to reach us)","Speed (how fast light travels)","Brightness (how much light a star gives off)"],
 "It sounds like time, but it is a DISTANCE: about 9.5 trillion km. It is used for huge space distances.");
Q("space","Which are the four ROCKY inner planets?","Mercury, Venus, Earth, Mars",["Jupiter, Saturn, Uranus, Neptune","Earth, Mars, Jupiter, Saturn","Mercury, Venus, Mars, Pluto"],
 "Inner planets are rocky. Outer planets (Jupiter, Saturn, Uranus, Neptune) are giants of gas and ice. Pluto is now called a dwarf planet. Order: My Very Educated Mother Just Served Us Nachos.",["planets"]);
Q("space","Why does the Moon stay in orbit around Earth?","Earth's gravity pulls on it while its sideways motion keeps it from falling straight in",
 ["There is no gravity in space, so nothing pulls it away","Magnets in the Moon's core lock it to Earth's magnetic field","The Sun's light pushes it around and around Earth"],
 "There IS gravity in space. The Moon is always 'falling' toward Earth but moving sideways fast enough to keep missing it. That is what an orbit is.");
Q("space","The asteroid belt is located between…","Mars and Jupiter",["Earth and Mars","Jupiter and Saturn","Venus and Earth"],
 "The asteroid belt separates the rocky inner planets from the gas giants.",["planets"]);

// ---------- 15. Math formulas (concepts) ----------
Q("mathf","The Pythagorean theorem a² + b² = c² works for which triangles?","Right triangles only",["All triangles","Equilateral triangles only","Obtuse triangles only"],
 "It only works when one angle is exactly 90°. Then c is the hypotenuse, the longest side, opposite the right angle.",["tri",3,4,"c"]);
Q("mathf","In a² + b² = c², what is c?","The hypotenuse, the longest side, opposite the right angle",["A leg, one of the two sides that form the right angle","The shortest side, opposite the smallest angle","The height, measured straight up from the base"],
 "a and b are the legs, which make the right angle. c is always the side across from the 90° corner.",["tri",3,4,"c"]);
Q("mathf","What is the formula for the AREA of a triangle?","A = ½ × b × h",["A = b × h","A = a + b + c","A = ½ × (b + h)"],
 "A triangle is half of a rectangle with the same base and height, so you take half of b × h. a + b + c is the PERIMETER.",["tarea",8,5]);
Q("mathf","What is the formula for the CIRCUMFERENCE of a circle?","C = 2πr (or C = πd)",["C = πr²","C = 2r","C = ½πr"],
 "Circumference = the distance around. πr² is the AREA, a very common mix-up. 2r is just the diameter.",["circle",5]);
Q("mathf","What is the formula for the AREA of a circle?","A = πr²",["A = 2πr","A = πd","A = 2πr²"],
 "Area = π × radius × radius. 2πr and πd are both the CIRCUMFERENCE.",["circle",5]);
Q("mathf","What is the VOLUME formula for a rectangular prism (box)?","V = l × w × h",["V = 2(lw + lh + wh)","V = l + w + h","V = l × w"],
 "Volume = length × width × height, in cubic units (cm³). 2(lw + lh + wh) is the SURFACE AREA. l × w alone is the area of the base.",["prism",4,3,2]);
Q("mathf","The three angles inside ANY triangle always add up to…","180°",["360°","90°","270°"],
 "Triangle = 180°. Quadrilateral (4 sides) = 360°. Formula for any polygon: (n − 2) × 180°.",["angles",60,70]);
Q("mathf","What is the formula for the SLOPE of a line through (x₁, y₁) and (x₂, y₂)?","m = (y₂ − y₁) ÷ (x₂ − x₁)",["m = (x₂ − x₁) ÷ (y₂ − y₁)","m = (y₂ + y₁) ÷ (x₂ + x₁)","m = (y₂ − y₁) × (x₂ − x₁)"],
 "Slope = rise over run = change in y ÷ change in x. Put the y's on TOP, like climbing UP stairs.",["slope",1,1,4,7]);
Q("mathf","What is the VOLUME formula for a cylinder?","V = πr²h",["V = 2πrh","V = ⅓πr²h","V = πrh"],
 "A cylinder is a stack of circles: circle area (πr²) × height. ⅓πr²h is the volume of a CONE. 2πrh is the area of the curved side.",["cyl",3,5]);
Q("mathf","What is the AREA formula for a trapezoid?","A = ½(b₁ + b₂) × h",["A = b₁ × b₂ × h","A = (b₁ + b₂) × h","A = ½ × b₁ × b₂"],
 "Average the two parallel bases, then multiply by the height. Forgetting the ½ doubles the answer.",["trap",6,10,4]);
Q("mathf","The four angles inside any quadrilateral add up to…","360°",["180°","540°","400°"],
 "A quadrilateral splits into 2 triangles: 2 × 180° = 360°. 540° is a pentagon (3 triangles).");
Q("mathf","How do you find the MEAN (average) of a data set?","Add all the values, then divide by how many values there are",["Find the middle value when the values are in order","Find the value that appears most often","Subtract the smallest value from the largest"],
 "Mean = sum ÷ count. The middle value = MEDIAN. The most frequent = MODE. Largest − smallest = RANGE.");
Q("mathf","What is the formula for the PERIMETER of a rectangle?","P = 2l + 2w",["P = l × w","P = l + w","P = 2(l × w)"],
 "Perimeter = all the way around: length + width + length + width. l × w is the AREA.",["rect",7,3]);
Q("mathf","What is the area formula for a PARALLELOGRAM?","A = b × h, using the straight-up height",["A = ½ × b × h, using the straight-up height","A = b × the slanted side length","A = 2b + 2h, adding all the sides"],
 "Slice a triangle off one end and slide it to the other end and you get a rectangle, so A = b × h. Use the perpendicular height, not the slanted side.",["para",8,4]);

// ---------- 16. Science formulas (concepts) ----------
Q("sciform","Which is the formula for DENSITY?","D = m ÷ V",["D = m × V","D = V ÷ m","D = m + V"],
 "Density = mass divided by volume, in g/cm³ or g/mL. Cover D in the formula triangle and you see m over V.",["ftri","m","D","V"]);
Q("sciform","Which is the formula for SPEED?","speed = distance ÷ time",["speed = distance × time","speed = time ÷ distance","speed = distance − time"],
 "s = d ÷ t. For example, 100 m in 20 s is 5 m/s. Units tell you the formula: meters PER second means divide.",["ftri","d","s","t"]);
Q("sciform","What is Newton's 2nd law written as a formula?","F = m × a",["F = m ÷ a","F = a ÷ m","F = m + a"],
 "Force (N) = mass (kg) × acceleration (m/s²). 1 newton = the force to speed up 1 kg by 1 m/s every second.",["ftri","F","m","a"]);
Q("sciform","Which shows WORK and its unit correctly?","W = F × d, measured in joules (J)",["W = F ÷ d, measured in newtons","W = F × d, measured in watts","W = m × a, measured in joules"],
 "Work = force × distance, in joules (1 J = 1 N·m). Watts are for POWER. m × a is FORCE.",["ftri","W","F","d"]);
Q("sciform","Which shows POWER and its unit correctly?","P = W ÷ t, measured in watts (W)",["P = W × t, measured in watts","P = F × d, measured in joules","P = t ÷ W, measured in newtons"],
 "Power = how FAST work is done = work ÷ time. 1 watt = 1 joule per second.",["ftri","W","P","t"]);
Q("sciform","Which is OHM'S LAW?","V = I × R",["V = I ÷ R","I = V × R","R = V × I"],
 "Voltage = current × resistance. Rearranged: I = V ÷ R and R = V ÷ I.",["ftri","V","I","R"]);
Q("sciform","How do you find an object's WEIGHT on Earth?","Weight = mass × g (g ≈ 9.8 m/s²)",["Weight = mass ÷ g","Weight = mass + g","Weight = mass (they're the same)"],
 "Weight is a force: W = m × g, in newtons. A 10 kg dog weighs about 98 N on Earth.");
Q("sciform","Which is the WAVE SPEED formula?","v = f × λ (frequency × wavelength)",["v = f ÷ λ (frequency ÷ wavelength)","v = λ ÷ f (wavelength ÷ frequency)","v = f + λ (frequency + wavelength)"],
 "Wave speed (m/s) = frequency (Hz) × wavelength (m).",["ftri","v","f","λ"]);
Q("sciform","Which is the formula for KINETIC energy?","KE = ½ × m × v²",["KE = m × v","KE = m × g × h","KE = ½ × m × v"],
 "Kinetic energy is energy of MOTION, and speed is SQUARED, so going twice as fast gives 4× the energy. m × g × h is POTENTIAL energy. m × v is momentum.");
