Q("sciform","Which is the formula for gravitational POTENTIAL energy?","PE = m × g × h",["PE = ½ × m × v²","PE = m × h","PE = m × v"],
 "PE = mass × gravity (9.8 m/s²) × height. Higher up or heavier = more stored energy.",["coaster"]);
Q("sciform","Which is the formula for MOMENTUM?","p = m × v",["p = m × a","p = m ÷ v","p = ½ × m × v²"],
 "Momentum = mass × velocity (kg·m/s). A slow truck can have more momentum than a fast baseball.");
Q("sciform","Which is the formula for PRESSURE?","P = F ÷ A (force ÷ area)",["P = F × A","P = A ÷ F","P = m ÷ V"],
 "The same force on a SMALLER area gives MORE pressure. That's why a needle pokes easily and snowshoes keep you on top of the snow. m ÷ V is density.",["ftri","F","P","A"]);
Q("sciform","How do you convert Celsius to Fahrenheit?","°F = (9/5 × °C) + 32",["°F = (°C − 32) × 5/9","°F = °C + 273","°F = °C × 2"],
 "Multiply by 9/5 (that is 1.8) and then add 32. (°F − 32) × 5/9 goes the OTHER way, °F → °C. Adding 273 gives kelvin.",["thermo",100]);
Q("sciform","Which is the formula for ACCELERATION?","a = (final velocity − starting velocity) ÷ time",["a = total distance ÷ total time","a = final velocity × time taken","a = force × mass of the object"],
 "Acceleration = change in velocity ÷ time, in m/s². distance ÷ time is SPEED.");
// ================= FIGURES (inline SVG diagrams for explanations) =================
const S=(w,h,inner,label)=>`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${label||"diagram"}">${ARW}${inner}</svg>`;
const T=(x,y,s,c="fg-t",a="middle")=>`<text x="${x}" y="${y}" class="${c}" text-anchor="${a}">${s}</text>`;
const L=(x1,y1,x2,y2,c="fg-l")=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${c}"/>`;
const ARW=`<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffc23d"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fd8ff"/></marker></defs>`;
const A=(x1,y1,x2,y2,col="#ffc23d",w=3)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${w}" marker-end="url(#${col==="#4fd8ff"?"ahc":"ah"})"/>`;
const C=(x,y,r,fill,stroke="none")=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`;
const R=(x,y,w,h,fill,stroke="none",rx=6)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`;
const AMB="#ffc23d",CY="#4fd8ff",GD="#5be49b",BD="#ff6b6b",PNL="#193049",LN="#2a4a69",TX="#eaf4ff",MU="#9db4cc";

const FIG = {
  // ---- math geometry ----
  tri(a,b,c){ // right triangle; a vertical leg, b horizontal leg
    const k=Math.min(130/(+a||3),220/(+b||4),40); const H=Math.max(40,(+a||3)*k), W=Math.max(60,(+b||4)*k);
    const x0=60,y0=170;
    return S(340,200,`<polygon points="${x0},${y0} ${x0+W},${y0} ${x0},${y0-H}" fill="rgba(79,216,255,.12)" class="fg-l"/>
      ${R(x0,y0-16,16,16,"none",TX,0)}
      ${T(x0-14,y0-H/2+5,"a = "+a,"fg-a","end")}${T(x0+W/2,y0+22,"b = "+b,"fg-a")}
      ${T(x0+W/2+14,y0-H/2-8,"c = "+c,"fg-c","start")}${T(x0+24,y0-22,"90°","fg-s","start")}`,"right triangle");
  },
  rect(l,w){ return S(340,180,`${R(70,40,200,100,"rgba(79,216,255,.12)",TX,2)}${T(170,32,"length l = "+l,"fg-a")}${T(285,95,"w = "+w,"fg-a","start")}
      ${T(170,165,"Perimeter = l + w + l + w   ·   Area = l × w","fg-s")}`,"rectangle"); },
  para(b,h){ return S(340,180,`<polygon points="80,140 240,140 280,50 120,50" fill="rgba(79,216,255,.12)" class="fg-l"/>${L(120,50,120,140,"fg-d")}
      ${T(160,165,"base b = "+b,"fg-a")}${T(112,100,"h = "+h,"fg-a","end")}${R(120,126,14,14,"none",MU,0)}`,"parallelogram"); },
  trap(b1,b2,h){ return S(340,190,`<polygon points="60,150 280,150 220,60 120,60" fill="rgba(79,216,255,.12)" class="fg-l"/>${L(150,60,150,150,"fg-d")}
      ${T(170,50,"b₁ = "+b1,"fg-a")}${T(170,175,"b₂ = "+b2,"fg-a")}${T(158,110,"h = "+h,"fg-a","start")}`,"trapezoid"); },
  tarea(b,h){ return S(340,190,`<polygon points="60,150 280,150 200,40" fill="rgba(79,216,255,.12)" class="fg-l"/>${L(200,40,200,150,"fg-d")}${R(200,136,14,14,"none",MU,0)}
      ${T(170,175,"base b = "+b,"fg-a")}${T(208,100,"height h = "+h,"fg-a","start")}
      <polygon points="60,150 280,150 280,40 60,40" fill="none" stroke="${LN}" stroke-dasharray="4 4"/>${T(70,32,"the triangle is ½ of this rectangle","fg-s","start")}`,"triangle area"); },
  circle(r){ return S(340,200,`${C(150,100,75,"rgba(79,216,255,.12)",TX)}${C(150,100,3,AMB)}${L(150,100,225,100,"fg-l")}${L(75,100,150,100,"fg-d")}
      ${T(188,92,"r = "+r,"fg-a")}${T(112,122,"d = 2r","fg-s")}
      ${T(240,40,"Circumference","fg-c","start")}${T(240,58,"C = 2πr","fg-s","start")}${T(240,150,"Area","fg-c","start")}${T(240,168,"A = πr²","fg-s","start")}`,"circle radius"); },
  prism(l,w,h){ return S(340,200,`<polygon points="70,80 220,80 220,170 70,170" fill="rgba(79,216,255,.12)" class="fg-l"/>
      <polygon points="70,80 120,40 270,40 220,80" fill="rgba(79,216,255,.2)" class="fg-l"/><polygon points="220,80 270,40 270,130 220,170" fill="rgba(79,216,255,.06)" class="fg-l"/>
      ${T(145,190,"l = "+l,"fg-a")}${T(258,165,"w = "+w,"fg-a","start")}${T(62,128,"h = "+h,"fg-a","end")}`,"rectangular prism"); },
  cyl(r,h){ return S(340,200,`<ellipse cx="160" cy="45" rx="70" ry="18" fill="rgba(79,216,255,.2)" class="fg-l"/>${L(90,45,90,160)}${L(230,45,230,160)}
      <path d="M90,160 A70,18 0 0 0 230,160" class="fg-l"/><path d="M90,160 A70,18 0 0 1 230,160" class="fg-d"/>${L(160,45,230,45,"fg-l")}
      ${T(195,38,"r = "+r,"fg-a")}${T(240,108,"h = "+h,"fg-a","start")}${T(160,192,"V = (area of circle) × height = πr²h","fg-s")}`,"cylinder"); },
  angles(a,b){ return S(340,190,`<polygon points="50,160 290,160 140,40" fill="rgba(79,216,255,.12)" class="fg-l"/>
      ${T(78,152,a+"°","fg-a")}${T(255,152,b+"°","fg-a")}${T(142,74,"?","fg-c")}${T(170,182,"all three add up to 180°","fg-s")}`,"triangle angles"); },
  slope(x1,y1,x2,y2){ const g=22,ox=40,oy=170, P=(x,y)=>[ox+x*g,oy-y*g]; let grid="";
      for(let i=0;i<=12;i++) grid+=L(ox+i*g,oy-7*g,ox+i*g,oy,"fg-d").replace('class="fg-d"','stroke="#1d3550" stroke-width="1"');
      for(let j=0;j<=7;j++) grid+=L(ox,oy-j*g,ox+12*g,oy-j*g).replace('class="fg-l"','stroke="#1d3550" stroke-width="1"');
      const [ax,ay]=P(x1,y1),[bx,by]=P(x2,y2);
      return S(340,200,`${grid}${L(ox,oy,ox+12*g,oy)}${L(ox,oy,ox,oy-7*g)}${L(ax,ay,bx,by,"fg-l")}
      ${L(ax,ay,bx,ay,"fg-d")}${L(bx,ay,bx,by,"fg-d")}${C(ax,ay,5,AMB)}${C(bx,by,5,AMB)}
      ${T((ax+bx)/2,ay+(by<ay?16:-6),"run = "+(x2-x1),"fg-c")}${T(bx+6,(ay+by)/2+5,"rise = "+(y2-y1),"fg-c","start")}
      ${T(ax-4,ay+(by<ay?18:-8),"("+x1+", "+y1+")","fg-s","end")}${T(bx,by+(by<ay?-10:18),"("+x2+", "+y2+")","fg-s")}`,"slope on a grid"); },
  // ---- formula triangle ----
  ftri(top,l,r){ return S(340,190,`<polygon points="170,20 300,170 40,170" fill="rgba(255,194,61,.1)" stroke="${AMB}" stroke-width="3"/>${L(85,115,255,115)}${L(170,115,170,170)}
      ${T(170,95,top,"fg-a").replace('class="fg-a"','class="fg-a" style="font-size:30px"')}${T(115,155,l,"fg-c").replace('class="fg-c"','class="fg-c" style="font-size:26px"')}${T(225,155,r,"fg-c").replace('class="fg-c"','class="fg-c" style="font-size:26px"')}
      ${T(170,188,"cover what you want: top = side × side · side = top ÷ other side","fg-s")}`,"formula triangle"); },
  thermo(c){ const f=c*9/5+32; return S(340,190,`${R(150,20,40,140,PNL,TX,20)}${C(170,165,22,BD)}${R(162,60,16,105,BD,"none",8)}
      ${T(120,70,c+" °C","fg-c","end")}${T(220,70,f+" °F","fg-a","start")}${T(170,188,"°F = 9/5 × °C + 32","fg-s")}`,"thermometer"); },
  // ---- science method ----
  vars(){ return S(340,170,`${R(10,30,100,60,PNL,CY)}${T(60,55,"I CHANGE","fg-s")}${T(60,75,"Independent","fg-c")}
      ${A(112,60,124,60)}${R(126,30,100,60,PNL,AMB)}${T(176,55,"I MEASURE","fg-s")}${T(176,75,"Dependent","fg-a")}
      ${R(232,30,100,60,PNL,LN)}${T(282,55,"SAME FOR ALL","fg-s")}${T(282,75,"Controlled","fg-t")}
      ${T(170,125,"Control group = gets NO treatment (baseline to compare)","fg-s")}${T(170,150,"Example: fertilizer amount → plant height","fg-t")}`,"variables"); },
  ladder(){ const u=["kilo","hecto","deka","BASE","deci","centi","milli"],s=["×1000","×100","×10","m, L, g","÷10","÷100","÷1000"];
      return S(340,200,u.map((n,i)=>`${R(8+i*46,150-i*18,44,30,i===3?"rgba(255,194,61,.25)":PNL,i===3?AMB:LN,4)}${T(30+i*46,168-i*18,n,"fg-s")}${T(30+i*46,140-i*18,s[i],"fg-s")}`).join("")+
      T(170,22,"Step DOWN the stairs (to smaller units) → multiply by 10 each step","fg-s"),"metric stairs"); },
  meniscus(){ return S(340,190,`${L(120,20,120,170)}${L(220,20,220,170)}${L(120,170,220,170)}
      <path d="M121,80 Q170,110 219,80 L219,169 L121,169 z" fill="rgba(79,216,255,.3)"/>${L(100,96,240,96,"fg-d")}
      ${T(250,100,"read HERE","fg-a","start")}${T(250,118,"(bottom of curve)","fg-s","start")}${T(60,100,"👁","fg-t")}`,"meniscus"); },
  // ---- matter ----
  states(){ const dots=(ox,arr)=>arr.map(([x,y])=>C(ox+x,y,7,CY)).join("");
      const solid=[];for(let i=0;i<4;i++)for(let j=0;j<4;j++)solid.push([18+i*17,60+j*17]);
      const liq=[[15,100],[31,104],[47,99],[63,103],[20,116],[38,119],[56,117],[72,120],[28,85],[50,86],[66,87],[12,132]];
      const gas=[[15,55],[60,70],[35,110],[75,125],[20,140],[55,100]];
      return S(340,190,`${R(10,40,100,110,"none",LN)}${dots(10,solid)}${R(120,40,100,110,"none",LN)}${dots(120,liq)}${R(230,40,100,110,"none",LN)}${dots(230,gas)}
      ${T(60,30,"SOLID","fg-c")}${T(170,30,"LIQUID","fg-c")}${T(280,30,"GAS","fg-c")}
      ${T(60,170,"packed, vibrate","fg-s")}${T(170,170,"close, slide past","fg-s")}${T(280,170,"far apart, fast","fg-s")}`,"particles in states of matter"); },
  float(){ return S(340,180,`${R(40,70,260,100,"rgba(79,216,255,.25)","none",0)}${L(40,70,300,70,"fg-l")}${R(80,52,60,40,AMB,"none",4)}${R(210,128,50,40,BD,"none",4)}
      ${T(110,40,"0.8 g/cm³ floats","fg-a")}${T(235,120,"2.7 g/cm³ sinks","fg-t")}${T(170,195,"water = 1.0 g/cm³","fg-s")}`,"floating and sinking"); },
  phase(){ return S(340,200,`${R(10,120,90,40,PNL,CY)}${T(55,145,"SOLID","fg-c")}${R(125,20,90,40,PNL,CY)}${T(170,45,"GAS","fg-c")}${R(240,120,90,40,PNL,CY)}${T(285,145,"LIQUID","fg-c")}
      ${A(60,116,130,64)}${T(70,85,"sublimation","fg-s","end")}${A(150,64,80,116,"#4fd8ff")}${T(124,105,"deposition","fg-a","end")}
      ${A(104,132,236,132)}${T(170,126,"melting","fg-s")}${A(236,152,104,152,"#4fd8ff")}${T(170,172,"freezing","fg-s")}
      ${A(270,116,205,64)}${T(268,80,"evaporation","fg-s","start")}${A(220,48,290,116,"#4fd8ff")}${T(300,100,"condensation","fg-s","start")}`,"phase changes"); },
  heatcurve(){ return S(340,190,`${L(40,160,320,160)}${L(40,160,40,20)}<polyline points="40,150 90,110 170,110 200,70 280,70 320,30" class="fg-l" stroke="${AMB}"/>
      ${T(130,102,"melting: flat!","fg-a")}${T(240,62,"boiling: flat!","fg-a")}${T(180,182,"heat added →","fg-s")}${T(30,90,"temp","fg-s","end")}`,"heating curve"); },
  // ---- chemistry ----
  atom(p,n,e){ let s=C(170,100,26,"rgba(255,107,107,.25)",BD)+T(170,96,p+"p⁺","fg-t")+T(170,112,n+"n⁰","fg-s");
      const sh=[2,8,18]; let left=e, rr=48;
      for(let k=0;k<3&&left>0;k++){ const cnt=Math.min(sh[k],left); left-=cnt; s+=`<circle cx="170" cy="100" r="${rr}" fill="none" stroke="${LN}" stroke-width="2"/>`;
        for(let i=0;i<cnt;i++){const a=i/cnt*6.283; s+=C(170+rr*Math.cos(a),100+rr*Math.sin(a),5,CY);} rr+=24; }
      return S(340,200,s+T(20,30,"protons (+) and neutrons in the nucleus","fg-s","start")+T(20,190,"electrons (−) orbit in shells","fg-c","start"),"atom model"); },
  pgrid(){ let s=""; const cols=18; for(let g=0;g<cols;g++){ const rows=g===0?7:(g===1||g>=12)?6:(g>=2&&g<=11)?4:0; const start=g===0?0:(g===1||g>=12)?1:3;
        for(let r=0;r<rows;r++){ const row=start+r; const metal=!(g>=12&&(row<=g-11))&&!(g===0&&row===0); s+=R(10+g*18,30+row*20,16,18,metal?"rgba(79,216,255,.3)":"rgba(255,194,61,.45)","none",2);} }
      s+=R(10+17*18,30,16,18,"rgba(255,194,61,.45)","none",2);
      return S(340,200,s+T(20,20,"↓ GROUP (column) = same outer electrons","fg-s","start")+T(20,188,"blue = metals (most!) · amber = nonmetals + metalloids","fg-s","start"),"periodic table outline"); },
  rxn(){ return S(340,140,`${T(70,60,"2H₂ + O₂","fg-c")}${A(130,55,200,55)}${T(260,60,"2H₂O","fg-a")}${T(70,95,"REACTANTS","fg-s")}${T(70,112,"(what you start with)","fg-s")}${T(260,95,"PRODUCTS","fg-s")}${T(260,112,"(what is made)","fg-s")}`,"chemical equation"); },
  ph(mark){ let s=""; const cols=["#ff4d4d","#ff6a3d","#ff8c33","#ffad2e","#ffd02b","#e8e33a","#9be15d","#4fd38a","#3fc7b8","#3fa7e0","#4f86f0","#6a6af0","#8a5ae8","#a24ad8","#b03fc8"];
      for(let i=0;i<15;i++) s+=R(15+i*21,70,20,40,cols[i],"none",2)+T(25+i*21,128,i,"fg-s");
      if(mark!=null) s+=`<polygon points="${25+mark*21},64 ${19+mark*21},50 ${31+mark*21},50" fill="${TX}"/>`;
      return S(340,170,s+T(60,40,"ACID","fg-t")+T(172,40,"neutral 7","fg-t")+T(290,40,"BASE","fg-t")+T(170,155,"lemon ≈ 2 · water = 7 · soap ≈ 10","fg-s"),"pH scale"); },
  // ---- forces ----
  forces(r,l){ return S(340,160,`${R(130,60,80,60,PNL,TX)}${A(210,90,210+r*10,90)}${A(130,90,130-l*10,90,"#4fd8ff")}
      ${T(215+r*5,80,r+" N","fg-a")}${T(130-l*5,80,l+" N","fg-c")}${L(20,120,320,120,"fg-d")}${T(170,150,"net force = "+r+" − "+l+" = "+(r-l)+" N → right","fg-t")}`,"forces on a box"); },
  dtgraph(){ return S(340,190,`${L(40,160,320,160)}${L(40,160,40,20)}<polyline points="40,160 120,90 200,90 300,30" class="fg-l" stroke="${CY}"/>
      ${T(80,115,"moving","fg-s","end")}${T(160,82,"flat = STOPPED","fg-a")}${T(268,72,"steeper = faster","fg-s")}${T(180,182,"time →","fg-s")}${T(34,90,"distance","fg-s","end")}`,"distance time graph"); },
  // ---- energy ----
  coaster(){ return S(340,190,`<path d="M10,40 C60,40 70,170 140,170 C200,170 210,90 260,90 C300,90 310,150 330,150" class="fg-l" stroke="${CY}"/>
      ${C(30,36,9,AMB)}${T(30,22,"most PE","fg-a")}${C(140,162,9,GD)}${T(140,148,"most KE (fastest)","fg-t")}${T(170,188,"PE = mgh   ·   KE = ½mv²","fg-s")}`,"roller coaster energy"); },
  heat(){ return S(340,190,`${R(10,60,100,90,PNL,LN)}${L(30,140,95,70)}${T(60,170,"CONDUCTION","fg-c")}${T(60,186,"touching","fg-s")}
      ${R(120,60,100,90,PNL,LN)}<path d="M150,140 C130,110 140,80 170,75 C200,80 210,110 190,140" fill="none" stroke="${AMB}" stroke-width="3" marker-end="url(#ah)"/>${T(170,170,"CONVECTION","fg-c")}${T(170,186,"fluid loops","fg-s")}
      ${C(255,80,16,AMB)}${[0,1,2].map(i=>`<path d="M${275+i*0},${92+i*14} q8,-6 16,0 t16,0" fill="none" stroke="${AMB}" stroke-width="2.5"/>`).join("")}${T(280,170,"RADIATION","fg-c")}${T(280,186,"waves, no matter","fg-s")}
      ${ARW}`,"heat transfer"); },
  ramp(){ return S(340,170,`<polygon points="30,150 300,150 300,50" fill="rgba(79,216,255,.12)" class="fg-l"/>${R(180,72,30,26,AMB,"none",3)}
      ${T(170,170,"long distance, LESS force","fg-a")}${T(312,105,"height","fg-s","start")}`,"inclined plane"); },
  lever(){ return S(340,160,`${L(30,90,310,90)}<polygon points="170,92 150,130 190,130" fill="${AMB}"/>${R(40,60,40,30,BD,"none",3)}${A(290,40,290,86)}
      ${T(60,52,"load","fg-t")}${T(290,30,"effort","fg-t")}${T(170,150,"fulcrum (pivot)","fg-a")}`,"lever"); },
  // ---- waves ----
  wave(){ let d="M20,100"; for(let x=20;x<=320;x+=4) d+=` L${x},${100-50*Math.sin((x-20)/150*6.283)}`;
      return S(340,200,`${ARW}${L(20,100,320,100,"fg-d")}<path d="${d}" class="fg-l" stroke="${CY}"/>
      <line x1="57" y1="38" x2="207" y2="38" stroke="${AMB}" stroke-width="2.5" marker-start="url(#ah)" marker-end="url(#ah)"/>${T(132,30,"wavelength λ","fg-a")}
      <line x1="245" y1="100" x2="245" y2="54" stroke="${AMB}" stroke-width="2.5" marker-end="url(#ah)"/>${T(252,80,"amplitude","fg-a","start")}
      ${T(57,170,"crest ↑ at top · trough ↓ at bottom","fg-s","start")}${T(132,190,"more waves per second = higher frequency","fg-s")}`,"wave parts"); },
  longi(){ let s=""; const xs=[]; for(let i=0;i<40;i++){ const x=20+i*7.5+6*Math.sin(i/40*6.283*3); xs.push(x); s+=L(x,60,x,120).replace('class="fg-l"',`stroke="${CY}" stroke-width="2"`);}
      return S(340,170,s+T(60,150,"compression","fg-a")+T(170,150,"rarefaction","fg-s")+A(30,30,300,30)+T(170,22,"wave travels →, particles vibrate ↔","fg-s")+ARW,"longitudinal wave"); },

}

  while(out.length<n&&left.length){ const tot=left.reduce((a,i)=>a+weight(i.id),0); let r=Math.random()*tot, k=0;
    for(;k<left.length;k++){ r-=weight(left[k].id); if(r<=0) break; } out.push(left.splice(Math.min(k,left.length-1),1)[0]); }
  return out; }

  const r=rank(), pct=r.next?Math.round((P.xp-r.from)/(r.next-r.from)*100):100, mc=masteredChapters(), om=overallMastery();
  const weak=weakItems().length, wc=weakChapters()[0];
  const unstarted=CH.find(c=>chStats(c.id).seen===0);
  const sugg=wc&&wc.s.acc<70?{c:wc.c,why:`your lowest score (${wc.s.acc}% correct)`}:unstarted?{c:unstarted,why:"you haven't started it yet"}:null;
  $("#app").innerHTML=`
  <section class="panel hero">
    <div class="stack" style="gap:8px">
      <span class="label">Mission control</span>
      <h2>Ready for a quest, ${esc(P.name)}?</h2>
      <p>Final goal: master all 16 chapters of science and formulas. Get a question right twice in a row to master it. Anything you miss comes back at the end of the game for a Second Chance, with the answer explained.</p>
      <div class="bar" aria-label="Rank progress"><span style="width:${pct}%"></span></div>
      <span class="small muted">Rank ${r.i+1}: <b>${esc(r.name)}</b>${r.next?` · ${r.next-P.xp} XP to the next rank`:" · top rank!"}</span>
      ${sugg?`<div class="row" style="margin-top:6px"><button class="btn cyan sm" data-quick="${sugg.c.id}">Train ${sugg.c.icon} ${esc(sugg.c.name)}</button><span class="small muted">Suggested because ${sugg.why}.</span></div>`:""}
    </div>
    <div class="goal" aria-label="${mc} of 16 chapters mastered">${ring(om,`${mc}/16`,"chapters")}</div>
  </section>
  <section class="panel stack">
    <div class="sechead"><h2>Pick chapters</h2><span class="small muted">Used by Quest Run, Meteor Blaster and Lightning Round. Leave all off to mix every chapter.</span></div>
    <div class="chpick" id="chpick">${CH.map(c=>`<button class="chchip" style="--c:${c.c}" data-ch="${c.id}" aria-pressed="${P.sel.includes(c.id)}">${c.icon} ${c.n}. ${esc(c.name)}</button>`).join("")}</div>
    <div class="row"><button class="btn ghost sm" id="chall">Mix all chapters</button><span class="small muted" id="chcount">${P.sel.length?P.sel.length+" chapter"+(P.sel.length>1?"s":"")+" picked":"All 16 chapters mixed"}</span></div>
  </section>
  <div class="sechead"><h2>Choose a game</h2></div>
  <section class="modes">${MODES.map(m=>{ let tag=""; if(m.id==="weak") tag=weak?`${weak} question${weak>1?"s":""} to fix`:"Nothing missed yet"; else if(m.id==="exam") tag=P.examBest?`Best: ${P.examBest}%`:""; else if(m.id==="boss") tag=`${Object.keys(P.bosses).length}/${CH.length+1} bosses beaten`; else if(P.best[m.id]) tag="Best: "+P.best[m.id].toLocaleString();
    return `<button class="mode ${m.cls}" data-mode="${m.id}" ${m.id==="weak"&&!weak&&!wc?"disabled":""}><span class="pic" aria-hidden="true">${m.pic}</span><h3>${m.title}</h3><p>${m.desc}</p>${tag?`<span class="tag">${tag}</span>`:""}</button>`; }).join("")}</section>`;
  $("#chpick").onclick=e=>{ const b=e.target.closest("[data-ch]"); if(!b) return; const id=b.dataset.ch; P.sel=P.sel.includes(id)?P.sel.filter(x=>x!==id):[...P.sel,id]; save(); sfx.click(); renderPlay(); };
  $("#chall").onclick=()=>{ P.sel=[]; save(); renderPlay(); };
  $$("[data-mode]").forEach(b=>b.onclick=()=>{ sfx.click(); launch(b.dataset.mode); });
  $$("[data-quick]").forEach(b=>b.onclick=()=>briefing({mode:"quest",chs:[b.dataset.quick],title:"Quest Run"}));
}
function ring(p,big,small){ const r=52,c=2*Math.PI*r;
  return `<svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="${r}" fill="none" stroke="#193049" stroke-width="12"/>${p>0?`<circle cx="66" cy="66" r="${r}" fill="none" stroke="#5be49b" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}" transform="rotate(-90 66 66)"/>`:""}
  <text x="66" y="64" text-anchor="middle" style="font:400 26px var(--f-display);fill:var(--text)">${big}</text><text x="66" y="84" text-anchor="middle" style="font:800 11px var(--f-body);fill:var(--muted)">${small}</text><text x="66" y="100" text-anchor="middle" style="font:800 11px var(--f-body);fill:var(--good)">${p}% mastered</text></svg>`; }

function launch(mode){
  const chs=selChapters();
  if(mode==="quest") return briefing({mode,chs,title:"Quest Run"});
  if(mode==="lightning") return briefing({mode,chs,title:"Lightning Round"});
  if(mode==="blaster") return briefing({mode,chs,title:"Meteor Blaster"});
  if(mode==="forge") return briefing({mode,chs:["mathf","sciform"],title:"Formula Forge"});
  if(mode==="exam") return briefing({mode,chs:CH.map(c=>c.id),title:"Practice Exam"});
  if(mode==="weak"){ const wi=weakItems(); let chs=[...new Set([...wi.map(i=>i.ch),...weakChapters().filter(x=>x.s.acc<70).map(x=>x.c.id)])];
    if(!chs.length) chs=weakChapters().slice(0,2).map(x=>x.c.id); if(!chs.length){ toast("Nothing to fix yet. Play a game first!"); return; } return briefing({mode,chs,title:"Weakness Gym"}); }
  if(mode==="boss") return bossMenu();
}

// ---- briefing: shows which chapters this game covers ----
function briefing(cfg){
  leaveGame(); G={briefing:true}; renderTabs();
  const rules={quest:"10 questions. Correct = 100 points plus a streak bonus. One 50/50 power-up.",lightning:"60 seconds on the clock. Every right answer adds 2 seconds.",
    blaster:"Shoot the meteor with the right letter. Tap a meteor, press 1–4 or A–D, or use ← → and Space. 3 shields.",forge:"10 formula problems. The numbers change every time, so you have to really use the formula.",
    exam:"32 questions, 2 from every chapter. No hints and no feedback until the end, just like the real test.",weak:"10 questions you missed before, plus questions from your weakest chapters."};
  $("#app").innerHTML=`<section class="panel stack">
    <span class="label">Mission briefing</span><h2>${cfg.title}</h2><p style="margin:0">${rules[cfg.mode]||""}</p>
    <div class="stack" style="gap:8px"><span class="label">This game covers</span><div class="chpick">${cfg.chs.map(id=>{const c=CHM[id];return `<span class="chchip" style="--c:${c.c}" aria-pressed="true">${c.icon} ${c.n}. ${esc(c.name)}</span>`;}).join("")}</div></div>
    <p class="small muted" style="margin:0">Missed questions are not shown during the game. At the end you get a Second Chance at each one, then the full explanation with a diagram.</p>
    <div class="row"><button class="btn" id="go">Start</button><button class="btn ghost" data-tab="play">Back</button></div></section>`;
  $("#go").onclick=()=>{ sfx.click(); cfg.mode==="blaster"?startBlaster(cfg):startQuiz(cfg); };
  $("#go").focus();
}

// ================= QUIZ ENGINE =================
function makeList(cfg){
  const pool=cfg.chs.flatMap(id=>BYCH[id]);
  if(cfg.mode==="exam") return CH.flatMap(c=>pickItems(BYCH[c.id],2)).sort(()=>Math.random()-.5);
  if(cfg.mode==="weak"){ const wi=weakItems().slice(0,10); const rest=pickItems(pool.filter(i=>!wi.includes(i)&&!mastered(i.id)),10-wi.length); return shuffle([...wi,...rest]); }
  if(cfg.mode==="lightning") return pickItems(pool,pool.length);
  if(cfg.mode==="boss") return pickItems(pool,pool.length);
  return pickItems(pool,Math.min(10,pool.length));
}
function newGame(cfg){ const list=makeList(cfg).map(build);
  return Object.assign({mode:cfg.mode,title:cfg.title,chs:cfg.chs,list,i:0,score:0,streak:0,bestStreak:0,log:[],answered:false,fifty:cfg.mode==="quest"?1:0,removed:[]},cfg.extra||{}); }
function startQuiz(cfg){
  G=newGame(cfg);
  if(cfg.mode==="lightning"){ G.time=60; G.tick=setInterval(()=>{ if(!G||G.mode!=="lightning") return; G.time=Math.max(0,G.time-.1); const t=$("#timer"); if(t) t.textContent=G.time.toFixed(1)+"s"; if(G.time<=0){ clearInterval(G.tick); finish(); } },100); G.stop=()=>clearInterval(G.tick); }
  G.t0=Date.now(); renderQ();
}
function record(rq,pick,ok){
  const s=st(rq.id); if(ok){ s.c++; s.s++; } else { s.w++; s.s=0; P.miss[rq.id]={q:rq.q,a:rq.aText,why:rq.why,svg:rq.svg,t:Date.now()}; }
  if(ok&&s.s>=2&&P.miss[rq.id]) delete P.miss[rq.id];
  G.log.push({rq,pick,ok}); save();
}
function dotsHTML(){ if(G.mode==="lightning"||G.mode==="boss") return "";
  return `<div class="dots" aria-hidden="true">${G.list.map((_,k)=>{const l=G.log[k];return `<i class="${l?(l.ok?"ok":"no"):(k===G.i?"now":"")}"></i>`;}).join("")}</div>`; }
function optsHTML(rq,opts){ return `<div class="options" id="opts">${rq.opts.map((o,k)=>`<button class="opt ${opts&&opts[k]||""}" data-o="${k}" ${G.answered?"disabled":""}><span class="k">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>`; }
function chtag(ch){ const c=CHM[ch]; return `<span class="chtag" style="--c:${c.c}">${c.icon} Ch. ${c.n} · ${esc(c.name)}</span>`; }
function renderQ(){
  const rq=G.list[G.i]; if(!rq) return finish(); G.answered=false; G.removed=[];
  const top=G.mode==="lightning"?`<span class="timer" id="timer" aria-live="off">${G.time.toFixed(1)}s</span>`:`<span class="small muted">Question ${G.i+1} of ${G.list.length}</span>`;
  $("#app").innerHTML=`${G.mode==="boss"?arenaHTML():""}<section class="panel stack" style="gap:16px">
    <div class="gamebar"><span class="label">${esc(G.title)}</span>${top}<span class="streak">${G.streak>=2?"🔥 "+G.streak+" streak":""}</span><span class="chip">Score <b>${G.score.toLocaleString()}</b></span></div>
    ${dotsHTML()}
    <div>${chtag(rq.ch)}</div>
    <div class="qtext">${esc(rq.q)}</div>
    ${optsHTML(rq)}
    <div class="helpers">${G.mode==="quest"?`<button id="fifty" ${G.fifty?"":"disabled"}>✂️ 50/50 (${G.fifty} left)</button>`:""}<button id="quit">Quit game</button></div>
    <div id="fb" aria-live="polite"></div></section>`;
  bindQ(rq);
}
function bindQ(rq){
  $("#opts").onclick=e=>{ const b=e.target.closest("[data-o]"); if(b&&!b.disabled) answer(+b.dataset.o); };
  const f=$("#fifty"); if(f) f.onclick=()=>{ if(!G.fifty||G.answered) return; G.fifty--; const wrong=shuffle(rq.opts.map((_,k)=>k).filter(k=>k!==rq.ans)).slice(0,2); G.removed=wrong;
    wrong.forEach(k=>{const b=$(`[data-o="${k}"]`); b.classList.add("gone"); b.disabled=true;}); f.disabled=true; f.textContent="✂️ 50/50 used"; };
  $("#quit").onclick=()=>{ if(G.log.length) finish(true); else goTab("play"); };
}
function answer(k){
  if(!G||G.answered||G.done) return; const rq=G.list[G.i]; G.answered=true; const ok=k===rq.ans; record(rq,k,ok);
  let pts=0; if(ok){ G.streak++; G.bestStreak=Math.max(G.bestStreak,G.streak); pts=(G.mode==="lightning"?50:100)+Math.min(G.streak-1,10)*10; if(G.removed.length) pts=Math.round(pts/2); G.score+=pts; } else G.streak=0;
  ok?sfx.good():sfx.bad();
  const btns=$$(".opt"); btns.forEach(b=>b.disabled=true);
  btns[k].classList.add(G.mode==="exam"?"picked":ok?"correct":"wrong");
  if(G.mode==="exam"){ setTimeout(next,280); return; }
  if(G.mode==="lightning"){ if(ok) G.time+=2; setTimeout(next,ok?450:800); return; }
  if(G.mode==="boss") bossHit(ok);
  const fb=$("#fb");
  if(ok) fb.innerHTML=`<div class="feedback good"><h3>Correct! +${pts}</h3><p>${rq.why}</p>${rq.svg?`<div class="qfig">${rq.svg}</div>`:""}<div class="row"><button class="btn" id="nx">${G.over?"See results":"Next"}</button></div></div>`;
  else fb.innerHTML=`<div class="feedback bad"><h3>Not this time.</h3><p>This one is saved for your <b>Second Chance</b> at the end of the game. Think about it, because you'll get to try again before you see the answer.</p><div class="row"><button class="btn" id="nx">${G.over?"See results":"Next"}</button></div></div>`;
  $("#nx").onclick=next; $("#nx").focus({preventScroll:true});
}
function next(){ if(!G||G.done) return; if(G.over) return finish(); G.i++; if(G.mode==="lightning"&&G.i>=G.list.length){ G.list.push(...makeList(G).map(build)); } if(G.i>=G.list.length) return finish(); renderQ(); }
document.addEventListener("keydown",e=>{
  if(!G||G.blaster||e.target.matches("input,textarea")) return;
  const m={"1":0,"2":1,"3":2,"4":3,a:0,b:1,c:2,d:3}[e.key.toLowerCase()];
  if(G.retry){ if(m!==undefined&&!G.retry.answered) retryAnswer(m); else if(e.key==="Enter"&&$("#rnx")){ e.preventDefault(); $("#rnx").click(); } return; }
  if(G.list&&!G.answered&&m!==undefined){ const b=$(`[data-o="${m}"]`); if(b&&!b.disabled) answer(m); }
  else if(e.key==="Enter"&&$("#nx")){ e.preventDefault(); $("#nx").click(); }
});

// ================= BOSS =================
const FINAL={id:"final",name:"Dragon Zombie King",pic:"🐲",hp:10};
function bossMenu(){
  leaveGame(); G={briefing:true}; renderTabs();
  const card=(id,name,pic,sub,beaten)=>`<button class="mode" data-boss="${id}"><span class="pic" aria-hidden="true">${pic}</span><h3>${esc(name)}</h3><p>${sub}</p>${beaten?`<span class="tag">✔ Defeated</span>`:""}</button>`;
  $("#app").innerHTML=`<section class="panel stack"><span class="label">Boss Battles</span><h2>Choose your boss</h2>
    <p style="margin:0">Each right answer hits the boss. A streak of 3 or more lands a <b>critical hit</b> for double damage. A wrong answer costs one of your 3 hearts. Beat every chapter boss, then face the Dragon Zombie King.</p>
    <div class="modes">${CH.map(c=>card(c.id,c.boss[0],c.boss[1],`Ch. ${c.n}: ${esc(c.name)}`,P.bosses[c.id])).join("")}${card("final",FINAL.name,FINAL.pic,"Final boss · questions from ALL chapters · 10 HP",P.bosses.final)}</div>
    <div><button class="btn ghost" data-tab="play">Back</button></div></section>`;
  $$("[data-boss]").forEach(b=>b.onclick=()=>{ const id=b.dataset.boss; sfx.click();
    if(id==="final") startQuiz({mode:"boss",chs:CH.map(c=>c.id),title:"Boss: "+FINAL.name,extra:{boss:{id,name:FINAL.name,pic:FINAL.pic,hp:FINAL.hp,max:FINAL.hp},hearts:3}});
    else { const c=CHM[id]; startQuiz({mode:"boss",chs:[id],title:"Boss: "+c.boss[0],extra:{boss:{id,name:c.boss[0],pic:c.boss[1],hp:6,max:6},hearts:3}}); } });
}
function arenaHTML(){ const B=G.boss;
  return `<section class="panel arena" aria-label="Boss battle"><div class="fighter"><span class="pic" id="mepic" aria-hidden="true">🧑‍🚀</span><span class="nm">${esc(P.name)}</span><span class="hearts" aria-label="${G.hearts} hearts">${"❤️".repeat(G.hearts)}${"🖤".repeat(3-G.hearts)}</span></div>
  <span class="vs">VS</span><div class="fighter"><span class="pic" id="bosspic" aria-hidden="true">${B.pic}</span><span class="nm">${esc(B.name)}</span><div class="hp" aria-label="Boss HP ${B.hp} of ${B.max}"><span style="width:${B.hp/B.max*100}%"></span></div></div></section>`; }
function bossHit(ok){ const B=G.boss;
  let dmg=0; if(ok){ dmg=G.streak>=3?2:1; B.hp=Math.max(0,B.hp-dmg); sfx.hit(); if(dmg>1) toast("CRITICAL HIT! Double damage!"); } else G.hearts--;
  const a=document.querySelector(".arena"); if(a) a.outerHTML=arenaHTML();
  const p=$(ok?"#bosspic":"#mepic"); if(p) p.classList.add(ok?"hitboss":"hitme");
  if(B.hp<=0){ G.over=true; G.won=true; } else if(G.hearts<=0){ G.over=true; }
}

// ================= FINISH / RESULTS =================
function finish(quit){
  if(!G||G.done) return; if(G.stop) G.stop(); G.done=true; G.answered=true;
  const right=G.log.filter(l=>l.ok).length, total=G.log.length, acc=total?Math.round(right/total*100):0;
  let bonus=0;
  if(G.mode==="boss"&&G.won){ bonus=G.boss.id==="final"?1500:500; if(!P.bosses[G.boss.id]) toast("Boss defeated! Trophy unlocked."); P.bosses[G.boss.id]=true; }
  if(G.mode==="exam"&&!quit) P.examBest=Math.max(P.examBest||0,acc);
  G.score+=bonus;
  const before=rank().i;
  P.score+=G.score; P.xp+=Math.round(G.score/10)+total*2; P.games++; if(!P.days.includes(today())) P.days.push(today());
  P.best[G.mode]=Math.max(P.best[G.mode]||0,G.score);
  P.hist.unshift({d:Date.now(),m:G.title,s:G.score,r:right,t:total}); P.hist=P.hist.slice(0,40); save();
  const lvUp=rank().i>before;
  G.missed=G.log.filter(l=>!l.ok);
  const per={}; G.log.forEach(l=>{ const o=per[l.rq.ch]||(per[l.rq.ch]={r:0,t:0}); o.t++; if(l.ok) o.r++; });
  const title=G.mode==="boss"?(G.won?"Boss defeated!":"The boss won this time"):G.mode==="exam"?(acc>=70?"You passed!":"Not passing yet"):acc===100&&total?"Perfect game!":acc>=80?"Awesome work!":acc>=60?"Good effort!":"Keep training!";
  renderStats(); renderTabs();
  $("#app").innerHTML=`<section class="panel stack" style="gap:16px">
    <span class="label">${esc(G.title)} · results</span>
    <div class="row" style="gap:24px;align-items:flex-end"><div><div class="big">${G.score.toLocaleString()}</div><span class="small muted">points${bonus?` (includes +${bonus} boss bonus)`:""}</span></div>
      <div><div class="big" style="color:${acc>=70?"var(--good)":"var(--bad)"}">${acc}%</div><span class="small muted">${right} of ${total} correct${G.mode==="exam"?" · pass mark 70%":""}</span></div></div>
    <h2>${title}</h2>
    ${lvUp?`<div class="feedback good"><h3>Rank up! You are now a ${esc(rank().name)}.</h3></div>`:""}
    <div class="stack" style="gap:8px"><span class="label">Chapters in this game</span>
      <div class="tablewrap"><table class="hist"><thead><tr><th>Chapter</th><th>Right</th><th>Result</th></tr></thead><tbody>
      ${Object.entries(per).map(([ch,o])=>`<tr><td>${CHM[ch].icon} ${CHM[ch].n}. ${esc(CHM[ch].name)}</td><td>${o.r} / ${o.t}</td><td>${o.r===o.t?`<span class="pill done">Got it</span>`:`<span class="pill weak">Review</span>`}</td></tr>`).join("")}
      </tbody></table></div></div>
    ${G.missed.length?`<div class="feedback info"><h3>${G.missed.length} question${G.missed.length>1?"s":""} to review</h3><p>Try ${G.missed.length>1?"each one":"it"} once more. After your second try you'll see the right answer, where it is in the book, and why.</p>
      <div class="row"><button class="btn" id="retry">Start Second Chance</button><button class="btn ghost" id="showall">Just show me the answers</button></div></div>`
      :`<div class="feedback good"><h3>No mistakes to review!</h3><p>Every answer was right. Questions you get right twice in a row count as mastered.</p></div>`}
    <div class="row"><button class="btn ${G.missed.length?"ghost":""}" id="again">Play again</button><button class="btn ghost" data-tab="dash">Dashboard</button><button class="btn ghost" data-tab="play">Home</button></div></section>`;
  if(!G.missed.length&&total) { sfx.win(); confetti(140); } else if(G.won){ sfx.win(); confetti(160); }
  const cfg={mode:G.mode,chs:G.chs,title:G.title,boss:G.boss};
  $("#again").onclick=()=>{ if(cfg.mode==="boss") return bossMenu(); if(cfg.mode==="weak") return launch("weak"); briefing(cfg); };
  if(G.missed.length){ $("#retry").onclick=startRetry; $("#showall").onclick=()=>recap(true); $("#retry").focus({preventScroll:true}); }
  window.scrollTo({top:0});
}

// ================= SECOND CHANCE =================
function startRetry(){ G.retry={list:G.missed.map(l=>({first:l.pick,rq:reshuffleKeep(l.rq,l.pick)})),i:0,res:[]}; renderRetry(); }
function reshuffleKeep(rq,pick){ const r=reshuffle(rq); r.firstText=pick==null?null:rq.opts[pick]; return r; }
function renderRetry(){
  const R=G.retry, it=R.list[R.i]; if(!it) return recap(false); R.answered=false; const rq=it.rq;
  $("#app").innerHTML=`<section class="panel stack" style="gap:16px">
    <div class="gamebar"><span class="label">Second Chance · ${R.i+1} of ${R.list.length}</span><span class="small muted">The answers are in a new order.</span></div>
    <div>${chtag(rq.ch)}</div><div class="qtext">${esc(rq.q)}</div>
    ${rq.firstText?`<p class="small muted" style="margin:0">Your first answer was <b>${esc(rq.firstText)}</b>. That one isn't right.</p>`:`<p class="small muted" style="margin:0">Last time this meteor reached the ground before you answered.</p>`}
    <div class="options" id="ropts">${rq.opts.map((o,k)=>`<button class="opt" data-o="${k}"><span class="k">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
    <div id="rfb" aria-live="polite"></div></section>`;
  $("#ropts").onclick=e=>{ const b=e.target.closest("[data-o]"); if(b&&!b.disabled) retryAnswer(+b.dataset.o); };
  window.scrollTo({top:0});
}
function retryAnswer(k){
  const R=G.retry; if(R.answered) return; R.answered=true; const it=R.list[R.i], rq=it.rq, ok=k===rq.ans;
  R.res.push({rq,first:rq.firstText,second:rq.opts[k],ok});
  if(ok){ const s=st(rq.id); s.c++; s.s=1; P.score+=50; P.xp+=5; sfx.good(); } else sfx.bad(); save(); renderStats();
  $$("#ropts .opt").forEach((b,j)=>{ b.disabled=true; if(j===rq.ans) b.classList.add("correct"); else if(j===k) b.classList.add("wrong"); });
  $("#rfb").innerHTML=`<div class="feedback ${ok?"good":"bad"}"><h3>${ok?"You got it on the second try! +50":"Here's the right answer"}</h3>${explainHTML(rq,rq.firstText,rq.opts[k])}
    <div class="row"><button class="btn" id="rnx">${R.i+1<R.list.length?"Next question":"See my lesson recap"}</button></div></div>`;
  $("#rnx").onclick=()=>{ R.i++; renderRetry(); }; $("#rnx").focus({preventScroll:true});
}
function explainHTML(rq,first,second){
  const tries=[]; if(first!==undefined) tries.push(["1st try",first]); if(second!==undefined) tries.push(["2nd try",second]);
  return `<div class="answers">
    <div class="ans ok"><span>✔</span><span>${esc(rq.aText)}</span><span class="who">correct answer</span></div>

const LANECOL=["#4fd8ff","#ffc23d","#f78fd6","#5be49b"];
function startBlaster(cfg){
  G=newGame(cfg); G.list=G.list.slice(0,12); while(G.list.length<12){ G.list.push(...makeList(cfg).map(build)); G.list=G.list.slice(0,12); }
  G.blaster=true; G.lives=3;
  $("#app").innerHTML=`<section class="panel stack" style="gap:12px">
    <div class="gamebar"><span class="label">Meteor Blaster</span><span class="small muted" id="bq-n"></span><span class="hearts" id="blives"></span><span class="chip">Score <b id="bscore">0</b></span></div>
    <div id="bchap"></div><div class="qtext" id="bq" style="font-size:clamp(17px,3vw,21px)"></div>
    <div class="bopts" id="bopts"></div>
    <div class="stage" id="stage"><canvas id="bcv" tabindex="0" aria-label="Meteor game. Press 1 to 4 to shoot a meteor."></canvas>
      <div class="overlay" id="bover"><div class="stack"><h2>Meteor Blaster</h2><p style="margin:0">Each meteor is an answer. Shoot the right one before it hits the ground!<br>Tap a meteor · keys 1–4 or A–D · ← → and Space</p><button class="btn" id="bgo">Launch</button></div></div></div>
    <div class="lanebtns">${LANECOL.map((c,k)=>`<button style="background:${c}" data-lane="${k}" aria-label="Shoot meteor ${"ABCD"[k]}">${"ABCD"[k]}</button>`).join("")}</div>
    <div class="helpers"><button id="bquit">Quit game</button></div></section>`;
  const cv=$("#bcv"), cx=cv.getContext("2d"), stage=$("#stage"); let W=600,H=420,raf=0,last=0;
  const S={ship:{x:0,lane:0},met:[],bul:[],fx:[],txt:[],stars:[],state:"idle",wait:0,shake:0};
  function size(){ W=stage.clientWidth; H=Math.round(Math.min(460,Math.max(320,W*.62))); const d=window.devicePixelRatio||1; cv.width=W*d; cv.height=H*d; cv.style.height=H+"px"; cx.setTransform(d,0,0,d,0,0);
    if(!S.stars.length) for(let i=0;i<70;i++) S.stars.push({x:Math.random(),y:Math.random(),s:Math.random()*1.6+.3,v:Math.random()*.03+.01}); S.ship.x=laneX(S.ship.lane); }
  const laneX=k=>W*(k+.5)/4;
  function hud(){ $("#bscore").textContent=G.score.toLocaleString(); $("#blives").innerHTML="🛡️".repeat(Math.max(0,G.lives))+"<span style='opacity:.3'>"+"🛡️".repeat(3-Math.max(0,G.lives))+"</span>"; $("#bq-n").textContent=`Meteor wave ${Math.min(G.i+1,G.list.length)} of ${G.list.length}`; }
  function loadQ(){ const rq=G.list[G.i]; $("#bchap").innerHTML=chtag(rq.ch); $("#bq").textContent=rq.q;
    $("#bopts").innerHTML=rq.opts.map((o,k)=>`<div class="bopt"><span class="k" style="background:${LANECOL[k]}">${"ABCD"[k]}</span><span>${esc(o)}</span></div>`).join("");
    const fall=Math.max(9,17-G.i*.6); S.met=rq.opts.map((_,k)=>({k,y:-30-Math.random()*40,v:(H-70)/fall,alive:true,rot:Math.random()*6,r:24})); S.state="play"; hud(); }
  function fire(k){ if(S.state!=="play") return; const m=S.met[k]; if(!m||!m.alive) return; S.ship.lane=k; S.bul.push({x:laneX(k),y:H-56,k}); sfx.laser(); }
  function boom(x,y,c,n){ for(let i=0;i<n;i++){const a=Math.random()*6.28,s=Math.random()*220+40;S.fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.5+Math.random()*.5,c});} }
  function say(x,y,t,c){ S.txt.push({x:Math.min(W-110,Math.max(110,x)),y,t,c,life:1.6}); }
  function resolve(k,timeout){
    const rq=G.list[G.i], ok=!timeout&&k===rq.ans; S.state="wait"; S.wait=ok?.9:1.5;
    record(rq,timeout?null:k,ok);
    if(ok){ G.streak++; G.bestStreak=Math.max(G.bestStreak,G.streak); const m=S.met[k]; const speedBonus=Math.round(Math.max(0,1-m.y/H)*50); const pts=100+Math.min(G.streak-1,10)*10+speedBonus; G.score+=pts;
      S.met.forEach(mm=>{ if(mm.alive){ boom(laneX(mm.k),mm.y,LANECOL[mm.k],mm.k===k?40:12); mm.alive=false; } }); say(laneX(k),m.y,"+"+pts+(G.streak>=3?" 🔥":""),"#5be49b"); sfx.boom(); }
    else { G.streak=0; G.lives--; S.shake=.4; sfx.bad(); const x=timeout?W/2:laneX(k), y=timeout?H-80:S.met[k].y;
      S.met.forEach(mm=>{ if(mm.alive){ boom(laneX(mm.k),mm.y,"#ff6b6b",10); mm.alive=false; } }); say(x,y,timeout?"Too slow! Saved for review":"Wrong meteor! Saved for review","#ff6b6b"); }
    hud();
  }
  function update(dt){
    S.stars.forEach(s=>{ s.y+=s.v*dt*3; if(s.y>1){s.y=0;s.x=Math.random();} });
    S.ship.x+=(laneX(S.ship.lane)-S.ship.x)*Math.min(1,dt*14);
    if(S.state==="play"){ S.met.forEach(m=>{ m.y+=m.v*dt; m.rot+=dt; }); if(S.met.some(m=>m.alive&&m.y>H-62)) resolve(null,true); }
    S.bul.forEach(b=>{ b.y-=760*dt; const m=S.met[b.k]; if(S.state==="play"&&m&&m.alive&&b.y<m.y+m.r){ b.dead=true; resolve(b.k,false); } }); S.bul=S.bul.filter(b=>!b.dead&&b.y>-20);
    S.fx.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.life-=dt;}); S.fx=S.fx.filter(p=>p.life>0);
    S.txt.forEach(t=>{t.y-=30*dt;t.life-=dt;}); S.txt=S.txt.filter(t=>t.life>0); S.shake=Math.max(0,S.shake-dt);
    if(S.state==="wait"){ S.wait-=dt; if(S.wait<=0){ G.i++; if(G.lives<=0||G.i>=G.list.length){ S.state="over"; end(); } else loadQ(); } }
  }
  function draw(){ cx.save(); if(S.shake>0&&!reduce) cx.translate((Math.random()-.5)*12*S.shake,(Math.random()-.5)*12*S.shake);
    cx.fillStyle="#050b14"; cx.fillRect(-20,-20,W+40,H+40);
    S.stars.forEach(s=>{cx.fillStyle="rgba(234,244,255,.7)";cx.fillRect(s.x*W,s.y*H,s.s,s.s);});
    for(let k=1;k<4;k++){ cx.strokeStyle="rgba(79,216,255,.07)"; cx.beginPath(); cx.moveTo(W*k/4,0); cx.lineTo(W*k/4,H); cx.stroke(); }
    cx.fillStyle="rgba(255,107,107,.18)"; cx.fillRect(0,H-40,W,40); cx.fillStyle="#ff6b6b"; cx.fillRect(0,H-40,W,2);
    S.met.forEach(m=>{ if(!m.alive) return; const x=laneX(m.k); cx.save(); cx.translate(x,m.y);
      cx.fillStyle="rgba(255,140,60,.25)"; cx.beginPath(); cx.moveTo(-14,-10); cx.lineTo(0,-60); cx.lineTo(14,-10); cx.fill();
      cx.rotate(m.rot); cx.fillStyle="#5a4a3e"; cx.beginPath(); for(let i=0;i<9;i++){const a=i/9*6.283, rr=m.r*(i%2?.86:1); cx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);} cx.closePath(); cx.fill();
      cx.lineWidth=4; cx.strokeStyle=LANECOL[m.k]; cx.stroke(); cx.restore();
      cx.fillStyle="#fff"; cx.font="400 20px Bungee, Impact, sans-serif"; cx.textAlign="center"; cx.textBaseline="middle"; cx.fillText("ABCD"[m.k],x,m.y+1); });
    S.bul.forEach(b=>{ cx.fillStyle=LANECOL[b.k]; cx.fillRect(b.x-2.5,b.y-14,5,16); });
    const sx=S.ship.x, sy=H-50; cx.fillStyle="#eaf4ff"; cx.beginPath(); cx.moveTo(sx,sy-20); cx.lineTo(sx+18,sy+14); cx.lineTo(sx,sy+6); cx.lineTo(sx-18,sy+14); cx.closePath(); cx.fill();
    cx.fillStyle=LANECOL[S.ship.lane]; cx.beginPath(); cx.arc(sx,sy,5,0,6.283); cx.fill();
    S.fx.forEach(p=>{cx.globalAlpha=Math.max(0,p.life);cx.fillStyle=p.c;cx.fillRect(p.x-2,p.y-2,4,4);}); cx.globalAlpha=1;
    S.txt.forEach(t=>{cx.globalAlpha=Math.min(1,t.life);cx.fillStyle=t.c;cx.font="900 17px Nunito, sans-serif";cx.textAlign="center";cx.fillText(t.t,t.x,t.y);}); cx.globalAlpha=1;
    cx.restore(); }
  function frame(ts){ const dt=Math.min(.05,(ts-(last||ts))/1000); last=ts; if(!document.hidden) update(dt); draw(); if(S.state!=="over") raf=requestAnimationFrame(frame); }
  const KM={arrowleft:-1,arrowright:1};
  function key(e){ if(!G||!G.blaster||S.state==="idle") return; const k=e.key.toLowerCase();
    const m={"1":0,"2":1,"3":2,"4":3,a:0,b:1,c:2,d:3}[k];
    if(m!==undefined){ fire(m); e.preventDefault(); } else if(KM[k]){ S.ship.lane=Math.max(0,Math.min(3,S.ship.lane+KM[k])); e.preventDefault(); } else if(k===" "||k==="arrowup"){ fire(S.ship.lane); e.preventDefault(); } }
  function end(){ cancelAnimationFrame(raf); setTimeout(()=>{ if(G&&G.blaster) { G.blaster=false; finish(); } },300); }
  cv.addEventListener("pointerdown",e=>{ const r=cv.getBoundingClientRect(); fire(Math.max(0,Math.min(3,Math.floor((e.clientX-r.left)/r.width*4)))); });
  $$("[data-lane]").forEach(b=>b.onclick=()=>fire(+b.dataset.lane));
  document.addEventListener("keydown",key); addEventListener("resize",size);
  G.stop=()=>{ cancelAnimationFrame(raf); document.removeEventListener("keydown",key); removeEventListener("resize",size); };
  $("#bquit").onclick=()=>{ if(G.log.length){ G.blaster=false; finish(true); } else goTab("play"); };
  $("#bgo").onclick=()=>{ $("#bover").hidden=true; sfx.click(); loadQ(); cv.focus({preventScroll:true}); };
  size(); loadQ(); S.state="idle"; hud(); raf=requestAnimationFrame(frame);
  const rq0=G.list[0]; $("#bq").textContent=rq0.q;
  $("#bgo").focus();
}

  $("#copy").onclick=()=>{ const t=$("#bk"); const ok=()=>toast("Backup code copied"); try{ navigator.clipboard.writeText(t.value).then(ok,()=>{t.select();toast("Selected. Press Ctrl+C to copy");}); }catch(e){ t.select(); toast("Selected. Press Ctrl+C to copy"); } };
  $("#load").onclick=()=>{ try{ const d=JSON.parse(decodeURIComponent(escape(atob($("#imp").value.trim())))); if(!d||typeof d!=="object"||!d.q) throw 0; P=Object.assign(DEF(),d); save(); render(); toast("Backup loaded"); }catch(e){ $("#impmsg").textContent="That code didn't work. Copy the whole code and try again."; } };
  $("#reset").onclick=()=>{ $("#resetzone").innerHTML=`<div class="confirm"><b>Erase every score, trophy and mistake? This can't be undone.</b><div class="row"><button class="btn sm" id="rsyes" style="background:var(--bad);box-shadow:none">Yes, erase everything</button><button class="btn sm ghost" id="rsno">Keep my progress</button></div></div>`;
    $("#rsyes").onclick=()=>{ const keep={name:P.name,book:P.book,sound:P.sound}; P=Object.assign(DEF(),keep); save(); render(); toast("Progress reset"); }; $("#rsno").onclick=renderSettings; };
}

render();
</script>
</body>
</html>
